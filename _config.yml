# GitHub Pages（Jekyll）の公開対象から、作業中の草案を外す。
#
# 2026-08-13、先行版をアドバイザー25名へ配る直前に判明：
# 没にした設問草案・口述の生データ・根拠台帳が、公開URLからそのまま読めていた
# （いずれも HTTP 200）。禁止語や旧表現が残っているだけでなく、
# **直す前の誤った設問が「正しいもの」として読まれる**危険があった。
#
# ファイルは削除しない（履歴・経緯として残す）。公開だけ止める。
# 戻したいときは、このファイルの exclude から外す。
