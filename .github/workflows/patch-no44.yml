name: One-shot patch No.44 start period

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch No.44 wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('3〜4か月はみてください', '4〜5か月はみてください'),
              ('3〜4か月という目安は言える', '4〜5か月という目安は言える'),
              ('書類だけでは始まらない。3〜4か月はかかる', '書類だけでは始まらない。4〜5か月はかかる'),
              ('全員が未加入の会社なら3か月以上みる。経営者に「来月から」と言われても、この見通しをそのままお伝えする。', '全員が未加入の会社なら4〜5か月はみる。3か月での開始は見込まない。経営者に「来月から」と言われても、この見通しをそのままお伝えする。'),
              ('ただし一律ではない。未加入の方のiDeCo加入手続に通常1〜2か月、これに労使合意・事業所登録・開始届の準備が乗る。すでに加入済みの方が多ければ短くなる。', '未加入の方のiDeCo加入手続に通常1〜2か月かかり、これに労使合意・事業所登録・開始届の準備が乗る。すでに加入済みの方が多い場合でも、実務上の案内は4〜5か月を基本とする。'),
          ]
          for old, new in pairs:
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {s.count(old)}')
                  s = s.replace(old, new)
              elif new not in s:
                  raise SystemExit(f'Neither old nor new wording found: {old!r}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run repository preflight
        run: python3 tools/preflight.py
      - name: Remove one-shot files
        run: |
          rm -f docs/.patch-no44-trigger
          rm -f .github/workflows/patch-no44.yml
      - name: Commit patch to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: set No.44 start period to 4-5 months'
          git push origin HEAD:${{ github.head_ref }}
