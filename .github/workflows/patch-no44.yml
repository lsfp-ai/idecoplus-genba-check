name: One-shot patch Aug 18 fixes

on:
  push:
    branches: [main]
    paths:
      - 'docs/.patch-aug18-run'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch No.42 and No.44 with update history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # No.42: 質問だけ読んでもiDeCo+の掛金だと分かるようにする。
          old42 = '（経営者）業績次第で掛金を増やしたり減らしたりできる？'
          new42 = '（経営者）iDeCo＋の掛金は、業績次第で増やしたり減らしたりできる？'
          if old42 in s:
              if s.count(old42) != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of No.42 old wording, found {s.count(old42)}')
              s = s.replace(old42, new42, 1)
          elif new42 not in s:
              raise SystemExit('No.42 wording not found')

          # No.44: 開始目安を4〜5か月基準へ統一する。
          pairs = [
              ('3〜4か月はみてください', '4〜5か月はみてください'),
              ('3〜4か月という目安は言える', '4〜5か月という目安は言える'),
              ('書類だけでは始まらない。3〜4か月はかかる', '書類だけでは始まらない。4〜5か月はかかる'),
              ('全員が未加入の会社なら3か月以上みる。経営者に「来月から」と言われても、この見通しをそのままお伝えする。', '全員が未加入の会社なら4〜5か月はみる。3か月での開始は見込まない。経営者に「来月から」と言われても、この見通しをそのままお伝えする。'),
              ('ただし一律ではない。未加入の方のiDeCo加入手続に通常1〜2か月、これに労使合意・事業所登録・開始届の準備が乗る。すでに加入済みの方が多ければ短くなる。', '未加入の方のiDeCo加入手続に通常1〜2か月かかり、これに労使合意・事業所登録・開始届の準備が乗る。すでに加入済みの方が多い場合でも、実務上の案内は4〜5か月を基本とする。'),
          ]
          for old, new in pairs:
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {s.count(old)}')
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Neither old nor new wording found: {old!r}')

          # ホームの更新表示を、マニュアル更新履歴の最新日付と揃える。
          pat = r"const UPDATED='[^']+', UPDATED_WHAT='[^']*';"
          new_update = "const UPDATED='2026年8月18日', UPDATED_WHAT='No.42・No.44を修正しました。';"
          if not re.search(pat, s):
              raise SystemExit('index.html update notice not found')
          s = re.sub(pat, new_update, s, count=1)
          p.write_text(s, encoding='utf-8')

          # manual.html 更新履歴。今日の2件を同じ日付にまとめる。
          mp = Path('manual.html')
          m = mp.read_text(encoding='utf-8')
          entry = '''<h3>2026年8月18日</h3>
<ul>
<li><b>No.42の質問文に「iDeCo＋」を明記しました。</b>「業績次第で掛金を増やしたり減らしたりできる？」だけでは何の掛金か分かりにくいため、「iDeCo＋の掛金は」と明示しました。回答内容は変えていません。</li>
<li><b>No.44の開始目安を「4〜5か月」に修正しました。</b>「3〜4か月」「3か月以上」という案内をやめ、正解・よくある言い間違い・解説・誤答の補足をすべて4〜5か月基準に統一しました。実務上は3か月での開始を見込まない前提で案内します。</li>
</ul>

'''
          marker = '<h3>2026年8月14日</h3>'
          if '<h3>2026年8月18日</h3>' in m:
              start = m.index('<h3>2026年8月18日</h3>')
              end = m.find('<h3>', start + len('<h3>2026年8月18日</h3>'))
              if end == -1:
                  raise SystemExit('Could not find end of Aug 18 update block')
              m = m[:start] + entry + m[end:]
          else:
              if marker not in m:
                  raise SystemExit('manual.html update-history insertion point not found')
              m = m.replace(marker, entry + marker, 1)
          mp.write_text(m, encoding='utf-8')
          PY
      - name: Run repository preflight
        run: python3 tools/preflight.py
      - name: Remove one-shot files
        run: |
          rm -f docs/.patch-aug18-run
          rm -f .github/workflows/patch-no44.yml
      - name: Commit to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: record Aug 18 No.42 and No.44 updates'
          git push origin HEAD:main
