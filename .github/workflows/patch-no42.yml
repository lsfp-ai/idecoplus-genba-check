name: One-shot patch No.42 wording

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch No.42 wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '（経営者）業績次第で掛金を増やしたり減らしたりできる？'
          new = '（経営者）iDeCo＋の掛金は、業績次第で増やしたり減らしたりできる？'
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly 1 old string, found {s.count(old)}')
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Neither expected old nor new wording was found')
          PY
      - name: Run repository preflight
        run: python3 tools/preflight.py
      - name: Remove one-shot trigger files
        run: |
          rm -f docs/.patch-no42-trigger
          rm -f .github/workflows/patch-no42.yml
      - name: Commit patch to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clarify No.42 as iDeCo+ question'
          git push origin HEAD:${{ github.head_ref }}
