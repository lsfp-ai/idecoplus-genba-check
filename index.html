>のが正解。<br><br>「自社の商品しか売らない」「担当者が知らない」は、<strong>他社の内情を決めつけています</strong>。悪口として言うと、経営者は「この人は他社の悪口を言う人だ」と受け取ります。<br><br>「儲からない」は構造の説明なので、誰も貶めずに答えになります。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp"}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの質問", "ask": "（経営者）その資格、本当に持ってるかどうか、こっちは確かめようがないよね？", "opts": [{"x": "全部、公開されています。その場で調べていただいて構いません", "r": "ok"}, {"x": "そう言われましても、こればかりは信用していただくしかありません", "r": "timid", "m": [["信用していただくしかありません", "全部公開されている。その場で調べてもらえばよい"]]}, {"x": "そう疑われるなら、他をあたっていただいて構いません。無理にとは申しません", "r": "wrong", "m": [["他をあたっていただいて", "当然の確認。突き放す場面ではない"]]}], "ex": "この質問に即答できるかどうかで、信用が決まります。<br><br>金融商品仲介業者の登録は金融庁のサイト、CFPは日本FP協会のサイトで確認できます。所属する金融商品取引業者は、名刺・書面への記載義務があります。<br><br>「調べてください」と自分から言える人はほとんどいません。言えること自体が差別化になります。<br><br>これは他社批判ではなく、<strong>判断の物差しを渡す形</strong>。同じ物差しが自分にも当たるので、フェアに聞こえます。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp"}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）途中で必要になったら、引き出せますか？", "opts": [{"x": "引き出せません。原則60歳までです", "r": "ok"}, {"x": "引き出しの条件は確認が必要です。調べてご連絡します", "r": "timid", "m": [["確認が必要です", "制度の根幹。ここは言い切る"]]}, {"x": "50万円までなら、途中でも引き出せます", "r": "ng", "m": [["50万円までなら、途中でも引き出せます", "原則60歳まで引き出せない。脱退一時金は極めて限定的"]]}], "ex": "<strong>最初に、はっきり言う</strong>。後回しにすると「聞いてない」になり、会社への不満として、紹介したアドバイザーに戻ってきます。<br><br>説明会では最初の方に置くべき項目。", "src": "確定拠出年金法33条（法73条により個人型へ準用）／60歳前は障害給付金37条・死亡一時金40条・脱退一時金 附則3条1項に限られる【一次】", "st": "law"}, {"t": "sjt", "dom": "運用", "scene": "従業員からの質問", "ask": "（従業員）30年やったら、いくらになりますか？", "opts": [{"x": "過去の実績なら年5%は堅いので、30年で約2,500万円になります", "r": "ng", "m": [["年5%は堅い", "断定的判断の提供（金商法38条2号）"]]}, {"x": "お約束はできません。3%・5%・0%の3通りで見てみましょう", "r": "ok"}, {"x": "過去の実績から見て、5%は堅い数字です。まず下回りません", "r": "wrong", "m": [["堅い数字です", "「堅い」は断定。同じく禁止"]]}], "ex": "<strong>「数字を出すな」ではありません。</strong>前提（利回り・期間・手数料）を明示し、下振れを含む複数のケースで示す。その数字の根拠を言えることが条件です。<br><br>「年5%は堅い」も「5%は堅い数字です」も、<strong>断定的判断の提供</strong>にあたります（金融商品取引法38条2号）。<br><br>幅で出せば何でもよい、という話でもありません。", "src": "金融商品取引法38条2号（断定的判断の提供の禁止／仲介業者には66条の14第1号ロで適用）／金融サービス提供法5条・6条【一次】", "st": "law"}, {"t": "sjt", "dom": "比較", "scene": "25歳の従業員から", "ask": "（従業員）iDeCoって早く始めた方が得ですよね？枠いっぱいやった方がいいですか？", "opts": [{"x": "若いほど複利が効くので、枠いっぱいやった方がいいです", "r": "ng", "m": [["枠いっぱいやった方がいい", "60歳まで出せない。若い人ほどNISAが先"]]}, {"x": "まずNISAの使い方から考えることが多いです", "r": "ok"}, {"x": "若いうちは何もしなくていいです", "r": "wrong", "m": [["何もしなくていい", "今度は逆に振れすぎ。何もしない選択でもない"]]}], "ex": "iDeCoは60歳まで出せないので、40代以降にキャッチアップする形が合う場合がある。<br><br>「若いから枠いっぱいiDeCo」は多くの場合うまくいかない。若い人は課税所得が低く所得控除が効きにくいうえ、住宅・教育で資金が要る時期に60歳まで出せないお金を積み上げることになる。<br><br>⚠️ ただし課税所得が高く、当面の資金需要がない方は別。一律に否定するのも誤り。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp"}, {"t": "sjt", "dom": "比較", "scene": "従業員からの質問", "ask": "（従業員）会社が出してくれる分だけもらう、ということはできますか？", "opts": [{"x": "会社の分だけ受け取れます", "r": "ng", "m": [["会社の分だけ受け取れます", "本人が出さないと会社の分は付かない"]]}, {"x": "ご自身も最低額を出していただくと、会社の分が付きます", "r": "ok"}, {"x": "会社の分だけ受け取ることはできません。制度に参加しないという選択になります", "r": "wrong", "m": [["制度に参加しないという選択", "本人が最低額を出せば参加できる"]]}], "ex": "iDeCo+は本人のiDeCoへの上乗せです。本人がiDeCoに加入し、自分でも拠出していることが前提なので、「会社の分だけもらう」はできません。<br><br>ただし「できません。制度に参加しないという選択になります」で終えると、そこで話が止まります。事実としては正しくても、<strong>機会を渡せていません</strong>。<br><br>この上乗せは自分の懐から出すお金ではないので、<strong>受け取らない理由は基本的にありません</strong>。前提を伝えたうえで、受け取らないと何を失うかまで示します。", "src": "確定拠出年金法68条の2第1項（加入者が掛金を拠出する場合に上乗せできる）【一次】", "st": "law"}, {"t": "sjt", "dom": "掛金", "scene": "経営者の配偶者（専業主婦）から", "ask": "（配偶者）iDeCoの上限が6.2万円に上がるんですよね？私も増やせますか？", "opts": [{"x": "6.2万円まで増やせます", "r": "ng", "m": [["6.2万円まで", "第3号被保険者は23,000円で据え置き"]]}, {"x": "扶養に入っている方は23,000円のままです", "r": "ok"}, {"x": "はい、全員6.2万円になります", "r": "wrong", "m": [["全員", "第1号・第2号・第3号で上限が違う"]]}], "ex": "6.2万円に上がるのは企業年金のない会社員など。<br><br>★「iDeCoは6.2万円に上がる」と一括りに言うと嘘になる相手が2種類いる。<br><br>①<strong>企業年金がある人</strong>（枠から事業主掛金等が控除される）<br>②第3号被保険者（23,000円で据え置き・引き上げなし）<br><br>「全員6.2万円になります」も誤り。第3号被保険者もiDeCoに加入できます（枠が違うだけ）。", "src": "確定拠出年金法施行令36条（2026年12月1日施行版）第6号【一次】", "st": "law"}, {"t": "sjt", "dom": "出口", "scene": "50代の従業員から", "ask": "（従業員）一時金と年金、どっちがいいですか？", "opts": [{"x": "一時金の方が税金は安く済みます。迷わず一時金をおすすめします", "r": "ng", "m": [["迷わず一時金をおすすめします", "退職金の額と勤続年数で答えが逆転する"]]}, {"x": "退職金の額と勤続年数で答えが逆転します。確認させてください", "r": "ok"}, {"x": "年金の方が長くもらえるので、そちらが有利です", "r": "wrong", "m": [["そちらが有利です", "年金の方が有利とも限らない。人によって逆転する"]]}], "ex": "一時金は退職所得、年金は雑所得で公的年金と合算されます。<br><br>決め手は4つ。①会社の退職金の額 ②勤続年数（退職所得控除を使い切るか）③DCの資産額 ④公的年金と他の所得。<br><br><strong>併用もできます</strong>（一部を一時金、残りを年金）。「一時金の方が安い」も「年金の方が長くもらえる」も、この4つを見ずに決めています。<br><br>さらに年金で受け取ると、国民健康保険料・介護保険料・後期高齢者医療の算定にも入ります。税だけ見て決めると手取りが減ることがあります。", "src": "所得税法30条（退職所得）・35条3項（公的年金等）／年金受取は国保・介護・後期高齢者医療の算定に影響【一次】", "st": "law"}, {"t": "ox", "dom": "出口", "line": "DCの一時金を先に受け取り、その5年後に会社の退職金を受け取れば、退職所得控除は満額使える。", "ans": "×", "ex": "何年内を見るかは、「今回受け取るもの」の種類で決まります。（所得税法施行令70条1項2号 本文）<br><br>・今回が<strong>会社の退職金</strong>で、前にDC一時金がある → 前年以前9年内（2026年1月1日以後に受け取ったDC一時金から。それ以前は4年内）<br>・今回がDC一時金 → 前年以前19年内<br>・今回も前も会社の退職金 → 前年以前4年内<br><br>この設問は今回が会社の退職金なので<strong>9年</strong>。5年空けても足りません。<br><br>⚠️ 前に受け取ったものの種類で決めると間違えます。ここを取り違えると、DCを先に受け取ったのに4年で計算してしまいます。<br><br>⚠️ 9年が働く場面でも、2026年1月1日前に受け取った退職手当等は「前年以前4年内」のまま。いつ・どの順番で受け取るかで税額が変わります。", "src": "所得税法施行令70条1項2号 本文／所得税法31条3号・同施行令72条3項7号／令和7年政令120号附則4条【一次】", "st": "law", "m": [["その5年後に", "今回が会社の退職金なら前年以前9年内。5年では足りない"]]}, {"t": "ox", "dom": "出口", "line": "退職所得控除は縮小されることが決まっており、勤続20年超の年70万円は40万円になる。", "ans": "×", "ex": "<strong>決まっていない</strong>。令和8年度税制改正の大綱にも与党税制改正大綱にも記載がなく、現行は40万／70万のまま。<br><br>正しい答え方＝「議論はされてきましたが、令和8年度改正でも見送られました」。<br><br>⚠️ <strong>DC一時金の「前年以前9年内」のルール</strong>を「退職所得控除の見直し」と呼ぶ解説が多く、混同されやすい。", "src": "所得税法30条3項（2026年8月12日施行版）／令和8年度税制改正の大綱【一次】", "st": "law", "m": [["決まっており", "決まっていない。議論はあるが改正されていない"]]}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）もし私が死んだら、掛金はどうなりますか？", "opts": [{"x": "ご家族に死亡一時金として支払われます。500万円まで非課税です", "r": "ng", "m": [["500万円まで非課税", "非課税枠が使えるのは相続人が受け取る場合だけ。受取人で変わる"]]}, {"x": "ご遺族に支払われます。非課税枠は受取人によって変わります", "r": "ok"}, {"x": "相続財産として通常どおり相続されます", "r": "wrong", "m": [["通常どおり相続されます", "みなし相続財産。指定された受取人へ渡る"]]}], "ex": "500万円×法定相続人の非課税枠が使えるのは、受け取る方が相続人である場合に限られる。受取人の指定で扱いが変わる。<br><br>★<strong>実務価値が最も高い論点</strong>。<br><br>・確定拠出年金法の「遺族」には<strong>内縁の配偶者も入る</strong>（届出がなくても事実婚なら可）<br>・しかし相続税法の非課税枠は「相続人」限定。国税庁は「相続人以外の人が取得した退職手当金等には、非課税の適用はありません」と明記<br>・＝2つの範囲がズレている<br><br>「通常どおり相続されます」も誤り。<strong>指定した受取人へ渡るみなし相続財産</strong>です。<br><br>なお確定拠出年金法に「時効」の条文は存在しない。5年で「遺族なし」とみなされ<strong>相続財産に切り替わる</strong>（受給権者の切替）。「時効2年」は国民年金法の死亡一時金の話。", "src": "確定拠出年金法40条・41条・73条／相続税法12条1項7号／国税庁 No.4117【一次】", "st": "law"}, {"t": "sjt", "dom": "教育", "scene": "経営者からの質問", "ask": "（経営者）投資教育って、法律でやらないといけないの？", "opts": [{"x": "投資教育は法律上の義務があります。やらないと指導が入ります", "r": "ng", "m": [["法律上の義務があります", "iDeCo+に投資教育の義務はない"]]}, {"x": "iDeCo+に義務はありません。企業型DCにはあります", "r": "ok"}, {"x": "義務はないので、何もしなくて構いません", "r": "wrong", "m": [["何もしなくて構いません", "義務が無いことと、やらなくてよいことは別"]]}], "ex": "ただし事業主には、加入者への協力と法令遵守の指導に努める義務がある（確定拠出年金法78条）。<br><br>★<strong>3制度で扱いが違う典型</strong>。<br><br>・<strong>企業型DC＝努力義務</strong>（確定拠出年金法22条）<br>・iDeCo系＝22条の主体が「連合会」に読み替えられる（73条）のでiDeCo+の事業主には及ばない<br>・罰則もない（罰則条項118〜124条に22条・68条の2・73条・78条は一切引用されていない）<br><br>⚠️ ただし「義務があります」も言い過ぎ。<strong>法78条</strong>に「必要な協力をするとともに、法令及び規約が遵守されるよう指導等に努めなければならない」という努力義務がある。", "src": "確定拠出年金法22条・68条の2・73条・78条・118〜124条【一次】", "st": "law"}, {"t": "sjt", "dom": "運用", "scene": "従業員からの質問", "ask": "（従業員）何を選べばいいか分かりません。おすすめを教えてください。", "opts": [{"x": "全世界株式のインデックスファンドがいいですよ。私も持っています", "r": "ng", "m": [["がいいですよ", "特定の商品を勧めている。選ぶのは本人"]]}, {"x": "特定の商品はお勧めできません。考え方はご説明します", "r": "ok"}, {"x": "元本確保型にしておけば、まず安心です", "r": "wrong", "m": [["まず安心です", "これも推奨。かつ元本保証ではない"]]}], "ex": "置いておくだけでも毎月手数料がかかることと、分散の考え方は伝えます。<strong>選ぶのは本人</strong>です。<br><br>「全世界株式がいいですよ」は特定商品の推奨。「元本確保型にしておけば安心」も同じく推奨で、しかも正確ではありません（元本確保型でも手数料で目減りすることがあります）。<br><br>放置されると、会社が出した掛金が実質減ります。<strong>「勧めない」と「何も言わない」は別。</strong>判断材料は渡します。", "src": "金融商品取引法38条2号（断定的判断の提供。金融商品仲介業者には66条の14第1号ロ）／確定拠出年金法65条（運用の方法を選ぶのは本人）【一次】　※特定商品を推奨しないのは制作者（株式会社LSFP）の方針", "st": "law"}, {"t": "sjt", "dom": "運用", "scene": "経営者からの質問", "ask": "（経営者）社員それぞれ、使っている金融機関がバラバラなんだけど、揃えないとダメ？", "opts": [{"x": "揃える必要はありません", "r": "ok"}, {"x": "そこは調べてからお返事します", "r": "timid", "m": [["調べてからお返事します", "会社は選ばない・揃えないが基本。ここは言い切ってよい"]]}, {"x": "会社で1社に統一してください。その方が管理が楽です", "r": "ng", "m": [["1社に統一してください", "運営管理機関を選ぶのは本人"]]}], "ex": "iDeCo+は<strong>従業員個人のiDeCo口座への上乗せ</strong>なので、会社が運営管理機関を選ぶ必要も統一する必要もない。会社は合算して1本で納めるだけ。<br><br><strong>企業型DCとの大きな違い</strong>。「金融機関を選ぶのが大変そう」と身構えている経営者には、ここで一気に軽くなる。", "src": "確定拠出年金法65条（運営管理機関を指定するのは加入者本人）・55条2項3号・60条1項【一次】", "st": "law"}, {"t": "sjt", "dom": "掛金", "scene": "経営者からの質問", "ask": "（経営者）長くいる社員には多く出したい。勤続年数で分けられる？", "opts": [{"x": "できます。勤続年数で分けられます", "r": "ng", "m": [["勤続年数で分けられます", "制度上は可でも、受け付けてもらえない場合がある"]]}, {"x": "制度上はできます。受け付けてもらえるか確認します", "r": "ok"}, {"x": "勤続年数での区分は、法律で禁止されています", "r": "wrong", "m": [["法律で禁止されています", "勤続期間による区分は法律で認められている"]]}], "ex": "勤続期間による区分は、認められている3類型のひとつです。<br><br>ただし受け付けてもらえるかは別なので、「できます」と言い切るのも「法律で禁止されています」と言うのも、<strong>どちらも誤り</strong>です。<br><br>★「制度上できること」と「受け付けてもらえること」は別。勤続年数別・役職別は継続管理が複雑になるため、受け付けてもらえないことがあります。", "src": "制度上の可否＝確定拠出年金法68条の2／受け付けてもらえる範囲は金融機関ごとに異なる", "st": "law"}, {"t": "sjt", "dom": "掛金", "scene": "経営者からの質問", "ask": "（経営者）役員には多めに、社員には一律で出したい。これはできる？", "opts": [{"x": "はい、役員と一般従業員で分けられます", "r": "ok"}, {"x": "区分ができるかは確認が必要なので、持ち帰ります", "r": "timid", "m": [["確認が必要なので、持ち帰ります", "役員／一般従業員の2区分は基本。ここは言える"]]}, {"x": "役員だけに出すこともできますよ。よくある形です", "r": "ng", "m": [["役員だけに", "一定の資格は不当に差別的であってはならない"]]}], "ex": "役員と一般従業員で分けることは制度上可能。ここは言い切ってよい。<br><br>ただし2点添える。区分を設ける場合は規程の提出が必要。そして受け付けてもらえるかは別途確認。<br><br>⚠️ 「役員だけを対象にする（従業員には出さない）」は別の話。合理的な区分として認められるかは地方厚生（支）局への事前相談案件で、<strong>その場で言い切ってはいけない</strong>。「役員に多め」と「役員だけ」は境界がひとつ違うだけで答えが変わる。", "src": "制度上の可否＝確定拠出年金法68条の2／受け付けてもらえる範囲は金融機関ごとに異なる", "st": "law"}, {"t": "sjt", "dom": "教育", "scene": "経営者に頼まれて", "ask": "（経営者）区分を設けたいから、就業規則の書き方を教えてよ", "opts": [{"x": "（就業規則の条文案を作って渡した）", "r": "ng", "m": [["条文案を作って渡した", "就業規則の作成は社労士の独占業務"]]}, {"x": "論点は整理します。条文づくりは社労士さんへ", "r": "ok"}, {"x": "条文案は作れません。区分の話はやめましょう", "r": "wrong", "m": [["区分の話はやめましょう", "論点整理まではできる。放り出さない"]]}], "ex": "制度の誤りではなく、<strong>他の資格者の業務範囲</strong>の問題です。<br><br>条文案を作って渡すことはできません。かといって「区分の話はやめましょう」と話ごと引っ込めるのも違います。論点整理まではやってよいところです。<br><br>⚠️ 社労士法の業務独占は「報酬を得て、業として」行う場合に及ぶもので、論点整理と条文作成の線引きには実務上の幅があります。個別の判断は社労士・弁護士への確認が要ります。", "src": "社会保険労務士法2条1項1号・2号／27条（社労士でない者は「報酬を得て、業として」これらを行えない）。2条1項3号の相談・指導は制限対象外（昭43.12.9 庁保発第23号）【一次】", "st": "law"}, {"t": "ox", "dom": "ガバ", "line": "過半数代表者は、経営者が信頼できる社員を指名して選任してよい。", "ans": "×", "ex": "要件は3つ。①管理監督的地位にない ②投票・挙手など民主的な方法で選ばれた ③使用者の意向で選ばれていない。<br><br>経営者が「じゃあ君ね」と指名することはできません。形式の問題ではなく、後から手続きの有効性を問われると<strong>労使合意そのものが成り立たなくなります</strong>。朝礼で挙手を取るだけでもいいので、選んだ記録を残す。", "src": "確定拠出年金法施行規則56条の3が同規則2条1項を準用（①労基法41条2号の管理監督者でない ②選出であることを明らかにした投票・挙手等で、事業主の意向に基づかない）【一次】", "st": "law", "m": [["経営者が信頼できる社員を指名", "使用者の指名は不可。投票等で選ぶ"]]}, {"t": "ox", "dom": "可否", "line": "iDeCo+を始めるとき、会社が年金規約を作る必要はない。", "ans": "○", "ex": "<strong>作りません。</strong>iDeCo+は企業年金ではないので、会社の年金規約はありません。<br><br>実施しているのは<strong>国民年金基金連合会</strong>で、個人型年金規約を作るのも連合会です。会社は掛金を上乗せする立場（確定拠出年金法68条の2）。<br><br>⚠️ 企業型DCは会社が規約を作り、<strong>地方厚生（支）局の承認</strong>を受けます。iDeCo+は連合会への届出。ここが企業型DCとの一番大きな手続きの違いです。<br><br>だから導入の負担も、企業型DCとは桁が違います。", "src": "確定拠出年金法68条の2第6項・同施行規則56条の6（国基連への届出のみ）／企業型DCは法3条1項で厚生労働大臣の承認【一次】", "st": "law", "m": [["会社が年金規約を作る必要はない", "実施主体は連合会。会社は上乗せする立場"]]}, {"t": "ox", "dom": "掛金", "line": "業績が悪化した場合、事業主掛金は翌月から自由に減額・停止できる。", "ans": "×", "ex": "<strong>変更は年1回まで</strong>（12月から翌年11月までの間に1回）。「業績次第で調整できます」と経営者に約束すると守れない。<br><br>掛金は実質的に下げにくい固定費なので、最初から無理のない額で設計する。<br><br>なおマッチング拠出の変更も政令で年1回。規約次第なのは企業型DCの事業主掛金の方。", "src": "確定拠出年金法施行令29条4号ハ・35条1号イ（マッチング拠出は6条4号ハ・10条の2）【一次】", "st": "law", "m": [["翌月から自由に減額・停止できる", "掛金の変更は年1回まで"]]}, {"t": "ox", "dom": "掛金", "line": "iDeCo+の掛金は、本人と会社の合計で月5,000円以上23,000円以下でなければならない。", "ans": "○", "ex": "<strong>合算で判定します。</strong>本人の掛金と事業主掛金の合計が、月5,000円以上23,000円以下（1,000円単位）。<br><br>だから本人1,000円＋会社4,000円＝5,000円でも成立します。本人単独・会社単独に下限はありません。<br><br>⚠️ <strong>本人の掛金を0円にはできません</strong>（国基連）。「会社の分だけ」はできない。<br><br>⚠️ マッチング拠出には法律で定められた最低額はありません。この5,000円をマッチングに当てはめるのは誤りです。", "src": "確定拠出年金法69条（個人型年金加入者掛金と中小事業主掛金の合計額）／確定拠出年金法施行令36条／国民年金基金連合会「iDeCo＋導入時の留意事項」2②⑤【一次】", "st": "law", "m": [["本人と会社の合計で月5,000円以上23,000円以下", "合算で判定する。本人単独・会社単独に下限はない"]]}, {"t": "ox", "dom": "出口", "line": "懲戒解雇した社員について、会社は拠出済みの掛金の返還を求めることができる。", "ans": "×", "ex": "拠出済みの掛金は<strong>本人の資産（個人別管理資産）</strong>。退職金規程で「懲戒解雇なら不支給」とできるのとは、まったく違う。<br><br><strong>これは経営者に先に言うこと</strong>。後から知ると「そんなの聞いてない」になる。<br><br>しかも勤続年数別の区分を受け付けない金融機関も多いので、「入ってすぐ辞める人には出さない」設計で回避することもできない場合がある。", "src": "事業主への返還は確定拠出年金法84条（企業型・勤続3年未満・規約の定め）のみで、法73条はこれを個人型に準用していない＝根拠規定の不存在【一次】", "st": "law", "m": [["返還を求めることができる", "拠出済みの掛金は本人の資産。返還請求できない"]]}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）転職したら、会社が出してくれた分はどうなりますか？", "opts": [{"x": "はい、そのままご本人の資産です", "r": "ok"}, {"x": "持ち帰って確かめます", "r": "timid", "m": [["持ち帰って確かめます", "退職しても本人の資産。ここは言い切ってよい"]]}, {"x": "会社が出した分は、退職時に返していただきます。規程にもそう書いてあります", "r": "ng", "m": [["返していただきます", "本人の資産。持ち運べる"]]}], "ex": "退職後は本人のiDeCoとして継続し、事業主掛金だけが止まる。転職先がiDeCo+をやっていれば、そこの上乗せに切り替わる。<br><br><strong>持ち運べるのがDCの最大の特徴</strong>。退職金制度と根本的に違う。転職が当たり前の世代にはここが刺さる。", "src": "確定拠出年金法2条12項（個人別管理資産）・80〜83条（移換）／法62条4項の資格喪失事由に退職は含まれない【一次】", "st": "law"}, {"t": "sjt", "dom": "教育", "scene": "50代の従業員が多い会社の説明会", "ask": "（従業員）受け取り方は、結局どちらが有利なんですか？", "opts": [{"x": "受け取り方ですが、一時金の方が有利なので、皆さん一時金を選んでください", "r": "ng", "m": [["皆さん一時金を選んでください", "出口は人によって答えが逆転する。集合研修で言わない"]]}, {"x": "答えが人によって逆転します。個別にお受けします", "r": "ok"}, {"x": "年金の方が有利です。皆さん年金でお受け取りください", "r": "wrong", "m": [["年金の方が有利です", "集合の場で、どちらかに寄せない"]]}], "ex": "退職金の額と勤続年数で逆転します。この場では判断材料まで。<br><br>「一時金の方が有利」も「年金の方が有利」も、<strong>集合の場で一方に寄せている</strong>点が同じです。<br><br>★<strong>出口の話は、集合研修ではやりません。</strong>受け取る順番とタイミングは、事前の設計が要ります。<br><br>基礎は集合、出口は個別。分けるのは年齢ではなく「集合で言えるか、言えないか」です。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp"}, {"t": "sjt", "dom": "出口", "scene": "25歳の従業員から", "ask": "（従業員）ねんきん定期便を見たけど、これしかもらえないんですか？年金なんてあてになりませんね", "opts": [{"x": "公的年金だけでは足りないので自分で備えましょう", "r": "ng", "m": [["足りないので", "定期便は「これまで払った分」だけの額。不安を煽る前に読み方を伝える"]]}, {"x": "それは、これまで払った分だけの金額です", "r": "ok"}, {"x": "公的年金は将来もらえなくなる可能性があります", "r": "wrong", "m": [["もらえなくなる可能性", "事実と違う。不安を煽っている"]]}], "ex": "50歳未満の定期便は将来の見込額ではない。若い方が年金をあてにしなくなる原因の多くがこの読み違い。<br><br>★50歳未満の定期便は「これまでの加入実績に応じた額」。将来の見込額ではない。<br><br>25歳が見れば当然小さい額が載っており、それを見て「やっぱりもらえない」と誤解する。<strong>この読み方を教えるだけで態度が変わる</strong>。<br><br>（50歳以上は60歳まで同条件で加入した仮定の見込額。ただし<strong>60歳以上65歳未満は実績ベースに戻る</strong>）", "src": "日本年金機構「ねんきん定期便の見方ガイド（令和8年度送付分）」【一次】", "st": "law"}, {"t": "sjt", "dom": "掛金", "scene": "経営者からの質問", "ask": "（経営者）業績次第で掛金を増やしたり減らしたりできる？", "opts": [{"x": "掛金の変更は年1回までです", "r": "ok"}, {"x": "変更の回数は制度によるので、あとでお知らせします", "r": "timid", "m": [["あとでお知らせします", "年1回は言い切ってよい"]]}, {"x": "業績に応じて、年3回まで調整できます", "r": "ng", "m": [["年3回まで調整できます", "掛金の変更は年1回まで"]]}], "ex": "ここは言い切ってよい。<strong>政令で年1回</strong>と決まっている。「業績次第で調整できます」と約束すると守れない。<br><br>だからこそ最初は無理のない額から。月1,000円でも制度は成立する。<br><br>なおマッチング拠出の変更も政令で年1回。規約次第なのは企業型DCの事業主掛金の方。", "src": "確定拠出年金法施行令29条4号ハ・35条1号イ（マッチング拠出は6条4号ハ・10条の2）【一次】", "st": "law"}, {"t": "sjt", "dom": "税社保", "scene": "経営者からの質問", "ask": "（経営者）会社が出した掛金は経費になる？", "opts": [{"x": "全額が損金になります", "r": "ok"}, {"x": "税務の話は税理士さんにご確認ください", "r": "timid", "m": [["税理士さんにご確認ください", "全額損金は言い切ってよい"]]}, {"x": "経費になるので、実質タダで福利厚生ができます", "r": "ng", "m": [["実質タダ", "損金でも現金は出ていく"]]}], "ex": "法人なら損金、個人事業主なら必要経費。ここは言い切ってよい。<br><br>⚠️ ただし<strong>「経費になるからお得」は別の話</strong>。給与も経費なので、法人税の面では差がつかない。差がつくのは会社の社会保険料負担と従業員側の税・社保の2つだけ。", "src": "法人税法施行令135条4号（法人は損金算入）／所得税法施行令64条2項（個人事業主は必要経費）【一次】", "st": "law"}, {"t": "sjt", "dom": "教育", "scene": "経営者からの質問", "ask": "（経営者）どのくらいで始められる？", "opts": [{"x": "3〜4か月はみてください", "r": "ok"}, {"x": "期間はケースによるので、確認してからご回答します", "r": "timid", "m": [["確認してからご回答します", "3〜4か月という目安は言える"]]}, {"x": "書類さえ出せば、2週間で始められます", "r": "ng", "m": [["2週間で始められます", "書類だけでは始まらない。3〜4か月はかかる"]]}], "ex": "ここは言い切ってよい。届出は<strong>拠出開始月の前月20日必着</strong>だが、時間がかかるのは従業員のiDeCo口座開設・審査（1〜2か月）。<br><br>全員が未加入の会社なら3か月以上みる。経営者に「来月から」と言われたときに、ここで正直に言えるかどうか。", "src": "確定拠出年金法68条の2第6項・同施行規則56条の6（届出）／厚労省・国基連「iDeCo＋導入ガイド」p.5【一次】", "st": "law"}, {"t": "ox", "dom": "税社保", "st": "law", "line": "選択制DCで給与を減額し、その減額分を掛金とすると、社会保険料は必ず下がる。", "ans": "○", "ex": "<strong>雇用保険料が下がるから。</strong><br><br>雇用保険料は賃金総額に料率を乗じて計算する（労働保険の保険料の徴収等に関する法律11条1項・2項）。等級制ではないので、賃金が減れば比例して必ず下がる。<br><br>一方、健康保険料・厚生年金保険料は<strong>標準報酬月額（等級制）</strong>。等級をまたがなければ1円も変わらない。<br><br>つまり「下がるのは雇用保険料だけ」という場合がある。しかも料率が小さいので金額は小さい。<br><br>⚠️ <strong>言い方に注意。</strong>「給与から掛金を出す」ではない。拠出するのは事業主（確定拠出年金法19条1項）。正しくは「給与や賞与を減額して、その減額分をもって掛金とする」。<br><br><span class=\"note\">（補足）役員は雇用保険法上の「労働者」ではないため雇用保険の被保険者になりません（雇用保険法4条1項）。厚生年金の被保険者にはなるので選択制DCには入れますが、雇用保険料がもともと無く、この話は当てはまりません。<br>なお週20時間未満の方は雇用保険の対象外ですが（同6条1号）、厚生年金の被保険者でもないため、そもそも選択制DCの加入者になりません（確定拠出年金法9条1項）。</span>", "src": "労働保険の保険料の徴収等に関する法律11条1項・2項（賃金総額）／健康保険法3条5項・厚生年金保険法3条1項3号／雇用保険法4条1項・6条1号／厚生年金保険法9条／確定拠出年金法9条1項【一次】", "m": [["必ず下がる", "雇用保険料は賃金総額×率。等級と関係なく下がる。ここが○の理由"]]}, {"t": "ox", "dom": "税社保", "st": "law", "line": "選択制DCで給与を減額して掛金としても、標準報酬月額の等級が変わらなければ、負担する保険料は1円も変わらない。", "ans": "×", "ex": "<strong>雇用保険料は下がる。</strong><br><br>等級が変わらなければ<strong>健康保険料・厚生年金保険料は変わらない</strong>。ここは正しい。ただし雇用保険料は賃金総額がもとなので、等級とは関係なく下がる。<br><br>「社会保険料」と一括りにすると外す。<strong>何の保険料の話かを分けて答えられるか</strong>が問われる。<br><br>★そして、ここが選択制DCで一番割に合わないところ。<br>保険料はほとんど変わらないのに、<strong>育児休業給付・失業給付は賃金日額がもと</strong>なので減る。等級をまたがなかった人は、保険料が1円も安くならないのに、育休給付だけ減るということが起こり得る。<br><br>社内の試算では、月給30万円・掛金1万円で雇用保険料の軽減 年600円 に対し、育児休業給付の減少 年72,247円。約120倍。", "src": "労働保険の保険料の徴収等に関する法律11条（賃金総額）／健康保険法40条・厚生年金保険法20条（標準報酬月額の等級区分）／同41条・21条（定時決定）／厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70【一次】※試算は社内資料", "m": [["1円も変わらない", "健保・厚年は変わらないが、雇用保険料は下がる"]]}, {"t": "ox", "dom": "識別", "st": "law", "line": "選択制DCは、従業員が自分の給与から掛金を出す仕組みである。", "ans": "×", "ex": "<strong>拠出するのは事業主。</strong>確定拠出年金法19条1項「事業主は…掛金を拠出する」。選択制DCは、給与を減額したうえで、その分を事業主が掛金として拠出する形。<br><br>厚労省も明記している。「事業主掛金について事業主が拠出せず、給与から控除する等により加入者に負担させることは認められない」（確定拠出年金Q&A No.70）。<br><br><strong>自ら拠出するのはマッチング拠出のほう</strong>（同法19条3項「企業型年金加入者は…自ら掛金を拠出することができる」）。<br><br>★この2つを取り違えると、経営者への説明が土台から誤る。「従業員が給与から出す」と言うと、認められていない形を提案していることになる。", "src": "確定拠出年金法19条1項・3項／厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70【一次】", "m": [["従業員が自分の給与から掛金を出す", "拠出するのは事業主。給与を減額して事業主が出す"]]}, {"t": "ox", "dom": "言葉", "st": "law", "line": "「選択制DCは、給与を減額して、その減額分を事業主が掛金として拠出する仕組みです」— この説明でよい。", "ans": "○", "ex": "<strong>これが正しい言い方です。</strong>拠出するのは事業主（確定拠出年金法19条1項）。<br><br>⚠️ 1語変えると不可になります。「給与から<strong>控除して</strong>掛金にする」は認められません。「事業主掛金について事業主が拠出せず、給与から控除する等により加入者に負担させることは認められない」（厚労省「確定拠出年金Q&A」No.70）。<br><br>減額して事業主が拠出＝可／控除して本人に負担させる＝不可。<br><br>なお給与から引いてよい掛金もあります。マッチング拠出の加入者掛金（法21条の3第1項）とiDeCoの本人掛金（法71条1項）。給与から引いてよいかどうかは、掛金の種類で違います。", "src": "厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70／確定拠出年金法19条1項【一次】", "m": [["給与を減額して、その減額分を事業主が掛金として拠出する", "これが正しい形。「控除して」は不可"]]}, {"t": "ox", "dom": "言葉", "st": "law", "line": "iDeCo+では、従業員が「iDeCo+に加入」して、iDeCo+の口座で運用する。", "ans": "×", "ex": "一文に<strong>3つの誤り</strong>がある。<br><br>① 従業員が加入するのは<strong>iDeCo</strong>（法62条1項）。iDeCo+では「拠出対象者」になる（法68条の2第2項）<br>② iDeCo+固有の口座はない。資産は本人のiDeCoの個人別管理資産に合算される（法2条12項・69条）<br>③ 本人がiDeCoに加入し掛金を出していなければ、事業主掛金だけを出すことはできない<br><br>国基連の手引き「iDeCoの加入者にならなければ、<strong>拠出対象者になれません</strong>」。", "src": "確定拠出年金法62条1項・68条の2第2項・2条12項・69条／国基連「中小事業主掛金納付制度の手引き」【一次】", "m": [["「iDeCo+に加入」して、iDeCo+の口座", "加入するのはiDeCo。iDeCo+固有の口座は存在しない"]]}, {"t": "ox", "dom": "言葉", "st": "law", "line": "iDeCo+を始めるには、労使協定を結び、規約を作って申請する。", "ans": "×", "ex": "<strong>3語すべて誤り。</strong>企業型DCの手続きと混線している。<br><br>❌ 労使協定 → ✅ <strong>同意</strong>（法68条の2第1項「…過半数を代表する者の同意を得て」）。労基法36条の労使協定とは別物<br>❌ 規約を作る → ✅ 事業主が作る規約はない。個人型年金規約を作るのは連合会（法55条1項）<br>❌ 申請・承認 → ✅ 届出（法68条の2第6項「連合会に届け出なければならない」）<br><br>⚠️ これを間違えると、iDeCo+の導入負担を実際より重く説明してしまう。企業型DCは「同意→規約作成→厚生労働大臣の承認」だが、iDeCo+はそれが一切ない。", "src": "確定拠出年金法68条の2第1項・6項／55条1項／3条1項（企業型の承認）／施行規則56条の6【一次】", "m": [["労使協定を結び、規約を作って申請する", "「労使協定」でなく同意、規約を作るのは連合会、申請でなく届出"]]}, {"t": "ox", "dom": "言葉", "st": "law", "line": "「選択制DCなら手取りが増えます」— この説明でよい。", "ans": "×", "ex": "<strong>事実と逆。</strong>給与を減額して掛金に回すので、その月に手元に入る現金は減る。<br><br>「増える」と言えるのは、同じ額を給与で受け取ってから自分で積み立てる場合と比べたときだけ。比較の土台を隠して「手取りが増える」と言うのは、<strong>誤解を生じさせる表示</strong>に近づく。<br><br>厚労省Q&A No.70 も、 ", "st": "law", "m": [["物価が上がれば一緒に上がる", "法定の固定額。連動の規定はない（所法30条3項）"]]}, {"t": "ox", "dom": "出口", "line": "60歳台後半で働きながらDCを年金で受け取ると、その分だけ在職老齢年金の支給停止が増える。", "ans": "×", "ex": "<strong>増えない。</strong>在職老齢年金で見るのは「総報酬月額相当額」＝標準報酬月額と、その月以前1年間の標準賞与額の総額を12で割った額（厚生年金保険法46条1項）。<br><br>DCの年金は、標準報酬月額でも標準賞与額でもない。だから支給停止の計算には入らない。<br><br>ただし<strong>所得税・住民税の計算には入る</strong>（公的年金等の雑所得）。「年金にすると年金が止まる」と混同している人が多いので、止まる話と課税の話を分けて説明する。", "src": "厚生年金保険法46条1項／所得税法35条3項3号（同施行令82条の2第2項）【一次】", "st": "law", "m": [["在職老齢年金の支給停止が増える", "見るのは標準報酬月額と標準賞与額だけ。DCの年金は入らない"]]}, {"t": "sjt", "dom": "教育", "scene": "説明会の冒頭", "ask": "（説明会の冒頭。何から話しますか）", "opts": [{"x": "今日は、皆さんの給与明細がどう変わるかから始めます", "r": "ok"}, {"x": "まず確定拠出年金という制度の仕組みからご説明します", "r": "ng", "m": [["制度の仕組みからご説明します", "自分事にならない。手取りから入る"]]}, {"x": "本日は資料をお配りしましたので、お目通しください", "r": "wrong", "m": [["お目通しください", "読まれない。何から話すかを決めていない"]]}], "ex": "制度の説明から始めると、聞いてもらえない。<br><br>従業員が知りたいのは制度ではなく「<strong>自分の手取りがどうなるか</strong>」「損しないか」の2つだけ。そこから入って、必要になった順に制度を出す。<br><br>「確定拠出年金とは」で始めた瞬間に、半分は自分に関係ない話だと判断して聞くのをやめる。後で個別質問が山のように来て、結局その方が時間がかかる。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp"}, {"t": "sjt", "dom": "教育", "scene": "経営者からの質問", "ask": "（経営者）説明会、うちの総務にやらせればいいよね？", "opts": [{"x": "制度のご説明までなら、社内で結構です", "r": "ok"}, {"x": "はい、社内で十分です", "r": "ng", "m": [["社内で十分です", "商品の話まで社内でやると、説明の責任がその人に残る"]]}, {"x": "必ず外部の専門家でないとできません", "r": "wrong", "m": [["必ず外部の専門家でないとできません", "制度と手続きの説明は社内でできる"]]}], "ex": "線は「制度の説明」と「商品の話」の間にある。<br><br>加入手続き・掛金・スケジュールの説明は社内で問題ない。だが「どれを選べばいいか」に踏み込むと、社内の人でも同じ問題が起きる。後で値下がりしたときに、説明の責任がその人に残ります。<br><br>会社としても、従業員の資産形成の結果を社内の誰かが背負う形を作らない方がいい。「制度は総務、商品は外部」で分けておく。", "src": "制作者（株式会社LSFP）の考え方（商品の推奨に関わる部分は金融商品取引法38条2号）", "st": "lsfp"}, {"t": "sjt", "dom": "掛金", "scene": "従業員からの質問", "ask": "（従業員）上限が上がるなら、6.2万円まで出した方が得ですよね？", "opts": [{"x": "出口も見てから決めましょう。受け取るときに課税されることがあります", "r": "ok"}, {"x": "所得控除が増えます。上限まで出した方が得です", "r": "ng", "m": [["上限まで出した方が得です", "出口の退職所得控除の枠を見ていない"]]}, {"x": "上限まで出せる方はほとんどいません。心配は要りません", "r": "wrong", "m": [["心配は要りません", "聞かれた金額に答えて "}, {"t": "ox", "dom": "出口", "line": "一時金と年金を組み合わせて受け取れるかどうかは、金融機関に確認が要る。", "ans": "○", "ex": "<strong>確認が要ります。</strong>国民年金基金連合会は、併給について「受給権が発生する年齢（原則60歳）に到達した時点で一部の年金資産を一時金で受け取り、残りの年金資産を年金で受け取ることもできます。（運営管理機関にお問い合わせください。）」としています。<br><br>全機関で用意されていると言い切れる根拠はありません。<br><br>⚠️ 私は当初、民間ポータルの「3つの選択肢はすべての運営管理機関で用意されています」という記述を採って「確認は不要」と書いていました。一次情報（国基連）と二次情報が食い違ったので、一次を採ります。<br><br>金融機関で違うのは、ほかに<strong>何年で受け取るかの刻み</strong>（1年単位／5年刻み／15年まで）と終身年金の扱いの有無。終身年金にも「運営管理機関によっては」という限定が明示されています。", "src": "国民年金基金連合会 iDeCo公式サイト「iDeCo加入者・運用指図者の方へ」（2026年8月12日取得）／確定拠出年金法35条1項・2項【一次】", "st": "law", "m": [["金融機関に確認が要る", "国基連が「運営管理機関にお問い合わせください」と明記している"]]}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）毎年100万円ずつ、みたいな決め方で取り崩せますか？", "opts": [{"x": "金額の指定はできないところが多いです", "r": "ok"}, {"x": "はい、ご希望の金額を指定して受け取れます", "r": "ng", "m": [["ご希望の金額を指定して受け取れます", "按分取り崩しで金額指定はできない仕組みが多い"]]}, {"x": "取り崩し方は、調べたうえでご説明します", "r": "timid", "m": [["調べたうえでご説明します", "金額指定でないことは言い切ってよい。生活設計に直結する"]]}], "ex": "<strong>年金は「按分取り崩し」が基本。</strong>ある記録関連運営管理機関のプランでは「商品ごとに保有数量を残りの給付回数で割った数量のみを売却」する方式で、「具体的な金額を指定して受け取ることはできません」と明記されている。<br><br>つまり<strong>受取額は、そのときの時価で決まる。</strong>相場が下がれば、その回の受取額も下がる。定額の年金ではない。<br><br>本人が決めるのは期間（5年・10年・15年・20年など）と年間の回数。金額はその結果。<br><br>⚠️ ここを「毎年◯万円もらえます」と説明すると、相場が下がった年に、説明と実際が食い違います。生活設計をその金額で組んでいた場合、組み直しが必要になります。", "src": "SBIベネフィット・システムズ「老齢年金の概要」（2026年8月12日取得。<b>特定のプランの例</b>）／確定拠出年金法施行規則4条1号ハ・33条【一次】", "st": "law"}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）年1回にすると、いつから振り込まれるんですか？", "opts": [{"x": "回数で初回の振込時期が変わります。確認しましょう", "r": "ok"}, {"x": "手続きが終わった翌月から始まります。長くお待たせしません", "r": "ng", "m": [["翌月から始まります", "年1回なら13か月目、年2回なら7か月目という例がある"]]}, {"x": "どの回数でも、初回までの期間は同じです", "r": "wrong", "m": [["初回までの期間は同じです", "年1回か年2回かで、初回までの月数が変わる"]]}], "ex": "<strong>選んだ回数で、初回までの期間が変わる。</strong>ある記録関連運営管理機関のプランでは、年1回だと裁定完了月の翌月から起算して13か月目、年2回だと7か月目に初回給付。回数は1回・2回・4回から選ぶ。<br><br>年1回を選ぶと、1年以上お金が入ってこない。退職直後で収入が途切れている人がこれを選ぶと、生活が回らない。<br><br>⚠️ 税の有利不利だけで回数を決めない。<strong>いつ現金が要るのかを先に聞く。</strong>", "src": "SBIベネフィット・システムズ「老齢年金の概要」（2026年8月12日取得。<b>特定のプランの例</b>）", "st": "lsfp"}, {"t": "sjt", "dom": "出口", "scene": "経営者からの質問", "ask": "（経営者）辞めた社員のiDeCo、うちはもう関係ないよね？", "opts": [{"x": "引落を止める届出が残ります。期限もあります", "r": "ok"}, {"x": "はい、退職された時点で会社の手続きは終わりです。あとはご本人次第です", "r": "ng", "m": [["退職された時点で会社の手続きは終わり", "引落停止の届出が残る。期限がある"]]}, {"x": "退職後のことは、社内で確認してお返事します", "r": "timid", "m": [["社内で確認してお返事します", "期限のある会社の義務。ここは即答する"]]}], "ex": "会社の手続きは、退職の時点ではまだ終わっていない。事業主払込で上乗せしていた従業員が辞めたら、<strong>掛金の引落を止める届出</strong>を出す必要がある。<br><br><strong>期限が決まっている。</strong>月末退職なら翌々月5日までに到着、月末以外の退職なら翌月5日までに到着（国基連の案内）。<br><br>出し忘れると<strong>辞めた人の口座から引落が続く。</strong>返還の処理は本人・会社・連合会の三者を巻き込む。<br><br>⚠️ 会社が「終わった」と思う瞬間と、実際に終わる瞬間がずれている。ここが一番多い落とし穴。", "src": "国民年金基金連合会「事業主の方へ」退職者に係る掛金引落停止（2026年8月12日取得）", "st": "law"}, {"t": "ox", "dom": "出口", "line": "企業型DCから移さないまま放置しても、資産が減るだけで、受け取れる年齢には影響しない。", "ans": "×", "ex": "<strong>時間も失う。ここが最も見落とされる。</strong><br><br>資格喪失後<strong>6か月以内</strong>に手続きしないと自動移換される。国基連はこう書いている。<br><br>・「<strong>資産の運用がされません</strong>」<br>・「管理手数料をご負担いただきます」（月58円、移換時 550〜4,180円）<br>・「自動移換中の期間は、老齢給付金の受給要件となる通算加入者等期間に算入されません」<br><br>3つめが一番重いところです。通算加入者等期間が足りないと、<strong>受け取り始められる年齢が後ろにずれる。</strong>お金が減るだけでなく、受け取れる時期が遠ざかる。<br><br>「そのうちやります」と言われたら、6か月であることと、期間が積まれないことを必ず伝える。", "src": "国民年金基金連合会「転職・退職された方へ」／確定拠出年金法83条1項1号・33条【一次】／国民年金基金連合会 iDeCo公式サイト（2026年8月12日取得）", "st": "law", "m": [["受け取れる年齢には影響しない", "自動移換中の期間は通算加入者等期間に算入されない"]]}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）前の会社の厚生年金基金の分も、iDeCoに移せますか？", "opts": [{"x": "移せます。脱退または制度終了から1年以内という期限があります", "r": "ok"}, {"x": "移せます。期限は10年ありますので、落ち着いてから手続きすれば足ります", "r": "ng", "m": [["期限は10年ありますので", "脱退または制度終了から1年以内"]]}, {"x": "企業年金からは移せません", "r": "wrong", "m": [["企業年金からは移せません", "移せる。期限があるだけ"]]}], "ex": "厚生年金基金・確定給付企業年金からiDeCoへ移す場合、国基連は「脱退後または確定給付企業年金が終了した日から1年以内に」移換を申し出ることとしている。<br><br>⚠️ 企業型DCの「6か月」と、企業年金の「1年」は別の期限。混同すると、どちらかを逃す。<br><br>⚠️ 移す先の口座（iDeCo加入者であること）が先に要る。「1年あるから」と構えていると、口座開設の時間で足りなくなる。", "src": "国民年金基金連合会「転職・退職された方へ」（2026年8月12日取得）", "st": "law"}, {"t": "ox", "dom": "掛金", "line": "iDeCoの掛金額は、年に1回であればいつでも変更できる。", "ans": "×", "ex": "<strong>「年1回」の年は、暦年ではありません。</strong>変更できるのは12月分から翌年11月分までの「拠出単位期間」につき1回（確定拠出年金法施行令29条3号・35条1号イ）。<br><br>だから11月分を変えた直後に12月分を変えることはできます。11月分と12月分は<strong>別の期間</strong>だからです。<br><br>⚠️ 逆に、同じ期間の中では2回目が効きません。4月に変えたら、次は翌年12月分まで変えられない。<br><br>「年に1回変えられます」だけ覚えていると、会社の賞与や昇給に合わせたい人に、間違った時期を案内します。", "src": "国民年金基金連合会「iDeCoをはじめるまでの4つのポイント」（2026年8月12日取得）／確定拠出年金法施行令29条3号・35条1号イ【一次】", "st": "law", "m": [["年に1回であればいつでも変更できる", "12月分〜翌年11月分の拠出単位期間につき1回。暦年ではない"]]}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの質問", "ask": "（経営者）どこの金融機関にするか、うちで決めて全員そこにさせるよ。手続きも楽でしょ？", "opts": [{"x": "金融機関を選ぶのはご本人です。会社が決める仕組みではありません", "r": "ok"}, {"x": "そうしましょう。まとまっていた方が事務も楽です", "r": "ng", "m": [["まとまっていた方が事務も楽です", "会社の都合で本人の選択を奪っている"]]}, {"x": "会社で決めていただいて構いませんが、反対する方が出るかもしれません", "r": "wrong", "m": [["会社で決めていただいて構いません", "会社が決める仕組みではない"]]}], "ex": "iDeCoは本人が「運営管理機関を1社だけ選ぶ」制度（国基連）。会社が選ぶ企業型DCとは、ここが根本的に違う。<br><br>会社ができるのは<strong>掛金を上乗せすること</strong>だけ。金融機関も商品も本人のもの。<br><br>⚠️ <strong>「事務が楽」は会社側の都合。</strong>それを理由に本人の選択を奪うと、後で「会社に言われて選んだ」という話になる。値下がりしたときに、説明を求められるのは会社になります。<br><br>⚠️ 会社が同じ機関を「紹介」するのと「決める」のは違う。<strong>紹介しても、決めるのは本人。</strong>", "src": "確定拠出年金法65条／国民年金基金連合会「iDeCoをはじめるまでの4つのポイント」【一次】／国民年金基金連合会 iDeCo公式サイト（2026年8月12日取得）", "st": "law"}, {"t": "sjt", "dom": "税社保", "scene": "経営者からの質問", "ask": "（経営者）年末調整、社員に生命保険料控除みたいに書かせればいいんだよね？", "opts": [{"x": "会社が処理します。書くのは個人払込の方だけです", "r": "ok"}, {"x": "はい、全員に申告書へ記入してもらってください。まとめて回収すれば済みます", "r": "ng", "m": [["全員に申告書へ記入してもらってください", "事業主払込の人は会社が処理済み。二重控除になりかねない"]]}, {"x": "税理士さんに確かめてみます", "r": "timid", "m": [["税理士さんに確かめて", "払込方法で分かれることは言い切ってよい"]]}], "ex": "<strong>払込の方法で、やる人が変わる。</strong><br><br><strong>事業主払込</strong>＝給与から天引きする際に、掛金額を控除したうえで源泉徴収税額を算出する。会社の給与計算の中で終わる。本人が申告書に書く必要はない。<br><br><strong>個人払込</strong>＝会社の源泉徴収事務はない。本人が年末調整で小規模企業共済等掛金控除として申告する。<br><br>⚠️ iDeCo+の対象になれるのは事業主払込の人だけ。だから上乗せを受けている人は、原則として会社側で処理される。<br><br>全員に書かせると、<strong>事業主払込の人は二重に控除されかねない。</strong>", "src": "国民年金基金連合会「事業主の方へ」源泉徴収および年末調整（2026年8月12日取得）／厚労省「確定拠出年金Q&A」232-5【一次】", "st": "law"}];
const N_SJT=8, N_OX=4;
// 誤答した設問を、日を空けて優先的に出し直す（Leitner）。
// 間違えたものは次のセッションで即戻す（Anki と同じ）。以後 3→7→14→30日と伸ばす
// （Cepeda 2008「最適間隔＝保持期間の10〜20%」に寄せた）。
const STEP=[0,3,7,14,30], KEY='idecoplus_genba_v2';
const qid=q=>(q.ask||q.line||'')+'#'+(q.opts?q.opts.map(o=>o.x).sort().join('|').slice(0,60):'');
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(m){ try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){} }
const today=()=>Math.floor(Date.now()/86400000);
function grade(q,ok){
  const m=load(), id=qid(q), r=m[id]||{box:0};
  r.box = ok ? Math.min(r.box+1, STEP.length-1) : 0;
  r.due = today() + STEP[r.box];
  r.miss = (r.miss||0) + (ok?0:1);
  m[id]=r; save(m);
}
function priority(q){                       // 小さいほど先に出す
  const r=load()[qid(q)];
  if(!r) return 1;                          // 未出題
  if(r.due<=today()) return 0 - (r.miss||0);// 期限到来。間違えた回数が多いほど先
  return 2;                                 // まだ寝かせる
}
let Q=[], i=0, log=[], screen='home', RETRY=0;
const $=id=>document.getElementById(id);
function sh(a){for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];}return a;}

function build(){
  const M=load();
  const byPri=a=>sh(a).sort((x,y)=>priority(x)-priority(y));
  // まだ一度も出していない設問の席を確保する。
  // これが無いと、間違え続けた人は同じ設問だけが毎回先頭に来て、残りに一生出会えない。
  // 1回の出題で同じ領域が偏らないよう上限を設ける。
  // 12問中7問以上が同じ領域になると、どう並べても隣り合ってしまうため（上限4問）。
  const CAP=4, used={};
  const LAST=(()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY+'_last')||'[]'))}catch(e){return new Set()}})();
  const take=(a,n,quota)=>{
    const out=[];
    const pull=(src,limit,respectCap)=>{
      for(const q of src){
        if(out.length>=limit) break;
        if(out.indexOf(q)>=0) continue;
        if(respectCap && (used[q.dom]||0)>=CAP) continue;
        used[q.dom]=(used[q.dom]||0)+1; out.push(q);
      }
    };
    // 前回出した設問は後回しにする（続けて回したときに同じ問ばかり出ないように）
    const notLast=x=>!LAST.has(qid(x));
    const fresh=a.filter(q=>!M[qid(q)]), old=a.filter(q=>M[qid(q)]);
    pull(fresh.filter(notLast), Math.min(quota,n), true);
    pull(old.filter(notLast),   n,                 true);
    pull(fresh.filter(notLast), n,                 true);
    pull(a.filter(notLast),     n,                 false);
    pull(a,                     n,                 false);  // それでも足りなければ前回分も使う
    return out;
  };
  const sjt=byPri(BANK.filter(q=>q.t==='sjt'));
  const hasTimid=sjt.filter(q=>q.opts.some(o=>o.r==='timid'));
  const rest=sjt.filter(q=>!q.opts.some(o=>o.r==='timid'));
  const pickS=take(hasTimid,3,1).concat(take(rest,N_SJT-3,2));
  const kotoba=take(byPri(BANK.filter(q=>q.dom==='言葉')),1,1);
  const pickO=kotoba.concat(take(byPri(BANK.filter(q=>q.t==='ox'&&q.dom!=='言葉')),N_OX-1,1));
  RETRY = pickS.concat(pickO).filter(q=>{const r=load()[qid(q)]; return r&&r.miss>0;}).length;
  // 同じ領域が続かないように並べる。
  // 残っている数が最も多い領域から、直前と違うものを取る（避けられる限り必ず避けられる）。
  const pool=sh(pickS.concat(pickO)), out=[];
  while(pool.length){
    const cnt={}; pool.forEach(q=>cnt[q.dom]=(cnt[q.dom]||0)+1);
    const prev=out.length?out[out.length-1].dom:null;
    let best=-1, bestC=-1;
    pool.forEach((q,k)=>{ if(q.dom===prev) return; if(cnt[q.dom]>bestC){ bestC=cnt[q.dom]; best=k; } });
    if(best<0) best=0;   // 残り全部が直前と同じ領域＝これ以上は避けられない
    out.push(pool.splice(best,1)[0]);
  }
  Q=out.map(q=>Object.assign({},q,{opts:q.opts?sh(q.opts.slice()):null}));
  try{localStorage.setItem(KEY+'_last',JSON.stringify(out.map(qid)))}catch(e){}
}

function render(){ if(screen==='home')return home(); if(screen==='result')return result(); question(); }

function home(){
  build(); $('prog').textContent=''; const n=$('next'); n.textContent='はじめる'; n.disabled=false;
  n.onclick=()=>{screen='quiz';i=0;log=[];render()};
  $('app').innerHTML=`<div class="card"><p class="lead">金融アドバイザー向け</p>
   <h2>経営者と従業員からの質問に、<br>あなたなら、どう答えますか。</h2>
   <p>商談で実際に飛んでくる場面を <strong>${Q.length}問</strong>。<strong>7〜10分</strong>です。</p>
   <ul>
     <li>点数も、合否も出しません。</li>
     <li>返すのは「<strong>あなたが選んだ言い方</strong>」と「<strong>こう言えます</strong>」の見比べだけです。</li>
     <li>すべて<strong>2026年12月1日施行の改正後</strong>のルールです。</li>
   </ul>
   <div class="hint" style="background:var(--ok-bg);color:var(--ok)"><b>ここは、間違えるための場所です。</b>商談で間違えないために。点数はつけません。記録は端末の中だけです。</div>
   ${RETRY?'<div class="hint">前回まちがえた '+RETRY+'問 が、今回もう一度出ます。</div>':''}
   <div class="hint"><strong>持ち帰ってよい場面もあります。</strong>ただし調べれば分かることは、その場で答えられた方が話が早く進みます。その区別も設問に入れています。</div>
  </div>
  <div class="card"><p class="note">記録は端末の中だけです。どこにも送信しません。認定でも資格でもありません。</p></div>`;
}

function question(){
  const q=Q[i]; $('prog').textContent=(i+1)+' / '+Q.length;
  let h='<div class="card">';
  if(q.t==='ox'){ h+='<p class="scene"><span class="tag">○×</span></p><div class="said">'+q.line+'</div><p class="ask">正しいですか。</p>'; }
  else { if(q.scene) h+='<p class="scene">'+q.scene+'</p>';
         if(q.ask) h+='<div class="said">'+q.ask+'</div>';
         h+='<p class="ask">あなたなら、どう'+(q.ask?'答え':'説明し')+'ますか。</p>'; }
  h+='<div id="s1"></div><div id="fb"></div></div>';
  $('app').innerHTML=h;
  const s1=$('s1');
  const list = q.t==='ox' ? [{x:'正しい',r:q.ans==='○'?'ok':'ng2'},{x:'誤り',r:q.ans==='×'?'ok':'ng2'}]
                          : q.opts;
  list.forEach((o,k)=>{ const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="n">'+(k+1)+'</span><span>'+o.x+'</span>';
    b.onclick=()=>choose(k,list); s1.appendChild(b); });
  const n=$('next'); n.disabled=true; n.textContent=(i===Q.length-1)?'結果を見る':'次へ';
  n.onclick=()=>{ i++; if(i>=Q.length) screen='result'; render(); window.scrollTo({top:0}); };
}

function cueHTML(txt,marks){ let h=txt;
  marks.forEach(([sub])=>{ const at=h.indexOf(sub); if(at<0)return;
    h=h.slice(0,at)+'<mark class="cue">'+sub+'</mark>'+h.slice(at+sub.length); });
  return '<div class="cuetext">'+h+'</div><ul class="cuelist">'
    + marks.map(([sub,why])=>'<li><b>「'+sub+'」</b>'+why+'</li>').join('') + '</ul>';
}
function choose(k,list){
  const q=Q[i], o=list[k];
  const cls = o.r==='ok' ? 'pick-ok' : (o.r==='timid' ? 'pick-warn' : 'pick-ng');
  document.querySelectorAll('#s1 .opt').forEach((b,j)=>{ b.disabled=true;
    if(j===k) b.classList.add(cls); else if(list[j].r==='ok') b.classList.add('show'); });
  const ok=list.find(x=>x.r==='ok');
  let v='', vc='';
  if(o.r==='ok'){ v='そのとおりです。'; vc='v-ok'; }
  else if(o.r==='timid'){ v='ここは、言い切って大丈夫です。'; vc='v-warn'; }
  else if(o.r==='ng'){ v='この言い方は避けます。'; vc='v-ng'; }
  else { v='ここは違います。'; vc='v-ng'; }
  let h='<div class="verdict '+vc+'">'+v+'</div>';
  if(o.r!=='ok' && q.t==='sjt'){
    h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+o.x+'</div>'
      +'<div class="b"><b>こう言えます</b>'+ok.x+'</div></div>';
  }
  // 違う語句を、その場で色を付けて示す（フィッシング訓練で効果差が最も大きかった要素）
  let cq=null, ct='', ttl='';
  if(q.t==='ox'){ if(q.m){ cq=q.m; ct=q.line; ttl=(q.ans==='×')?'違うのはここ':'決め手はここ'; } }
  else if(o.m){ cq=o.m; ct=o.x; ttl='違うのはここ'; }
  else { const bad=list.find(x=>x.m); if(bad){ cq=bad.m; ct=bad.x; ttl='よくある言い間違い'; } }
  if(cq) h+='<div class="cuebox"><b>'+ttl+'</b>'+cueHTML(ct,cq)+'</div>';
  h+='<div class="explain">'+q.ex+'<div class="src '+(q.st==='lsfp'?'lsfp':'law')+'">'
    +(q.st==='lsfp'?'これは制度の決まりではなく、<b>制作者（株式会社LSFP）の考え方</b>です'+(/条|取得|【一次】/.test(q.src)?'<br>参照：'+q.src.replace(/^制作者（株式会社LSFP）の考え方[（／]?/,'').replace(/）$/,''):''):'根拠：'+q.src)+'</div></div>';
  $('fb').innerHTML=h;
  grade(q, o.r==='ok');
  log.push({dom:q.dom, t:q.t, r:o.r, mine:o.x, ok:ok?ok.x:'', line:q.ask||q.line, ans:q.ans, why:(q.m&&q.m[0]?q.m[0][1]:'')});
  $('next').disabled=false;
  $('fb').scrollIntoView({behavior:'smooth',block:'start'});
}

function result(){
  $('prog').textContent='';
  const ng=log.filter(l=>l.r==='ng'), timid=log.filter(l=>l.r==='timid');
  const oxNg=log.filter(l=>l.t==='ox'&&l.r!=='ok'), wrong=log.filter(l=>l.r==='wrong');
  const fix=ng.concat(wrong);
  let h='<div class="card">';
  h+= fix.length===0 && timid.length===0
    ? '<h2>今回の'+Q.length+'場面では、直すところはありませんでした。</h2>'
    : '<h2>直せる言い回しが、'+(fix.length+timid.length)+'か所 見つかりました。</h2>';
  h+='</div>';
  fix.forEach(m=>{ h+='<div class="card"><div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
    +'</div><div class="b"><b>こう言えます</b>'+m.ok+'</div></div></div>'; });
  if(timid.length){ h+='<div class="card"><h2 style="font-size:18px">ここは、言い切って大丈夫でした</h2>';
    timid.forEach(m=>{ h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
      +'</div><div class="b"><b>言い切ってよい</b>'+m.ok+'</div></div>'; });
    h+='<div class="warnbox">調べれば分かることは、その場で答えられた方が話が早く進みます。<b>言い方を選ぶことと、言い切ることは、別のことです。</b></div></div>'; }
  if(oxNg.length){ h+='<div class="card"><h2 style="font-size:18px">確認しておきたい事実</h2><ul>';
    oxNg.forEach(m=>{ h+='<li>「'+m.line+'」<br><b>→ '
      +(m.ans==='×'?'この説明は誤りです':'この説明で正しいです')+'。</b>'
      +(m.why?' '+m.why:'')+'</li>'; }); h+='</ul></div>'; }
  const says=log.filter(l=>l.t!=='ox'&&l.ok&&l.r!=='ok');
  if(says.length){
    h+='<div class="card"><h2 style="font-size:18px">最後にもう一度、正しい言い方</h2>'
      +'<p class="note" style="margin-top:-6px">最後に、これだけ読み直して終わってください。</p><ul>';
    says.forEach(m=>{ h+='<li>'+m.ok+'</li>'; });
    h+='</ul></div>';
  }
  h+='<div class="card"><p class="note">これは免許でも認定でもありません。制度は変わります。<br>'
   +'掛金の上限額など、改正後の規約がまだ公表されていない論点は出題していません。<br>'
   +'個別の判断は、社労士・税理士・国民年金基金連合会へご確認ください。</p></div>';
  $('app').innerHTML=h;
  const n=$('next'); n.textContent='別の'+Q.length+'問をやる'; n.disabled=false;
  n.onclick=()=>{screen='home';render();window.scrollTo({top:0})};
  window.scrollTo({top:0});
}
render();
</script>
