<!doctype html>
<html lang="ja">
<head>

<title>iDeCo+ 現場チェック｜2026年12月以降のルール</title>
<style>
:root{
  --green:#273E22; --green-l:#3D5C35; --tint:#EAF0E7;
  --bg:#FBFAF7; --card:#fff; --tx:#1D211C; --sub:#5C6659; --line:#DDE3D9;
  --ng:#B3261E; --ng-bg:#FDECEA; --ok:#1F6B3A; --ok-bg:#E8F3EB;
  --warn:#8A5A00; --warn-bg:#FFF4E0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14170F;--card:#1D2118;--tx:#EDEFE9;--sub:#A3AC9B;--line:#333A2C;
  --tint:#232A1E;--ng-bg:#3A1B18;--ok-bg:#17301F;--warn-bg:#332708;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:17px;line-height:1.75;padding:0 0 96px;}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{background:var(--green);color:#fff;padding:18px 0 16px;margin-bottom:22px}
header .wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:.02em}
.asof{font-size:13px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.lead{font-size:15px;color:var(--sub);margin:0 0 6px}
h2{font-size:21px;margin:0 0 14px;line-height:1.5}
.note{font-size:14px;color:var(--sub)}
.speech{background:var(--tint);border-left:5px solid var(--green-l);
  border-radius:0 10px 10px 0;padding:16px 18px;margin:14px 0 20px;
  font-size:19px;font-weight:600;line-height:1.7}
.scene{font-size:15px;color:var(--sub);margin-bottom:4px}
.q{font-size:16px;font-weight:600;margin:18px 0 10px}
button.opt{display:block;width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:10px;
  font:inherit;font-size:17px;color:var(--tx);cursor:pointer;transition:.12s}
button.opt:hover{border-color:var(--green-l)}
button.opt.sel-ok{border-color:var(--ok);background:var(--ok-bg)}
button.opt.sel-ng{border-color:var(--ng);background:var(--ng-bg)}
button.opt.show{border-color:var(--ok);background:var(--ok-bg)}
button.opt:disabled{cursor:default;opacity:.95}
.big{font-size:19px;font-weight:700}
.verdict{border-radius:12px;padding:14px 16px;margin:16px 0;font-weight:700;font-size:17px}
.v-ok{background:var(--ok-bg);color:var(--ok)}
.v-ng{background:var(--ng-bg);color:var(--ng)}
.explain{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;font-size:16px}
.explain strong{color:var(--green-l)}
@media (prefers-color-scheme:dark){.explain strong{color:#9CC48E}}
.src{font-size:13px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:12px;align-items:center;padding:0 18px}
.prog{flex:1;font-size:14px;color:var(--sub)}
button.next{background:var(--green);color:#fff;border:0;border-radius:11px;
  padding:14px 26px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button.next:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--green-l);border:2px solid var(--line);
  border-radius:11px;padding:13px 22px;font:inherit;font-size:16px;cursor:pointer}
.red{background:var(--ng-bg);border-left:5px solid var(--ng);border-radius:0 10px 10px 0;
  padding:14px 16px;margin-bottom:12px}
.red b{color:var(--ng);display:block;margin-bottom:4px;font-size:17px}
.red span{font-size:15px;color:var(--sub)}
.metric{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 0;border-bottom:1px solid var(--line)}
.metric .n{font-size:26px;font-weight:800}
.metric .lbl{font-size:16px}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:13px 15px;font-size:14px;margin-top:18px}
ul{padding-left:1.2em;margin:8px 0}li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;background:var(--tint);color:var(--sub);
  border-radius:20px;padding:3px 11px;margin-right:6px}
</style>
</head>

// ── 1回の出題＝銀行45問から20問を選抜（A6・B8・○×6）
// 「全部Bを選ぶ」攻略を潰すため、正解Aの比率を毎回3割に固定する。
// さらに隣接する問題の領域が重ならないよう並べ替える（似た問題が続いて見えるのを防ぐ）。
const PICK={A:6,B:8,OX:6};
let Q=[];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function buildSession(){
  const pa=shuffle(BANK.filter(q=>q.t==='talk'&&q.ans==='A')).slice(0,PICK.A);
  const pb=shuffle(BANK.filter(q=>q.t==='talk'&&q.ans==='B')).slice(0,PICK.B);
  const po=shuffle(BANK.filter(q=>q.t==='ox')).slice(0,PICK.OX);
  let pool=shuffle(pa.concat(pb,po));
  // 隣接同領域をほぐす
  const out=[];
  while(pool.length){
    let idx=pool.findIndex(q=>!out.length || q.dom!==out[out.length-1].dom);
    if(idx<0) idx=0;
    out.push(pool.splice(idx,1)[0]);
  }
  // 修復パス：残った隣接同領域を入れ替えで解消する
  for(let pass=0;pass<3;pass++){
    let fixed=true;
    for(let k=1;k<out.length;k++){
      if(out[k].dom!==out[k-1].dom) continue;
      let j=out.findIndex((q,x)=>x>k+1 && q.dom!==out[k-1].dom
            && (x+1>=out.length || out[x+1].dom!==out[k].dom)
            && out[x-1].dom!==out[k].dom);
      if(j<0) j=out.findIndex((q,x)=>x!==k && q.dom!==out[k-1].dom);
      if(j>-1){ const t=out[k]; out[k]=out[j]; out[j]=t; fixed=false; }
    }
    if(fixed) break;
  }
  Q=out;
}
buildSession();

let i=0, stage=0, picked={}, log=[];
const app=document.getElementById('app'), nextBtn=document.getElementById('next'), prog=document.getElementById('prog');
let screen='home';

function esc(s){return s}
function render(){
  if(screen==='home')return home();
  if(screen==='result')return result();
  question();
}

function home(){
  prog.textContent=''; nextBtn.textContent='はじめる'; nextBtn.disabled=false;
  nextBtn.onclick=()=>{buildSession();screen='quiz';i=0;stage=0;picked={};log=[];render()};
  app.innerHTML=`<div class="card">
   <p class="lead">金融アドバイザー向け</p>
   <h2>社長の前で、その一言は言っていいか。</h2>
   <p>実際の商談で飛んでくる場面を ${Q.length} 問。<strong>5〜8分</strong>です。</p>
   <ul>
     <li><strong>件数は出しますが、合否は出しません。</strong></li>
     <li>返すのは「<strong>本番なら顧客に届いていたNG話法が、何件あったか</strong>」です。</li>
     <li>すべて<strong>2026年12月1日施行の改正後</strong>のルールで出題します。</li>
   </ul>
   <div class="warnbox">全部「言ってはいけない」を選べば、NG話法はゼロになります。<b>そうならないように、言い切ってよい場面も混ぜてあります。</b>持ち帰りが多すぎないかも測ります。</div>
  </div>
  <div class="card"><p class="note">この記録は端末の中だけに保存され、どこにも送信されません。認定や資格ではありません。</p></div>`;
}

function question(){
  const q=Q[i];
  prog.textContent=`${i+1} / ${Q.length}`;
  let h='<div class="card">';
  if(q.t==='ox'){
    h+=`<p class="scene"><span class="tag">○×</span>次の記述は正しいか。</p>
        <div class="speech">${q.line}</div><div id="s1"></div>`;
  }else{
    h+=`<p class="scene">${q.scene}</p><div class="speech">${q.line}</div>
        <p class="q">この発言を、いま顧客の前で言ってよいか。</p><div id="s1"></div>`;
  }
  h+='<div id="s2"></div><div id="s3"></div><div id="ex"></div></div>';
  app.innerHTML=h;

  const s1=document.getElementById('s1');
  const opts = q.t==='ox' ? ['○','×'] : ['A. 言ってよい','B. 言ってはいけない'];
  opts.forEach((label,idx)=>{
    const b=document.createElement('button'); b.className='opt big'; b.textContent=label;
    b.onclick=()=>pick1(idx); s1.appendChild(b);
  });
  nextBtn.disabled=true; nextBtn.textContent = (i===Q.length-1)?'結果を見る':'次へ';
  nextBtn.onclick=()=>{ i++; stage=0; if(i>=Q.length){screen='result'} render(); };
}

function pick1(idx){
  const q=Q[i];
  const val = q.t==='ox' ? (idx===0?'○':'×') : (idx===0?'A':'B');
  const ok = (val===q.ans);
  picked.a1=val; picked.ok1=ok;
  const btns=document.querySelectorAll('#s1 .opt');
  btns.forEach((b,k)=>{b.disabled=true;
    const isCorrect = q.t==='ox' ? ((k===0?'○':'×')===q.ans) : ((k===0?'A':'B')===q.ans);
    if(k===idx) b.className='opt big '+(ok?'sel-ok':'sel-ng');
    else if(isCorrect) b.className='opt big show';
  });
  const v=document.createElement('div');
  v.className='verdict '+(ok?'v-ok':'v-ng');
  if(q.t==='ox'){ v.textContent = ok?'正解':`不正解（正解は ${q.ans}）`; }
  else if(q.ans==='B'){ v.textContent = ok?'そのとおり。これは言ってはいけません。':'⚠ 本番なら、この発言は顧客に届いていました。'; }
  else { v.textContent = ok?'そのとおり。ここは言い切ってよい場面です。':'⚠ 言ってよい場面で、止まってしまいました。'; }
  document.getElementById('s1').after(v);

  if(q.t!=='ox' && q.ans==='B'){ stage2(); }
  else if(q.alt){ stage3(); }
  else { showEx(); }
}

function stage2(){
  const q=Q[i], box=document.getElementById('s2');
  box.innerHTML='<p class="q">なぜ言ってはいけないのか。<span class="note">（複数あてはまるときは、上にあるものを選ぶ）</span></p>';
  REASONS.forEach((r,k)=>{
    const b=document.createElement('button'); b.className='opt';
    b.textContent=`${['①','②','③','④'][k]} ${r}`;
    b.onclick=()=>{
      const ok=(k===q.reason); picked.ok2=ok;
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;
        if(j===k)x.className='opt '+(ok?'sel-ok':'sel-ng'); else if(j===q.reason)x.className='opt show';});
      if(q.alt) stage3(); else showEx();
    };
    box.appendChild(b);
  });
}

function stage3(){
  const q=Q[i], box=document.getElementById('s3');
  box.innerHTML='<p class="q">'+(q.ans==='A'?'さらに付け加えるなら、どれか。':'では、何と言えばよいか。')+'</p>';
  q.alt.forEach((a,k)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=a[0];
    b.onclick=()=>{
      const ok=!!a[1]; picked.ok3=ok;
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;
        if(j===k)x.className='opt '+(ok?'sel-ok':'sel-ng'); else if(q.alt[j][1])x.className='opt show';});
      showEx();
    };
    box.appendChild(b);
  });
}

function showEx(){
  const q=Q[i];
  document.getElementById('ex').innerHTML=
    `<div class="explain">${q.ex}<div class="src">根拠：${q.src}</div></div>`;
  log.push({q:i, ok1:picked.ok1, ans:q.ans, type:q.t, harm:q.harm,
            line:(q.bad || q.line.replace(/<br>.*/,''))});
  picked={}; nextBtn.disabled=false;
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function result(){
  prog.textContent='';
  const bQ=log.filter(l=>l.type==='talk'&&l.ans==='B');
  const aQ=log.filter(l=>l.type==='talk'&&l.ans==='A');
  const oxQ=log.filter(l=>l.type==='ox');
  const missed=bQ.filter(l=>!l.ok1);
  const stopped=bQ.filter(l=>l.ok1).length;
  const spoke=aQ.filter(l=>l.ok1).length;
  const oxOk=oxQ.filter(l=>l.ok1).length;

  let h='<div class="card">';
  if(missed.length===0){
    h+='<h2>NG話法は1件もありませんでした。</h2>';
  }else{
    h+=`<h2>本番なら顧客に届いていたNG話法が、<span style="color:var(--ng)">${missed.length}件</span> ありました。</h2>`;
    missed.forEach(m=>{h+=`<div class="red"><b>「${m.line}」</b><span>${m.harm||''}</span></div>`});
  }
  h+='</div><div class="card">';
  h+=`<div class="metric"><span class="lbl">NG話法を言わずに済んだ</span><span class="n">${stopped}<span style="font-size:16px;font-weight:400">/${bQ.length}</span></span></div>`;
  h+=`<div class="metric"><span class="lbl">言い切るべき場面で、言い切れた</span><span class="n">${spoke}<span style="font-size:16px;font-weight:400">/${aQ.length}</span></span></div>`;
  h+=`<div class="metric" style="border:0"><span class="lbl">事実の確認</span><span class="n">${oxOk}<span style="font-size:16px;font-weight:400">/${oxQ.length}</span></span></div>`;
  if(aQ.length-spoke>=2){
    h+='<div class="warnbox"><b>持ち帰りが多すぎます。</b>言い切ってよい場面で止まると、社長からは「調べないと何も答えられない人」に見えます。NG話法を避けるのと、言い切るべきことを言い切るのは、別の力です。</div>';
  }
  h+='</div>';
  h+=`<div class="card"><p class="note"><b>これは免許でも認定でもありません。</b>2026年12月1日以降の制度にもとづく確認です。制度は変わります。<br><br>掛金の上限額など、改正後の規約がまだ公表されていない論点は出題していません。</p></div>`;
  app.innerHTML=h;
  nextBtn.textContent='もう一度'; nextBtn.disabled=false;
  nextBtn.onclick=()=>{screen='home';render()};
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
