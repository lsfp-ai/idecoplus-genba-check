<style>
:root{--green:#273E22;--green-l:#3D5C35;--tint:#EAF0E7;--bg:#FBFAF7;--card:#fff;--tx:#1D211C;

--warn:#8A5A00;--warn-bg:#FFF4E0;--lsfp:#4A4470;--lsfp-bg:#EFEDF7;}
@media (prefers-color-scheme:dark){:root{--bg:#14170F;--card:#1D2118;--tx:#EDEFE9;--sub:#A3AC9B;
--line:#333A2C;--tint:#232A1E;--ng-bg:#3A1B18;--ok-bg:#17301F;--warn-bg:#332708;--lsfp-bg:#22203A;--ng:#FFA79E;--ok:#8FD9A8;--warn:#E8C46A;--lsfp:#BDB7EA;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
font-size:17px;line-height:1.75;padding:0 0 104px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{background:var(--green);color:#fff;padding:18px 0;margin-bottom:20px}
header .wrap{display:flex;align-items:center;gap:18px;flex-wrap:nowrap}
header .lsfpmark{flex:0 0 auto}
header .htext{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
h1{font-size:18px;margin:0}.asof{font-size:13px;opacity:.85}
.svc{flex-basis:100%;font-size:12.5px;letter-spacing:.06em;opacity:.85;margin:0 0 3px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:21px;margin:0 0 14px;line-height:1.5}
.lead{font-size:15px;color:var(--sub);margin:0 0 6px}.note{font-size:14px;color:var(--sub)}
.scene{font-size:14px;color:var(--sub);margin-bottom:8px}
.said{background:var(--tint);border-left:5px solid var(--green-l);border-radius:0 10px 10px 0;
padding:15px 17px;margin:0 0 18px;font-size:19px;font-weight:600;line-height:1.7}
.ask{font-size:18px;font-weight:700;margin:0 0 14px}
button.opt{display:flex;gap:11px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
border-radius:12px;padding:15px 16px;margin-bottom:11px;font:inherit;font-size:17px;color:var(--tx);cursor:pointer;line-height:1.65}
button.opt .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--tint);color:var(--sub);
display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:2px}
button.opt:hover{border-color:var(--green-l)}
button.opt.pick-ok{border-color:var(--ok);background:var(--ok-bg)}
.say{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0 12px;line-height:1.75}
.sayrow{display:flex;gap:10px}.sayrow .opt{justify-content:center;font-weight:600}
.todo{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px 16px;margin:10px 0;line-height:1.8}
.todo b{display:block;margin-bottom:4px;font-size:13px;opacity:.85}
button.opt.pick-ng{border-color:var(--ng);background:var(--ng-bg)}
button.opt.pick-warn{border-color:var(--warn);background:var(--warn-bg)}
button.opt.show{border-color:var(--ok)}
button.opt.show .n{background:var(--ok);color:#fff}
button.opt:disabled{cursor:default;opacity:.97}
.verdict{border-radius:12px;padding:14px 16px;margin:16px 0 0;font-weight:700;font-size:17px}
.v-ok{background:var(--ok-bg);color:var(--ok)}.v-ng{background:var(--ng-bg);color:var(--ng)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.swap{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.swap div{padding:12px 15px;font-size:16px}
.swap .a{background:var(--ng-bg);color:var(--ng)}
.swap .b{background:var(--ok-bg);color:var(--ok);border-top:1px solid var(--line)}
.swap b{display:block;font-size:12px;opacity:.8;margin-bottom:3px;font-weight:700}
.explain{border-top:1px solid var(--line);margin-top:16px;padding-top:15px;font-size:16px}
.explain strong{color:var(--green-l)}
@media (prefers-color-scheme:dark){.explain strong{color:#9CC48E}}
.src{font-size:13px;margin-top:12px;padding:9px 12px;border-radius:8px}
.src.law{background:var(--tint);color:var(--sub)}
.src.lsfp{background:var(--lsfp-bg);color:var(--lsfp)}
@media (prefers-color-scheme:dark){.src.lsfp{color:#B9B3E0}}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:12px;align-items:center}
.prog{flex:1;font-size:14px;color:var(--sub)}
button.next{background:var(--green);color:#fff;border:0;border-radius:11px;padding:14px 26px;
font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button.next:disabled{opacity:.35;cursor:default}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:13px 15px;font-size:14px;margin-top:16px}
.hint{background:var(--tint);border-radius:10px;padding:12px 15px;font-size:14px;color:var(--sub);margin-top:16px}
ul{padding-left:1.2em;margin:8px 0}li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;background:var(--tint);color:var(--sub);border-radius:20px;padding:3px 11px}
.qno{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--sub);background:var(--tint);border-radius:5px;padding:2px 7px;margin-right:8px;font-variant-numeric:tabular-nums}

.cuebox{margin:14px 0;padding:14px 16px;border:1px solid #d8c9a8;border-radius:10px;background:#fdfaf2}
.cuebox>b{display:block;font-size:.82rem;letter-spacing:.04em;color:#7a6330;margin-bottom:8px}
.cuetext{line-height:1.85;font-size:.98rem;margin-bottom:10px}
mark.cue{background:#ffe9a8;color:inherit;padding:1px 3px;border-radius:3px;
  box-shadow:inset 0 -2px 0 #e8b93a;font-weight:600}
.cuelist{margin:0;padding-left:1.1em;font-size:.88rem;line-height:1.75;color:#4a4a4a}
.cuelist li{margin:4px 0}
.cuelist b{color:#8a5a00}
@media(prefers-color-scheme:dark){
 .cuebox{background:#2a2620;border-color:#5a4c2e}
 .cuebox>b{color:#d8bd7a}
 mark.cue{background:#6b5518;color:#ffeec2;box-shadow:inset 0 -2px 0 #b8912f}
 .cuelist{color:#c9c4bb} .cuelist b{color:#e3c176}}
</style>

", "ans": "○", "ex": "<strong>ここが3制度を分ける一番太い線。</strong><br><br>選択制DC＝給与そのものを振り替えるので標準報酬月額が動き得る。iDeCo+＝会社が給与とは別に上乗せ。マッチング拠出＝本人の給与から拠出するが給与額は変わらない。<br><br>この扱いには当局側の根拠もある。厚労省は「賃金に当たらないため、社会保険料等の算定対象とならない」とし、年金機構の疑義照会もDC掛金を報酬に足し戻していない。<br><br>⚠️ <strong>ただし対象は企業型DCで、iDeCo+ではない。</strong>iDeCo+の中小事業主掛金を名指しで「報酬に含まれない」とした当局資料は、探した範囲では見つかっていない。<br><br>税（所得税法施行令64条1項5号）の結論を社会保険に持ち込まない。別の法律。断定が必要な場面では、管轄の年金事務所に文書で照会すること。", "src": "社会保障審議会 企業年金・個人年金部会 第38回 資料1（2024年12月2日）19頁・22頁「賃金に当たらないため、社会保険料等の算定対象とならない」／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8／健康保険法46条（現物給与）／所得税法施行令64条1項5号【一次】　※いずれも企業型DC。iDeCo+は当局明示なし", "st": "law", "m": [["下がり得るのは選択制DCだけ", "給与そのものを振り替えるのは選択制DCだけ。ここが3制度を分ける線"]], "cl": "報酬該当性", "no": 4}, {"t": "ox", "dom": "税社保", "line": "iDeCo+の事業主掛金は国民年金基金連合会に直接納付され、本人に現金で渡らない。だから社会保険料の算定基礎に入らない――こう説明してよい。", "ans": "×", "ex": "<strong>結論はたぶん合っている。理由が間違っている。</strong><br><br>社会保険には現物給与がある。「報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合」も報酬として扱う（健康保険法46条）。社宅・食事・通勤定期は現金で渡らないが報酬になる。<br><br>つまり「現金で本人に渡らない＝報酬ではない」は成立しない。この理由づけでは、詳しい方には通用しません。<br><br>企業型DCについては当局側の根拠がある。理由は<strong>「事業主が拠出すべきことが法令上定められているので、労働の対償として支払うものと同視できない」</strong>であって、現金で渡るかどうかではない。<br><br>⚠️ そしてiDeCo+を名指しした当局資料は、探した範囲では見つかっていない。断定が要る場面では、管轄の年金事務所へ文書で照会すること。", "src": "健康保険法46条（現物給与の価額）／社会保障審議会 企業年金・個人年金部会 第38回 資料1 19頁・22頁／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8【一次】　※iDeCo+は当局明示なし", "st": "law", "m": [["本人に現金で渡らない。だから", "現物給与があるので、この理由づけは成立しない（健保法46条）"]], "cl": "報酬該当性", "no": 5}, {"t": "sjt", "dom": "可否", "scene": "経営者からの質問", "ask": "（経営者）私、一人法人の代表なんだけど、私自身にも上乗せできるの？", "opts": [{"x": "はい、代表者ご自身も対象になります", "r": "ng", "m": [["対象になります", "厚生年金の被保険者かどうかで決まる。言い切れない"]]}, {"x": "厚生年金にご加入かどうかで決まります。役員報酬と加入の状況を確認させてください", "r": "ok"}, {"x": "対象外です。代表者ご自身は対象になりません", "r": "wrong", "m": [["対象外です", "被保険者であれば対象になり得る"]]}], "ex": "厚生年金の被保険者かどうかで決まります。<br><br>★ 一人法人の代表は<strong>自分が事業主</strong>。「もらえるか」ではなく「自分が対象者に入るか」という質問だと捉える。<br><br>対象は事業主が使用する第1号厚生年金被保険者（法68条の2第1項）なので、ご本人が被保険者であれば、その中に入り得る。<br><br>「対象になります」も「対象外です」も、その場では言い切れません。役員報酬が出ていないなど、代表者ご自身が厚生年金の被保険者でない場合があるためです。<br><br>持ち帰るときも「調べます」だけで終えず、<strong>何を調べるのかを言う</strong>と話が前に進みます。", "src": "確定拠出年金法62条1項2号（国民年金法7条1項2号の第2号被保険者＝厚生年金の被保険者）／同法68条の2第1項（中小事業主掛金の対象は第1号厚生年金被保険者）／厚生年金保険法9条【一次】　※一人法人代表の個別判定は国民年金基金連合会へ確認", "st": "law", "no": 6}, {"t": "sjt", "dom": "税社保", "scene": "経営者への説明", "ask": "（経営者）3つとも、年末調整で所得控除できるんだよね？", "opts": [{"x": "掛金の分は、どれも年末調整で所得控除できます", "r": "ng", "m": [["どれも", "事業主が出した分は本人の所得にならない。控除できるのは本人が出した分だけ"]]}, {"x": "年末調整に載せるのは、ご本人が出した分だけです", "r": "ok"}, {"x": "3つとも年末調整で控除されます", "r": "wrong", "m": [["3つとも", "事業主掛金は本人の所得にならないので、控除の対象外"]]}], "ex": "iDeCo+の事業主掛金は<strong>そもそも本人の所得にならない</strong>ので、控除の対象外。「控除できない」ではなく「課税されない」。本人にとっては、こちらの方が有利。選択制DCは給与自体が減るので年末調整に登場しない。<br><br>「所得控除で減る」と「そもそも所得にならない」は別物。<br><br><strong>所得控除型</strong>（iDeCo+本人掛金・マッチング）＝所得税と住民税だけ減る。社会保険料は減らない。<br>非所得型（iDeCo+事業主掛金）＝もともと本人の所得ではないので、控除する対象がない。年末調整に入れると過大控除。<br>給与減少型（選択制DC）＝給与自体が減るので、年末調整に登場しない。", "src": "所得税法施行令64条1項5号（事業主掛金は給与所得の収入金額に含まれない）／所得税法75条1項・2項2号・190条2号イ【一次】", "st": "law", "no": 7}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの質問", "ask": "（経営者）全員入らせたいんだけど、強制できる？", "opts": [{"x": "できません。加入は本人の任意です", "r": "ok"}, {"x": "強制できるかどうかは、確認してからお答えします", "r": "timid", "m": [["確認してからお答えします", "任意加入は制度の基本。ここは言い切る"]]}, {"x": "就業規則に書けば、全員加入にできます。手続きもこちらで進めます", "r": "ng", "m": [["就業規則に書けば", "加入は本人の任意。規程で強制できない"]]}], "ex": "曖昧にすると経営者が「入りなさい」と言ってしまい、労務のトラブルになる。<br><br>そのうえで「入らない人には掛金が出ないので不公平感が出ます。説明会での周知が要ります」まで言えると親切。", "src": "確定拠出年金法62条1項・3項（本人の申出により加入）／厚労省・国基連「iDeCo＋導入ガイド」p.3【一次】", "st": "law", "no": 8}, {"t": "ox", "dom": "掛金", "line": "マッチング拠出は、給与の額を変えずに、本人が自分で上乗せする仕組みである。", "ans": "○", "ex": "そのとおり。給与の額そのものは変わりません。本人が自分の掛金を出し、それを会社が給与から預かって納付します。<br><br>⚠️ <strong>給与を減らして振り替えるのは選択制DC</strong>。こちらは標準報酬月額が動く可能性があります。マッチング拠出は給与額が変わらないので動きません。<br><br>⚠️ 2026年4月1日から、本人の掛金が事業主掛金を超えてはいけないという制限は撤廃されました（合算が限度額内であれば可）。", "src": "確定拠出年金法19条3項・4項（加入者が自ら拠出・額を決定）／所得税法75条2項2号【一次】", "st": "law", "m": [["給与の額を変えずに、本人が自分で上乗せする", "選択制DCとの一番太い違い"]], "no": 9}, {"t": "sjt", "dom": "税社保", "scene": "選択制DCの提案", "ask": "（経営者）月2万円を掛金に回したら、社会保険料はいくら下がるの？", "opts": [{"x": "月2万円を掛金に回せば、その分だけ社会保険料が下がります", "r": "ng", "m": [["その分だけ", "保険料は等級で決まる。掛金の額に比例しない"]]}, {"x": "等級が変わらなければ、健康保険料と厚生年金保険料は変わりません", "r": "ok"}, {"x": "掛金の額に比例して下がります", "r": "wrong", "m": [["比例して", "保険料は等級の段階制。掛金の額には比例しない"]]}], "ex": "健康保険料と厚生年金保険料は<strong>標準報酬月額の等級制</strong>。給与が下がっても等級をまたがなければ1円も変わりません。<br><br>「掛金の分だけ下がる」も「掛金の額に比例して下がる」も、<strong>比例で考えている点が同じ誤り</strong>です。等級が動くかを先に確認します。<br><br>⚠️ <strong>「社会保険料」と一括りにしない。</strong>雇用保険料は賃金総額に料率を掛けるので、等級と関係なく賃金が減れば必ず下がります。等級で決まるのは健康保険料と厚生年金保険料の方です。<br><br>下がる時期も項目ごとに違います。下がり幅が1等級なら定時決定で9月分から、2等級以上なら随時改定で4か月目から、住民税は翌年6月から。", "src": "健康保険法3条5項・厚生年金保険法3条1項3号（報酬の定義）／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8【一次】", "st": "law", "no": 10}, {"t": "sjt", "dom": "ガバ", "scene": "経営者への説明", "ask": "（経営者）iDeCo+って、もうだいぶ広まってるんでしょ？", "opts": [{"x": "はい、かなり広まってきています。御社も乗り遅れない方がいいですよ", "r": "ng", "m": [["かなり広まってきています", "実施は約1万事業所。企業年金のない中小の数からすればごく一部"], ["乗り遅れない方がいい", "根拠のない優位性の示唆"]]}, {"x": "実施は1万事業所ほどです。まだ広がっていません", "r": "ok"}, {"x": "大企業さんはもうほとんど導入済みで、中小もこれからです", "r": "wrong", "m": [["大企業さんはもうほとんど導入済み", "iDeCo+は300人以下の中小限定。大企業は使えない"]]}], "ex": "実施は2026年6月末で10,243事業所、拠出対象者64,845人（事業所数は前年同月比112.0%）。<br><br>これを「広まっている」と見るかは、何と比べるかによる。企業年金のない中小企業の数と並べれば、ごく一部にとどまる。<br><br><strong>「まだ少ない」を先に認めた方が、そのあとの説明が通る。</strong><br><br>⚠️ ただし「少ないから今やる価値がある」まで言うと、根拠のない優位性の示唆になる。事実を述べるところで止める。", "src": "制作者（株式会社LSFP）の考え方／国民年金基金連合会「iDeCo＋の加入等の概況（2026年6月）」＝実施10,243事業所・拠出対象者64,845人・事業所数前年同月比112.0%【一次】", "st": "lsfp", "no": 11}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの厳しい質問", "ask": "（経営者）なんであなたがこれを勧めるの？あなたの儲けになるの？", "opts": [{"x": "私の利益にもなります。導入支援で報酬をいただきます", "r": "ok"}, {"x": "御社のためです。私の利益は関係ありません", "r": "timid", "m": [["私の利益は関係ありません", "事実と違う。利益になることは先に開く"]]}, {"x": "他社さんはもっと高い手数料を取っています", "r": "wrong", "m": [["他社さんはもっと高い", "聞かれたのは自分の利益。答えになっていない"]]}], "ex": "利益になることを隠して「御社のためです」とだけ言う方が、かえって信用を落とします。<br><br><strong>「中立」と名乗らない。</strong>中立を名乗ると立場が見えません。金融アドバイザーは助言者です。全部開示したうえで、立場を持ちます。<br><br>「他社さんはもっと高い」と<strong>他社を引き合いに出す言い方も避けます</strong>。根拠を示せないうえに、聞いた経営者には値段の話にしか聞こえません。<br><br>費用と限界と、断る条件を先に言い、魅力は最後に言う。断る条件を先に言える人だけが、勧めたときに信じてもらえます。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp", "no": 12}, {"t": "sjt", "dom": "税社保", "scene": "これから出産予定の従業員", "ask": "（従業員）来年、子どもが生まれます。選択制DCを始めた方がいいですか？", "opts": [{"x": "税と社会保険が軽くなるので、始めた方がいいですよ", "r": "ng", "m": [["軽くなるので、始めた方がいい", "休業開始時賃金日額が下がると育児休業給付も下がる"]]}, {"x": "育児休業給付が減る可能性があります", "r": "ok"}, {"x": "育休中は掛金が止まるので問題ありません", "r": "wrong", "m": [["問題ありません", "給付額は休業開始前6か月の賃金で決まる"]]}], "ex": "育児休業給付は「休業開始時賃金日額」がもと（雇用保険法61条の7第6項）。休業開始前6か月の賃金から算定します。<strong>標準報酬月額ではありません。</strong><br><br>選択制DCで給与を減額すると、その6か月に減額後の賃金が入り、休業開始時賃金日額が下がって育児休業給付も減る可能性があります。<br><br>これから出産する方に選択制DCを勧めるのは、最も避けたい場面のひとつ。<br><br>参考：給付率は180日目まで67%、181日目以降50%。出生後休業支援給付（13%・28日上限）と合わせて80%になる場合がある。", "src": "雇用保険法61条の7第6項（休業開始時賃金日額）・61条の10（出生後休業支援給付金）【一次】", "st": "law", "cl": "育休給付", "key": "賃金日額", "no": 13}, {"t": "ox", "dom": "給付", "line": "傷病手当金は標準報酬月額をもとに計算され、休んだ4日目から、通算1年6か月まで支給される。", "ans": "○", "ex": "支給を始める日の属する月以前の直近12か月の標準報酬月額の平均÷30×2/3（健康保険法99条2項）。待期3日で4日目から。通算1年6か月（2022年1月から通算化）。<br><br>★ 選択制DCで給与を減らすと、標準報酬月額の等級が下がった場合にかぎり、この平均も下がる。つまり<strong>傷病手当金は減る</strong>。等級が動かなければ変わらない。<br><br>⚠️ 12か月の平均なので、<strong>減り方は時間差で来る</strong>。始めた直後は減額前の高い月が平均に残っているので影響が小さく、1年たつと減額後の月だけになって下がり切る。<br><br>⚠️ 言い方に注意。「1年たつと満額で効いてきます」のような言い方をしない。得な話に聞こえる。<br><br>「等級が下がると傷病手当金も下がります。ただ12か月の平均なので、下がり切るのは1年後です」と、減ることをそのまま言う。", "src": "健康保険法99条2項（直近12か月の標準報酬月額の平均÷30×2/3）・同1項（待期3日）【一次】", "st": "law", "m": [["休んだ4日目から、通算1年6か月", "待期3日・通算1年6か月。ここが数字の決め手"]], "no": 14}, {"t": "sjt", "dom": "給付", "scene": "従業員からの質問", "ask": "（従業員）厚生年金が減るのは分かりました。遺族年金は関係ないですよね？", "opts": [{"x": "遺族年金は別なので影響ありません。そこはご安心ください", "r": "ng", "m": [["影響ありません", "遺族厚生年金は報酬比例。減る"]]}, {"x": "遺族厚生年金も減ります。遺族基礎年金は変わりません", "r": "ok"}, {"x": "遺族基礎年金も遺族厚生年金も減ります", "r": "wrong", "m": [["遺族基礎年金も", "遺族基礎年金は定額。減らない"]]}], "ex": "遺族厚生年金＝報酬比例部分の<strong>4分の3</strong>。標準報酬が下がれば減る。障害厚生年金も同じ構造。定額の遺族基礎年金は影響なし。<br><br>⚠️ 受給権者が<strong>老齢厚生年金の受給権を持つ配偶者</strong>の場合は別計算（「4分の3」と「4分の3×2/3＋自分の老齢厚生年金×1/2」の多い方）。一律4分の3で説明すると実額が合わない。", "src": "厚生年金保険法60条1項1号・2号【一次】", "st": "law", "no": 15}, {"t": "ox", "dom": "給付", "line": "2028年4月からの改正で、遺族厚生年金は全員が5年で打ち切りになる。", "ans": "×", "ex": "<strong>「全員が5年で打ち切り」は誤り</strong>。<br><br>令和7年法律第74号（2025年6月20日公布・<strong>施行2028年4月</strong>）で男女差が解消され、60歳未満で死別した場合が原則5年の有期給付になる。ただし——<br>・60歳以上で死別した方は無期給付のまま<br>・こどもを養育している間は現行どおり<br>・すでに受給している方は変わらない<br>・2028年度に40歳以上になる女性は変わらない<br><br>つまり<strong>原則は5年で終わる</strong>。<br><br>そのうえで、5年経過後は所得に応じて逓減する構造があり、障害年金の受給権者や低所得の場合に限って継続する。", "src": "令和7年法律第74号／厚生労働省「年金制度改正の全体像」【一次】", "st": "law", "m": [["全員が5年で打ち切り", "男女差の解消が本体。配慮措置と経過措置があり全員ではない"]], "no": 16}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの質問", "ask": "（経営者）そんなにいい制度なら、なんでメインバンクは何も言ってこないの？", "opts": [{"x": "銀行は自社の商品しか売らないからです。そういうものなんです", "r": "ng", "m": [["自社の商品しか売らない", "事実として不正確。他社商品も扱う"]]}, {"x": "儲からないからです。銀行の儲けの仕組みに合いません", "r": "ok"}, {"x": "銀行の担当者がこの制度を知らないからです", "r": "wrong", "m": [["知らないからです", "相手を下げる説明。理由にもなっていない"]]}], "ex": "iDeCo+は従業員個人のiDeCoへの上乗せで、金融機関が会社と契約するわけではありません。手続きの窓口も国民年金基金連合会です。<strong>制度の建て付けから説明する</strong>のが正解。<br><br>「自社の商品しか売らない」「担当者が知らない」は、<strong>他社の内情を決めつけています</strong>。悪口として言うと、経営者は「この人は他社の悪口を言う人だ」と受け取ります。<br><br>「儲からない」は構造の説明なので、誰も貶めずに答えになります。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp", "no": 17}, {"t": "sjt", "dom": "ガバ", "scene": "経営者からの質問", "ask": "（経営者）その資格、本当に持ってるかどうか、こっちは確かめようがないよね？", "opts": [{"x": "公開されている情報です。その場で調べていただいて構いません", "r": "ok"}, {"x": "そう言われましても、こればかりは信用していただくしかありません", "r": "timid", "m": [["信用していただくしかありません", "全部公開されている。その場で調べてもらえばよい"]]}, {"x": "そう疑われるなら、他をあたっていただいて構いません。無理にとは申しません", "r": "wrong", "m": [["他をあたっていただいて", "当然の確認。突き放す場面ではない"]]}], "ex": "この質問に即答できるかどうかで、信用が決まります。<br><br>金融商品仲介業者の登録は金融庁のサイトで確認できます。CFPは日本FP協会の認定者検索で確認できますが、<strong>掲載は本人が登録申請した場合に限られます</strong>。所属する金融商品取引業者は、名刺・書面への記載義務があります。<br><br>「調べてください」と自分から言える人はほとんどいません。言えること自体が差別化になります。<br><br>これは他社批判ではなく、<strong>判断の物差しを渡す形</strong>。同じ物差しが自分にも当たるので、フェアに聞こえます。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp", "no": 18}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）途中で必要になったら、引き出せますか？", "opts": [{"x": "生活が苦しいという理由では引き出せません。受け取りは原則60歳からです", "r": "ok"}, {"x": "引き出しの条件は確認が必要です。調べてご連絡します", "r": "timid", "m": [["確認が必要です", "制度の根幹。ここは言い切る"]]}, {"x": "途中でやめれば、脱退一時金で戻ってきます", "r": "ng", "m": [["脱退一時金で戻ってきます", "脱退一時金の要件はごく限られる。ほとんどの人は当てはまらない"]]}], "ex": "<strong>最初に、はっきり言う。</strong>後回しにすると「聞いてない」になり、会社への不満として、紹介したアドバイザーに戻ってくる。<br><br>老後資金の制度なので、生活上必要になったという理由では原則として中途解約・払戻しはできない。老齢給付金は原則60歳から。<br><br>⚠️ 例外はある。障害給付金、死亡一時金、そして要件をすべて満たす場合の脱退一時金。ただし脱退一時金の要件はごく限られる。<strong>2024年度に受け付けられたのは835件</strong>（同じ年の老齢給付金は42,338件）。「戻ってくる」と期待させる言い方はしない。<br><br>説明会では最初の方に置くべき項目。", "src": "確定拠出年金法33条・37条・40条（法73条による準用）／同法附則3条1項（脱退一時金）／iDeCo公式サイト「給付について」（2026年8月13日取得）／運営管理機関連絡協議会「確定拠出年金統計資料（2025年3月末）」個人型 裁定請求受付人数【一次】", "st": "law", "no": 19}, {"t": "sjt", "dom": "運用", "scene": "従業員からの質問", "ask": "（従業員）30年やったら、いくらになりますか？", "opts": [{"x": "過去の実績なら年5%は堅いので、30年で約2,500万円になります", "r": "ng", "m": [["年5%は堅い", "断定的判断の提供（金商法38条2号）"]]}, {"x": "お約束はできません。3%・5%・0%の3通りで見てみましょう", "r": "ok"}, {"x": "過去の実績から見て5%は堅い数字です。まず下回りません", "r": "wrong", "m": [["堅い数字です", "「堅い」は断定。同じく禁止"]]}], "ex": "<strong>「数字を出すな」ではありません。</strong>前提（利回り・期間・手数料）を明示し、下振れを含む複数のケースで示す。その数字の根拠を言えることが条件です。<br><br>「年5%は堅い」も「5%は堅い数字です」も、<strong>断定的判断の提供</strong>にあたります（金融商品取引法38条2号）。<br><br>幅で出せば何でもよい、という話でもありません。", "src": "金融商品取引法38条2号（断定的判断の提供の禁止／仲介業者には66条の14第1号ロで適用）／金融サービス提供法5条・6条【一次】", "st": "law", "no": 20}, {"t": "sjt", "dom": "比較", "scene": "25歳の従業員から", "ask": "（従業員）iDeCoって早く始めた方が得ですよね？枠いっぱいやった方がいいですか？", "opts": [{"x": "若いほど複利が効くので、枠いっぱいやった方がいいです", "r": "ng", "m": [["枠いっぱいやった方がいい", "60歳まで出せない。若い人ほどNISAが先"]]}, {"x": "まずNISAの使い方から考えることが多いです", "r": "ok"}, {"x": "若いうちは何もしなくていいです", "r": "wrong", "m": [["何もしなくていい", "今度は逆に振れすぎ。何もしない選択でもない"]]}], "ex": "iDeCoは60歳まで出せないので、40代以降にキャッチアップする形が合う場合がある。<br><br>「若いから枠いっぱいiDeCo」は多くの場合うまくいかない。若い人は課税所得が低く所得控除が効きにくいうえ、住宅・教育で資金が要る時期に60歳まで出せないお金を積み上げることになる。<br><br>⚠️ ただし課税所得が高く、当面の資 , "ex": "iDeCoで払うお金は、性質の違う2つに分かれる。<br><br>① <strong>口座にかかる手数料</strong>＝加入するとき、および毎月かかる。定額なので、残高がいくらになっても金額は変わらない。金融機関によって違う。<br><br>② <strong>信託報酬</strong>＝選んだ運用商品にかかる費用。残高に比例して毎日引かれる。同じ金融機関の中でも、選ぶ商品で何倍も違う。<br><br>積み立て始めは①が大きく、残高が育つと②が逆転する。20年30年持つ制度なので、①だけで選ぶと後で効いてくるのは②の方。<br><br>国民年金基金連合会も「金融機関ごとに、その特徴、<strong>取り扱う運用商品</strong>、加入時や毎月の口座管理等にかかる手数料などが異なりますので、よく比較しましょう」として、商品と手数料の両方を挙げている。<br><br>⚠️ iDeCo+では、会社が金融機関を選ばない。選ぶのは本人（確定拠出年金法65条）。会社が「ここにしてください」と言う立場にない。", "src": "国民年金基金連合会 iDeCo公式サイト「運営管理機関一覧」／確定拠出年金法65条【一次】", "st": "law", "no": 89}, {"t": "sjt", "dom": "教育", "scene": "経営者からの質問", "ask": "（経営者）投資教育って、費用はどっち持ちにするの？", "opts": [{"x": "会社負担をお勧めします。掛金を出す以上、教育まで含めて投資です", "r": "ok"}, {"x": "受けたい方のご負担が原則です。必要な方だけ受ければ十分です", "r": "ng", "m": [["受けたい方のご負担が原則", "費用を取ると、一番受けるべき人ほど受けない"]]}, {"x": "法律上の義務がありませんので、やらなくて結構です", "r": "wrong", "m": [["やらなくて結構です", "義務がないことと、やらなくてよいことは別"]]}], "ex": "投資教育は事業主が負担して行う。これが当社の立場。<br><br>iDeCo+に投資教育の法令上の義務はない。だが「義務がない」と「やらなくてよい」は別。<br><br>会社が掛金を出しているのに、従業員が商品を選べず元本確保型に置いたままなら、<strong>会社が出したお金が働かない。</strong><br><br>費用を従業員から取ると、一番受けるべき人ほど受けない。分からない人・不安な人から順に来なくなる。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp", "no": 90}, {"t": "sjt", "dom": "教育", "scene": "経営者からの質問", "ask": "（経営者）個別相談は、受けたい人が自分で払えばいいよね？", "opts": [{"x": "御社のお考え次第です。初回無料にする会社もあります", "r": "ok"}, {"x": "はい、受けたい方の自己負担で結構です。会社が持つ必要はありません", "r": "ng", "m": [["自己負担で結構です", "初回まで有料だと、一番相談すべき人が来ない"]]}, {"x": "個別相談も全額を会社でご負担ください", "r": "wrong", "m": [["全額を会社でご負担ください", "回数が読めない。そこまで決めるのは会社の判断"]]}], "ex": "<strong>負担するかどうかは、事業主の考えによる。</strong>集合研修と違い、個別相談は人によって必要な回数が違う。全部を会社持ちにすると費用が読めなくなるので、そこは会社が決めてよい。<br><br>ただし初回は、従業員の負担をなくせるようにするのがベター。<br><br>有料にすると、<strong>一番相談すべき人が来ない。</strong>よく分からない人、不安な人ほど「お金を払ってまでは」となる。来ないまま放置されると、掛金が動かないまま何年も過ぎる。<br><br>2回目以降をどうするかは、会社ごとに決めればよい。", "src": "制作者（株式会社LSFP）の考え方", "st": "lsfp", "no": 91}, {"t": "ox", "dom": "出口", "line": "iDeCoを年金で受け取るとき、何年かけて受け取るかは金融機関が自由に決めてよい。", "ans": "×", "ex": "法令で枠が決まっている。「支給予定期間は…5年以上20年以下であること」（確定拠出年金法施行規則4条1号ニ。個人型へは33条で準 : "いつでも、1回の手続きで一時金に切り替えられます", "r": "wrong", "m": [["いつでも、1回の手続きで", "5年経過と規約の定めの両方が要る"]]}], "ex": "「給付の支給を開始した日の属する月から起算して<strong>5年を経過した日以後</strong>の日に給付の支給を一時に受けることを申し出ることができる旨を…規約で定めた場合において、受給権者が当該申出をしたときは」残額を一時金で受け取れる（施行規則4条1号ホ）。<br><br>条件は2つ。5年経っていること。規約に定めがあること。どちらも欠けるとできない。<br><br>なお、資産が減って予定期間にわたって受け取れなくなった場合の申出も別に定めがある（同ヘ）。", "src": "確定拠出年金法施行規則4条1号ホ・ヘ・33条【一次】", "st": "law", "no": 95}, {"t": "sjt", "dom": "税社保", "scene": "従業員からの質問", "ask": "（従業員）一時金と年金で、社会保険料は変わりますか？", "opts": [{"x": "国民健康保険なら影響します。対象は年金で受け取る分です", "r": "ok"}, {"x": "受け取り方では社会保険料は変わりません。気にしなくて大丈夫です", "r": "ng", "m": [["受け取り方では社会保険料は変わりません", "国保なら変わる。一時金は翌年の算定に入らず、年金で受け取る分は入る"]]}, {"x": "どちらも保険料が上がるので、覚悟しておいてください", "r": "wrong", "m": [["どちらも保険料が上がる", "一時金は翌年の算定に乗らない"]]}], "ex": "一時金（退職所得）は、翌年の保険料の計算に乗らない。退職手当等に係る所得割は「当該退職手当等に係る所得を他の所得と区分し」その年に課税される（地方税法328条）。翌年度の住民税の課税所得に載らない。<br><br>なお控除や上限の関係で、実際の保険料が変わらないこともある。国民健康保険料の所得割は、<strong>前年の「基礎控除後の総所得金額等」</strong>で算定される（国民健康保険法施行令29条の7第2項4号）。だから一時金はここに乗らない。<br><br><strong>年金で受け取ると公的年金等の雑所得</strong>（所得税法35条3項3号）なので、翌年の算定に乗る。<br><br>⚠️ <strong>効くのは国保・後期に移ったあと。</strong>まだ会社員で健康保険・厚生年金なら標準報酬月額で決まるので、この話は当てはまらない。誰の、いつの話かを先に確認する。", "src": "地方税法328条／国民健康保険法施行令29条の7第2項4号／所得税法35条3項3号（同施行令82条の2第2項）【一次】", "st": "law", "no": 96}, {"t": "sjt", "dom": "出口", "scene": "従業員からの質問", "ask": "（従業員）会社の退職金と中退共とiDeCo、全部あります。まとめてもらった方がいいですか？", "opts": [{"x": "受け取る年をずらすと税額が変わります", "r": "ok"}, {"x": "同じ年にまとめた方が手続きも楽で、税金も有利になります", "r": "ng", "m": [["税金も有利になります", "合算されて控除は1回分。有利とは限らない"]]}, {"x": "年を分けた方が控除を2回使えるので必ず得です", "r": "wrong", "m": [["必ず得です", "重複排除で控除が削られる。必ずではない"]]}], "ex": "3つとも退職所得。同じ年に受け取れば合算して、退職所得控除は1回分しか使えない。控除は勤続20年まで年40万円、20年超は年70万円（所得税法30条3項）。<br><br>年をずらせば控除を分けて使える場合があるが、<strong>重複排除のルールがある。</strong>前に受け取った退職金の勤続期間と重なる分は、控除から差し引かれる（所得税法施行令70条1項2号）。DCが絡むと見る期間が長くなる。<br><br>だから「まとめる方が有利」も「分ける方が有利」も、答えは金額と勤続年数で逆転する。その場で言い切らない。", "src": "所得税法30条3項・31条3号（退職手当等とみなす一時金）／所得税法施行令72条3項7号（確定拠出年金の一時金）・同項2号（中小企業退職金共済）・70条1項2号【一次】", "st": "law", "no": 97}, {"t": "sjt", "d  [{"x": "その前に4つ伺わせてください。人によって、向く方と向かない方が分かれます", "r": "ok"}, {"x": "承知しました。税と社会保険料が軽くなる点を中心にご説明します", "r": "ng", "m": [["軽くなる点を中心に", "給付が減る可能性まで説明する必要がある。メリットだけは認められていない"]]}, {"x": "全員に一律でご加入いただく形にしましょう。手続きも一度で済みます", "r": "wrong", "m": [["全員に一律で", "選ぶかどうかは本人。一律加入は仕組みの形と違う"]]}], "ex": "<strong>先に聞く4つ。</strong><br>① 1〜2年以内に育休の予定は？　② 介護・離職の可能性は？　③ 掛金は給与のどこから出る？　④ 60歳まで使えなくてよいか？<br><br>YES／NOで終わらせず、<strong>時期と金額まで</strong>聞く。ここで分かれる人がいるまま説明会に入ると、一番影響を受ける人が一番前で聞くことになる。<br><br>⚠️ 厚労省は「保険料が軽減される可能性だけではなく、<strong>給付が減額する可能性があることを説明する必要がある</strong>」としている（確定拠出年金Q&amp;A No.70／平成13年8月21日 年発第213号）。メリットだけの説明は認められていない。", "src": "厚生労働省「確定拠出年金Q&amp;A（令和8年4月1日施行）」No.70／平成13年8月21日 年発第213号 第1・2(5)【一次】", "key": "賃金日額", "no": 121}, {"t": "ox", "dom": "税社保", "st": "law", "key": "賃金日額", "cl": "基本手当", "line": "失業給付（基本手当）は標準報酬月額をもとに計算されるので、選択制DCで給与を減らしても日額は変わらない。", "ans": "×", "ex": "<strong>ものさしが違います。</strong>基本手当のもとになる賃金日額は、離職前6か月に支払われた賃金の総額÷180（雇用保険法17条1項）。標準報酬月額ではありません。<br><br>だから等級が動かなくても、給与を減らせば日額は下がります。<br><br>★ 育休・介護と違うのは、<strong>選んで起きるとは限らない</strong>こと。会社都合の離職でも計算は同じです。「辞める予定はない」は、備えなくてよい理由になりません。<br><br>⚠️ ただし賃金日額には下限と、年齢ごとの上限があります（同法17条4項・18条でスライド）。上限に当たっている人は、賃金が少し下がっても変わりません。「必ず下がる」とは言わない。<br><br>⚠️ ここも厚労省が説明義務の対象として名指ししています（確定拠出年金Q&amp;A No.70）。", "src": "雇用保険法17条1項（賃金日額）・17条4項（下限・年齢別上限）・18条（自動的変更）／厚生労働省「確定拠出年金Q&amp;A（令和8年4月1日施行）」No.70【一次】", "m": [["標準報酬月額をもとに計算されるので", "基本手当の賃金日額は、離職前6か月の賃金÷180。等級ではない"]], "no": 122}, {"t": "sjt", "dom": "税社保", "st": "lsfp", "key": "賃金日額", "cl": "なぜ今か", "scene": "経営者からの質問", "ask": "（経営者）うちは男性で育休を取る人なんていないよ。心配しすぎじゃない？", "opts": [{"x": "2025年度に男性の取得率は5割を超えました。御社でもこれから起こると思って設計しておきませんか", "r": "ok"}, {"x": "おっしゃるとおりですね。では影響の説明は省いて進めましょう", "r": "ng", "m": [["説明は省いて", "給付が減る可能性の説明は、省いてよいものではない"]]}, {"x": "男性の育休は今後も増えませんので、そこは気にせず進めましょう", "r": "wrong", "m": [["今後も増えません", "2025年度50.9%。前年から10.4ポイント増えている"]]}], "ex": "<strong>いま起きていることの話をする。</strong><br><br>厚労省の雇用均等基本調査で、2025年度の男性の育休取得率は50.9%（前年から10.4ポイント増）。政府目標の5割を達成した。<br><br>★ ここが一番大事なところ。東京都の調査で、男性が育休を取る 第2項・3項【一次】", "m": [["役員であることを理由に会社が選べる", "拠出対象者の限定は、一定の職種か一定の勤続期間だけ"]], "no": 127}];
const N_SJT=8, N_OX=4;
// 誤答した設問を、日を空けて優先的に出し直す（Leitner）。
// 間違えたものは次のセッションで即戻す（Anki と同じ）。以後 3→7→14→30日と伸ばす
// （Cepeda 2008「最適間隔＝保持期間の10〜20%」に寄せた）。
const STEP=[0,3,7,14,30], KEY='idecoplus_genba_v2';
const qid=q=>(q.ask||q.line||'')+'#'+(q.opts?q.opts.map(o=>o.x).sort().join('|').slice(0,60):'');
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(m){ try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){} }
const today=()=>Math.floor(Date.now()/86400000);
function grade(q,ok,spoke){
  const m=load(), id=qid(q), r=m[id]||{box:0};
  // 選択肢からは選べても、口が動かなかった場面は「できた」ではない。次回もう一度出す
  r.box = (ok && spoke!==false) ? Math.min(r.box+1, STEP.length-1) : 0;
  r.due = today() + STEP[r.box];
  r.miss = (r.miss||0) + (ok?0:1);
  m[id]=r; save(m);
}
function priority(q){                       // 小さいほど先に出す
  const r=load()[qid(q)];
  if(!r) return 1;                          // 未出題
  if(r.due<=today()) return 0 - (r.miss||0);// 期限到来。間違えた回数が多いほど先
  return 2;                                 // まだ寝かせる
}
let Q=[], i=0, log=[], screen='home', RETRY=0, said=null;
const $=id=>document.getElementById(id);
function sh(a){for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];}return a;}

function build(){
  const M=load();
  const byPri=a=>sh(a).sort((x,y)=>priority(x)-priority(y));
  // まだ一度も出していない設問の席を確保する。
  // これが無いと、間違え続けた人は同じ設問だけが毎回先頭に来て、残りに一生出会えない。
  // 1回の出題で同じ領域が偏らないよう上限を設ける。
  // 12問中7問以上が同じ領域になると、どう並べても隣り合ってしまうため（上限4問）。
  const CAP=4, used={}, usedCl={}, TAKEN=new Set();
  const LAST=(()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY+'_last')||'[]'))}catch(e){return new Set()}})();
  const take=(a,n,quota)=>{
    const out=[];
    const pull=(src,limit,respectCap,ignoreCl)=>{
      for(const q of src){
        if(out.length>=limit) break;
        if(TAKEN.has(q)) continue;
        if(respectCap && (used[q.dom]||0)>=CAP) continue;
        // 論点が近い設問（cl が同じ）は、同じ回に2問出さない。
        // ただし未出題の席（ignoreCl）だけは例外。ここを閉めると、
        // 間違え続けた人に対して cl の枠を毎回先に取られ、
        // 同じ cl を持つ未出題の設問が永久に出なくなる（実測：300回でも未到達）。
        if(respectCap && !ignoreCl && q.cl && (usedCl[q.cl]||0)>=1) continue;
        used[q.dom]=(used[q.dom]||0)+1; if(q.cl) usedCl[q.cl]=(usedCl[q.cl]||0)+1;
        TAKEN.add(q); out.push(q);
      }
    };
    // 前回出した設問は後回しにする（続けて回したときに同じ問ばかり出ないように）
    const notLast=x=>!LAST.has(qid(x));
    const fresh=a.filter(q=>!M[qid(q)]), old=a.filter(q=>M[qid(q)]);
    pull(fresh.filter(notLast), Math.min(quota,n), true);
    pull(fresh.filter(notLast), Math.min(quota,n), true, true);  // 未出題の席は cl で潰さない
    pull(old.filter(notLast),   n,                 true);
    pull(fresh.filter(notLast), n,                 true);
    pull(a.filter(notLast),     n,                 false);
    pull(a,                     n,                 false);  // それでも足りなければ前回分も使う
    return out;
  };
  // 初回面談の背骨（できるのか・税と社保）は、毎回1問ずつ必ず出す
  // 加藤 博の指示（2026-08-13）＝育児休業・介護休業・失業給付は毎回必ず出す。
  // 「これは僕が作った問題集だから、僕のメッセージなんですよ」。
  // 賃金日額がもとになる給付（＝等級が動かなくても減るもの）に key:'賃金日額' を付け、席を1つ固定で確保する。
  const core=take(byPri(BANK.filter(q=>q.dom==='可否')),1,1)
       .concat(take(byPri(BANK.filter(q=>q.dom==='税社保')),1,1))
       .concat(take(byPri(BANK.filter(q=>q.key==='賃金日額')),1,1));
  const cS=core.filter(q=>q.t==='sjt').length, nS=Math.max(0,N_SJT-cS), nO=Math.max(0,N_OX-(core.length-cS));
  const sjt=byPri(BANK.filter(q=>q.t==='sjt'));
  const hasTimid=sjt.filter(q=>q.opts.some(o=>o.r==='timid'));
  const rest=sjt.filter(q=>!q.opts.some(o=>o.r==='timid'));
  const nT=Math.min(3,nS);
  const pickS=core.filter(q=>q.t==='sjt')
       .concat(take(hasTimid,nT,1)).concat(take(rest,nS-nT,2));
  const kotoba=take(byPri(BANK.filter(q=>q.dom==='言葉')),1,1);
  const pickO=core.filter(q=>q.t!=='sjt').concat(kotoba)
       .concat(take(byPri(BANK.filter(q=>q.t==='ox'&&q.dom!=='言葉')),Math.max(0,nO-kotoba.length),1));
  RETRY = pickS.concat(pickO).filter(q=>{const r=load()[qid(q)]; return r&&r.miss>0;}).length;
  // 同じ領域が続かないように並べる。
  // 残っている数が最も多い領域から、直前と違うものを取る（避けられる限り必ず避けられる）。
  const pool=sh(pickS.concat(pickO)), out=[];
  while(pool.length){
    const cnt={}; pool.forEach(q=>cnt[q.dom]=(cnt[q.dom]||0)+1);
    const prev=out.length?out[out.length-1].dom:null;
    let best=-1, bestC=-1;
    pool.forEach((q,k)=>{ if(q.dom===prev) return; if(cnt[q.dom]>bestC){ bestC=cnt[q.dom]; best=k; } });
    if(best<0) best=0;   // 残り全部が直前と同じ領域＝これ以上は避けられない
    out.push(pool.splice(best,1)[0]);
  }
  Q=out.map(q=>Object.assign({},q,{opts:q.opts?sh(q.opts.slice()):null}));
  try{localStorage.setItem(KEY+'_last',JSON.stringify(out.map(qid)))}catch(e){}
}

  build(); $('prog').textContent=''; const n=$('next'); n.textContent='はじめる'; n.disabled=false;
  n.onclick=()=>{screen='quiz';i=0;log=[];render()};
// 更新のお知らせ。マニュアルの「更新履歴」の一番上と必ず揃える（tools/verify_update_log.py が機械で照合する）。
const UPDATED='2026年8月14日', UPDATED_WHAT='4問追加（No.124〜127）。言い方を全体で見直しました。';
  $('app').innerHTML=`<div class="card"><p class="lead">金融アドバイザー向け</p>
   <h2>経営者と従業員からの質問に、<br>あなたなら、どう答えますか。</h2>
   <p>面談で聞かれることを <strong>${Q.length}問</strong>。<strong>7〜10分</strong>です。</p>
   <ul>
     <li><strong>選択肢は、先に出しません。</strong>面談に選択肢は出てこないからです。まず声に出して答えてから、選択肢と解説が出ます。</li>
     <li>点数も、合否も出しません。</li>
     <li>最後にお返しするのは「<strong>言葉が出てこなかった場面</strong>」と、その<strong>言い方</strong>です。</li>
     <li>すべて<strong>2026年12月1日施行の改正後</strong>のルールです。</li>
   </ul>
   <div class="hint" style="background:var(--ok-bg);color:var(--ok)">点数も合否も出しません。記録は、お使いの端末の中だけに残ります。</div>
   ${RETRY?'<div class="hint">前回まちがえた '+RETRY+'問 が、今回もう一度出ます。</div>':''}
   <div class="hint"><strong>持ち帰ってよい場面もあります。</strong>ただし調べれば分かることは、その場で答えられた方が話が早く進みます。その区別も設問に入れています。</div>
   <div class="hint"><strong>更新のお知らせ</strong>（${UPDATED}）　${UPDATED_WHAT}<br><a href="./manual.html#updates" style="color:var(--green-l);font-weight:600">これまでの更新履歴を見る →</a></div>
   <p style="margin:16px 0 0"><a href="./manual.html" style="color:var(--green-l);font-weight:600">使い方を見る（1分）→</a></p>
  </div>
  <div class="card"><p class="note">記録は端末の中だけです。どこにも送信しません。認定でも資格でもありません。</p>
   <p class="note" style="margin-top:12px">制作・監修　株式会社LSFP　加藤 博<br>
   <span style="font-size:13px">企業年金管理士（確定拠出年金）／1級DCプランナー／CFP<sup>&reg;</sup>／1級ファイナンシャル・プランニング技能士</span></p>
   <p class="note" style="margin-top:10px">&copy; 株式会社LSFP　無断での複製・転載・再配布・改変・二次利用を禁じます。<br>
   <a href="./manual.html#terms" style="color:var(--green-l);font-weight:600">取り扱いと免責について →</a></p></div>`;
}

function question(){
  const q=Q[i]; $('prog').textContent=(i+1)+' / '+Q.length;
  let h='<div class="card">';
  const numTag='<span class="qno">No.'+q.no+'</span>';
  if(q.t==='ox'){ h+='<p class="scene">'+numTag+'<span class="tag">○×</span></p><div class="said">'+q.line+'</div><p class="ask">正しいですか。</p>'; }
  else { h+='<p class="scene">'+numTag+(q.scene||'')+'</p>';
         if(q.ask) h+='<div class="said">'+q.ask+'</div>';
         h+='<p class="ask">あなたなら、どう'+(q.ask?'答え':'説明し')+'ますか。</p>'; }
  h+='<div id="s0"></div><div id="s1"></div><div id="fb"></div></div>';
  $('app').innerHTML=h;
  const list = q.t==='ox' ? [{x:'正しい',r:q.ans==='○'?'ok':'ng2'},{x:'誤り',r:q.ans==='×'?'ok':'ng2'}]
                          : q.opts;
  // 面談に選択肢は出てこない。先に自分の言葉で答えてから、選択肢を見る。
  const s0=$('s0');
  // 1問目だけ丁寧に。2問目以降は同じ説明を繰り返さない（毎回出るとくどい）
  s0.innerHTML = i===0
    ? '<div class="say"><b>まず、声に出して答えてみてください。</b>'
      +(q.t==='ox'?'この説明が正しいかどうかと、その理由を。':'そのまま経営者に返す言葉で。')
      +'<br><span class="note">選択肢は、言ってみたあとに出ます。</span></div>'
    : '';
  const mk=(lbl,ok)=>{ const b=document.createElement('button'); b.className='opt sayb'; b.textContent=lbl;
    b.onclick=()=>{ said=ok; s0.querySelectorAll('.sayb').forEach(x=>{x.disabled=true}); b.classList.add(ok?'pick-ok':'pick-warn'); showOpts(); }; return b; };
  const row=document.createElement('div'); row.className='sayrow';
  row.appendChild(mk('言えた',true)); row.appendChild(mk('出てこなかった',false)); s0.appendChild(row);
  said=null;
  function showOpts(){ const s1=$('s1');
    s1.innerHTML='<p class="ask" style="margin-top:18px">では、次のうちどれに近いですか。</p>';
    list.forEach((o,k)=>{ const b=document.createElement('button'); b.className='opt';
      b.innerHTML='<span class="n">'+(k+1)+'</span><span>'+o.x+'</span>';
      b.onclick=()=>choose(k,list); s1.appendChild(b); });
    s1.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  const n=$('next'); n.disabled=true; n.textContent=(i===Q.length-1)?'結果を見る':'次へ';
  n.onclick=()=>{ i++; if(i>=Q.length) screen='result'; render(); window.scrollTo({top:0}); };
}

function cueHTML(txt,marks){ let h=txt;
  marks.forEach(([sub])=>{ const at=h.indexOf(sub); if(at<0)return;
    h=h.slice(0,at)+'<mark class="cue">'+sub+'</mark>'+h.slice(at+sub.length); });
  return '<div class="cuetext">'+h+'</div><ul class="cuelist">'
    + marks.map(([sub,why])=>'<li><b>「'+sub+'」</b>'+why+'</li>').join('') + '</ul>';
}
function choose(k,list){
  const q=Q[i], o=list[k];
  const cls = o.r==='ok' ? 'pick-ok' : (o.r==='timid' ? 'pick-warn' : 'pick-ng');
  document.querySelectorAll('#s1 .opt').forEach((b,j)=>{ b.disabled=true;
    if(j===k) b.classList.add(cls); else if(list[j].r==='ok') b.classList.add('show'); });
  const ok=list.find(x=>x.r==='ok');
  let v='', vc='';
  if(o.r==='ok'){ v='そのとおりです。'; vc='v-ok'; }
  else if(o.r==='timid'){ v='ここは、言い切って大丈夫です。'; vc='v-warn'; }
  else if(o.r==='ng'){ v='この言い方は避けます。'; vc='v-ng'; }
  else { v='ここは違います。'; vc='v-ng'; }
  let h='<div class="verdict '+vc+'">'+v+'</div>';
  if(o.r!=='ok' && q.t==='sjt'){
    h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+o.x+'</div>'
      +'<div class="b"><b>こう言えます</b>'+ok.x+'</div></div>';
  }
  // 違う語句を、その場で色を付けて示す（フィッシング訓練で効果差が最も大きかった要素）
  let cq=null, ct='', ttl='';
  if(q.t==='ox'){ if(q.m){ cq=q.m; ct=q.line; ttl=(q.ans==='×')?'違うのはここ':'決め手はここ'; } }
  else if(o.m){ cq=o.m; ct=o.x; ttl='違うのはここ'; }
  else { const bad=list.find(x=>x.m); if(bad){ cq=bad.m; ct=bad.x; ttl='よくある言い間違い'; } }
  if(cq) h+='<div class="cuebox"><b>'+ttl+'</b>'+cueHTML(ct,cq)+'</div>';
  h+='<div class="explain">'+q.ex+'<div class="src '+(q.st==='lsfp'?'lsfp':'law')+'">'
    +(q.st==='lsfp'?'これは制度の決まりではなく、<b>制作者（株式会社LSFP）の考え方</b>です'+(/条|取得|【一次】/.test(q.src)?'<br>参照：'+q.src.replace(/^制作者（株式会社LSFP）の考え方[（／]?/,'').replace(/）$/,''):''):'根拠：'+q.src)+'</div></div>';
  $('fb').innerHTML=h;
  grade(q, o.r==='ok', said);
  log.push({no:q.no, said:said, dom:q.dom, t:q.t, r:o.r, mine:o.x, ok:ok?ok.x:'', line:q.ask||q.line, ans:q.ans, why:(q.m&&q.m[0]?q.m[0][1]:'')});
  $('next').disabled=false;
  $('fb').scrollIntoView({behavior:'smooth',block:'start'});
}

function result(){
  $('prog').textContent='';
  const ng=log.filter(l=>l.r==='ng'), timid=log.filter(l=>l.r==='timid');
  const oxNg=log.filter(l=>l.t==='ox'&&l.r!=='ok'), wrong=log.filter(l=>l.r==='wrong');
  const fix=ng.concat(wrong);
  // 口が動かなかった場面を最優先で返す。選択肢から選べたかどうかより、こちらが本番に近い
  const mute=log.filter(l=>l.said===false&&l.t!=='ox'&&l.ok);
  let h='';
  if(mute.length){
    h+='<div class="card"><h2>明日の面談で、まずこの'+Math.min(mute.length,3)+'つ。</h2>'
      +'<p class="note" style="margin-top:-6px">言葉が出てこなかった場面です。声に出して1回ずつ読んでから閉じてください。</p>';
    mute.slice(0,3).forEach(m=>{ h+='<div class="todo"><span class="qno">No.'+m.no+'</span><b>'+m.line+'</b>'+m.ok+'</div>'; });
    if(mute.length>3) h+='<p class="note">残りの '+(mute.length-3)+' 場面は、この下にまとめています。</p>';
    h+='</div>';
  }
  h+='<div class="card">';
  h+= fix.length===0 && timid.length===0
    ? (mute.length?'<h2>選んだ言い方は、'+Q.length+'場面とも直すところはありませんでした。</h2>'
                 :'<h2>今回の'+Q.length+'場面では、直すところはありませんでした。</h2>')
    : '<h2>直せる言い回しが、'+(fix.length+timid.length)+'か所 見つかりました。</h2>';
  h+='</div>';
  fix.forEach(m=>{ h+='<div class="card"><p class="scene"><span class="qno">No.'+m.no+'</span></p><div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
    +'</div><div class="b"><b>こう言えます</b>'+m.ok+'</div></div></div>'; });
  if(timid.length){ h+='<div class="card"><h2 style="font-size:18px">ここは、言い切って大丈夫でした</h2>';
    timid.forEach(m=>{ h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
      +'</div><div class="b"><b>こうお伝えする</b>'+m.ok+'</div></div>'; });
    h+='<div class="warnbox">調べれば分かることは、その場で答えられた方が話が早く進みます。<b>言い方を選ぶことと、言い切ることは、別のことです。</b></div></div>'; }
  if(oxNg.length){ h+='<div class="card"><h2 style="font-size:18px">確認しておきたい事実</h2><ul>';
    oxNg.forEach(m=>{ h+='<li><span class="qno">No.'+m.no+'</span>「'+m.line+'」<br><b>→ '
      +(m.ans==='×'?'この説明は誤りです':'この説明で正しいです')+'。</b>'
      +(m.why?' '+m.why:'')+'</li>'; }); h+='</ul></div>'; }
  const says=log.filter(l=>l.t!=='ox'&&l.ok&&l.r!=='ok');
  if(says.length){
    h+='<div class="card"><h2 style="font-size:18px">最後にもう一度、正しい言い方</h2>'
      +'<p class="note" style="margin-top:-6px">最後に、これだけ読み直して終わってください。</p><ul>';
    says.forEach(m=>{ h+='<li>'+m.ok+'</li>'; });
    h+='</ul></div>';
  }
  h+='<div class="card"><p class="note">これは免許でも認定でもありません。制度は変わります。<br>'
   +'合計上限が改正後どうなるかは公表済みですが、合計の下限など、まだ明記のない論点は出題していません。<br>'
   +'個別の判断は、社労士・税理士・国民年金基金連合会へご確認ください。</p></div>';
  $('app').innerHTML=h;
  const n=$('next'); n.textContent='別の'+Q.length+'問をやる'; n.disabled=false;
  n.onclick=()=>{screen='home';render();window.scrollTo({top:0})};
  window.scrollTo({top:0});
}
render();
</script>
