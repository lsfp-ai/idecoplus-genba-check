<style>

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);

.prog{flex:1;font-size:14px;color:var(--sub)}
button.next{background:var(--green);color:#fff;border:0;border-radius:11px;padding:14px 26px;
font:inherit;font-size:17px;font-weight:700;cursor:pointer}

ul{padding-left:1.2em;margin:8px 0}li{margin-bottom:6px}

<script>
const BANK=[{"t":"ox","dom":"可否","line":"確定給付企業年金（DB）を実施している会社でも、iDeCo+を導入できる。","ans":"×","ex":"できない。iDeCo+の対象は<strong>企業型DC・確定給付企業年金（DB）・厚生年金基金のいずれも実施していない</strong>、第1号厚生年金被保険者300人以下の事業主。<br><br>ここは<strong>言い切ってよい</strong>。「確認します」と答えると、調べれば分かることを調べていない人に見える。","src":"確定拠出年金法55条2項4号の2（中小事業主の定義）【一次】","st":"law"},{"t":"sjt","dom":"税社保","scene":"経営者への提案","ask":null,"opts":[{"x":"DCを入れると、税金だけでなく社会保険料も安くなって一石二鳥です","r":"ng"},{"x":"標準報酬月額が動き得るのは選択制DCだけです","r":"ok"},{"x":"iDeCo+なら社会保険料が下がります","r":"wrong"}],"ex":"⚠️ <strong>「下がる」と言い切ってはいけない</strong>。選択制DCは標準報酬月額が<strong>動き得る</strong>だけで、等級をまたがなければ健康保険料・厚生年金保険料は1円も変わらない。<br><br>iDeCo+は会社が給与とは別に上乗せするので標準報酬月額が動かず、マッチング拠出も本人の給与から出すので動かない。<br><br>「DC」と一括りにした時点で誤りになる。<strong>給与そのものを減らすのは選択制DCだけ</strong>。iDeCo+は会社が給与とは別に上乗せするので標準報酬月額は動かず、マッチング拠出は本人の給与から拠出するのでこれも動かない。<br><br>しかも<strong>「社保が下がらない＝将来の給付も目減りしない」がiDeCo+の強み</strong>。これを言うと商品価値を自分で消したうえに、事実と違う説明になる。","src":"健康保険法3条5項／厚生年金保険法3条1項3号（報酬＝労働の対償）／社会保障審議会 企業年金・個人年金部会 第38回 資料1（2024年12月2日）22頁【一次】","st":"law"},{"t":"sjt","dom":"可否","scene":"経営者からの質問","ask":"（経営者）うち、従業員が1人しかいないんだけど、できる？","opts":[{"x":"従業員が1人でもできます","r":"ok"},{"x":"人数の要件は確認が必要なので、持ち帰らせてください","r":"timid"},{"x":"1人だと難しいですね。ある程度の人数が必要です","r":"ng"}],"ex":"300人以下は上限で、下限はない。<br><br>ここは言い切ってよい。<br><br>ただし<strong>「代表者お一人だけの会社で、その方ご自身に出す」は別問題</strong>。従業員が1人いるのと、代表者しかいないのを混同しないこと。","src":"確定拠出年金法55条2項4号の2【一次】","st":"law"},{"t":"ox","dom":"税社保","line":"iDeCo+・選択制DC・マッチング拠出のうち、従業員の標準報酬月額が下がり得るのは選択制DCだけである。","ans":"○","ex":"ここが3制度を分ける一番太い線。<br><br><strong>選択制DC</strong>＝給与そのものを振り替えるので標準報酬月額が動き得る。<strong>iDeCo+</strong>＝会社が給与とは別に上乗せ。<strong>マッチング拠出</strong>＝本人の給与から拠出するが給与額は変わらない。<br><br><strong>選択制DCは、社会保険の当局側にも根拠がある。</strong><br><br>① 厚労省「給与ではなく事業主掛金として拠出する場合、<strong>賃金に当たらないため、社会保険料等の算定対象とならない</strong>」（社会保障審議会 企業年金・個人年金部会 第38回 資料1・22頁）。理由は同19頁＝事業主が拠出すべきことが法令上定められているので、労働の対償として労働者に支払うものと同視できない。<br><br>② 日本年金機構の疑義照会（整理番号8）は、賃金を29,000円減らしてDC掛金と前払退職金に振り替えた事例で、「<strong>基本給に前払退職金を加えた給与額は、賃金規程改定前の基本給より減額となる</strong>」として随時改定を認めている。<strong>DC掛金を足し戻していない</strong>＝報酬に入れていない。<br><br>⚠️ <strong>ただし①②が対象にしているのは企業型DCで、iDeCo+ではない。</strong>iDeCo+の中小事業主掛金を名指しで「報酬に含まれない」とした当局資料は、探した範囲では見つかっていない（含めるとした資料も無い）。<br><br>⚠️ <strong>「連合会に納付されるから本人に渡っていない、だから報酬ではない」は理由にならない。</strong>社会保険には<strong>現物給与</strong>があり、現金で渡らないものも報酬になる。この理屈で押し切らないこと。<br><br><strong>税（所得税法施行令64条1項5号）の結論を、社会保険に持ち込んではいけない。</strong>別の法律。断定が必要な場面では、管轄の年金事務所に文書で照会すること。","src":"厚労省社会保障審議会 企業年金・個人年金部会 第38回 資料1（2024年12月2日）19頁・22頁／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8／厚労省「確定拠出年金Q&A」No.70【一次】　※企業型DCは明示あり・iDeCo+は当局明示なし","st":"law"},{"t":"ox","dom":"税社保","line":"iDeCo+の事業主掛金は国民年金基金連合会に直接納付され、本人に現金で渡らない。だから社会保険料の算定基礎に入らない――こう説明してよい。","ans":"×","ex":"<strong>結論はたぶん合っている。理由が間違っている。</strong><br><br>社会保険には<strong>現物給与</strong>がある。「報酬又は賞与の全部又は一部が、<strong>通貨以外のもので支払われる場合</strong>においては、その価額は、その地方の時価によって、厚生労働大臣が定める」（健康保険法46条）。社宅・食事・通勤定期は現金で渡らないが報酬になる。<br><br>つまり<strong>「現金で本人に渡らない＝報酬ではない」は成立しない。</strong>この理屈で押し切ると、詳しい人には一発で見抜かれる。<br><br>企業型DCについては当局側の根拠がある（審議会資料22頁「賃金に当たらないため、社会保険料等の算定対象とならない」／年金機構 疑義照会 整理番号8はDC掛金を報酬に足し戻していない）。理由は<strong>「事業主が拠出すべきことが法令上定められているので、労働の対償として支払うものと同視できない」</strong>であって、現金で渡るかどうかではない。<br><br>⚠️ そして<strong>iDeCo+を名指しした当局資料は、探した範囲では見つかっていない。</strong>断定が要る場面では、管轄の年金事務所へ文書で照会すること。","src":"健康保険法46条（現物給与の価額）／社会保障審議会 企業年金・個人年金部会 第38回 資料1 19頁・22頁／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8【一次】　※iDeCo+は当局明示なし","st":"law"},{"t":"sjt","dom":"可否","scene":"経営者からの質問","ask":"（経営者）私、一人法人の代表なんだけど、私も上乗せもらえるの？","opts":[{"x":"はい、代表者ご自身も対象になります","r":"ng"},{"x":"厚生年金の被保険者かどうかで変わります。確認してご回答します","r":"ok"},{"x":"対象外です。代表者ご自身は対象になりません","r":"wrong"}],"ex":"2と3の差が要点。<strong>2は「調べます」だけで、何が論点かを言えていない</strong>。経営者からは「分かっていない人」に見える。3は論点を示している。<br><br><strong>その場で言い切ってはいけない</strong>論点。個人事業主は自身が厚生年金被保険者でない場合があり、その場合は対象にならない。","src":"国民年金基金連合会コールセンターでの個別確認が必要な論点","st":"other"},{"t":"sjt","dom":"税社保","scene":"経営者への説明","ask":null,"opts":[{"x":"掛金の分は、どれも年末調整で所得控除できます。","r":"ng"},{"x":"所得控除になるのは、ご本人が出した分だけです","r":"ok"},{"x":"3つとも年末調整で所得控除します","r":"wrong"}],"ex":"iDeCo+の事業主掛金はそもそも本人の所得にならないので控除の対象外。選択制DCは給与自体が減るので年末調整に登場しない。<br><br><strong>「所得控除で減る」と「そもそも所得にならない」は別物</strong>。<br><br><strong>所得控除型</strong>（iDeCo+本人掛金・マッチング）＝所得税と住民税だけ減る。<strong>社会保険料は減らない</strong>。<br><strong>非所得型</strong>（iDeCo+事業主掛金）＝もともと本人の所得ではないので、控除する対象がない。<strong>年末調整に入れると過大控除</strong>。<br><strong>給与減少型</strong>（選択制DC）＝給与自体が減るので、年末調整に登場しない。","src":"所得税法施行令64条1項5号（事業主掛金は給与所得の収入金額に含まれない）／所得税法75条1項・2項2号・190条2号イ【一次】","st":"law"},{"t":"sjt","dom":"ガバ","scene":"経営者からの質問","ask":"（経営者）全員入らせたいんだけど、強制できる？","opts":[{"x":"できません。加入は本人の任意です","r":"ok"},{"x":"強制できるかどうかは、確認してからお答えします","r":"timid"},{"x":"就業規則に書けば、全員加入にできます","r":"ng"}],"ex":"ここは言い切ってよい。曖昧にすると経営者が「入りなさい」と言ってしまい、労務のトラブルになる。<br><br>そのうえで「<strong>入らない人には掛金が出ないので不公平感が出ます。説明会での周知が要ります</strong>」まで言えると親切。","src":"確定拠出年金法62条1項・3項（本人の申出により加入）／厚労省・国基連「iDeCo＋導入ガイド」p.3【一次】","st":"law"},{"t":"ox","dom":"掛金","line":"マッチング拠出は、従業員の給与を減らして掛金に振り替える仕組みである。","ans":"×","ex":"給与は減らない。<strong>本人が自分の給与から上乗せして拠出する</strong>ので、標準報酬月額は下がらない。給与を振り替えるのは選択制DC。<br><br>なお本人掛金は<strong>小規模企業共済等掛金控除</strong>の対象になる。","src":"確定拠出年金法19条3項・4項（加入者が自ら拠出・額を決定）／所得税法75条2項2号【一次】","st":"law"},{"t":"sjt","dom":"税社保","scene":"選択制DCの提案","ask":null,"opts":[{"x":"月2万円を掛金に回せば、その分だけ社会保険料が下がります。","r":"ng"},{"x":"等級が変わらなければ、社会保険料は変わりません","r":"ok"},{"x":"掛金の額に比例して下がります","r":"wrong"}],"ex":"社会保険料は標準報酬月額の等級制。給与が下がっても等級をまたがなければ1円も変わらない。等級が動くかを先に確認する。<br><br>社会保険料は<strong>等級制</strong>。給与が下がっても等級をまたがなければ<strong>1円も変わらない</strong>。「掛金の分だけ下がる」は比例計算の誤り。<br><br>3も誤り。下がる時期は項目ごとに違う（1等級なら定時決定で9月分から、2等級以上なら随時改定で4か月目から、住民税は翌年6月から）。","src":"健康保険法3条5項・厚生年金保険法3条1項3号（報酬の定義）／日本年金機構 疑義照会回答（厚生年金保険 適用）整理番号8【一次】","st":"law"},{"t":"sjt","dom":"ガバ","scene":"経営者への説明","ask":null,"opts":[{"x":"多くの会社がもう導入しています。","r":"ng"},{"x":"まだ1万事業所ほどで、ほとんど知られていません","r":"ok"},{"x":"大企業さんはもうほとんど導入済みで、中小もこれからです","r":"wrong"}],"ex":"企業年金のない中小企業は150万社以上。「まだ少ない」を先に認めた方が、そのあとの説明が通る。<br><br>経営者が調べれば分かる。<strong>「まだ少ない」を先に認めた方が、そのあとの説明が通る</strong>。<br><br>実数＝<strong>2026年6月末で10,243事業所・拠出対象者64,845人</strong>（対前年112.0%）。<br><br>⚠️ ただし「少ないから今やる価値がある」まで言うと、<strong>根拠のない優位性の示唆</strong>になる。事実を述べるところで止める。","src":"国民年金基金連合会「加入等の概況（令和8年6月）」掲載日2026/08/03【一次】","st":"law"},{"t":"sjt","dom":"ガバ","scene":"経営者からの厳しい質問","ask":"（経営者）なんであなたがこれを勧めるの？あなたの儲けになるの？","opts":[{"x":"私の利益にもなります。導入支援と投資教育で報酬をいただきます","r":"ok"},{"x":"御社のためです。私の利益は関係ありません","r":"timid"},{"x":"他社さんはもっと高い手数料を取っています","r":"wrong"}],"ex":"それを隠して「御社のためです」とだけ言う方が不誠実。<br><br><strong>「中立」と名乗るのが不正解</strong>。中立は無責任な傍観であり、金融アドバイザーは助言者。<strong>全部開いた上で立場を持つ</strong>。<br><br>1も不正解。<strong>他社を引き合いに自社を持ち上げる言い方</strong>は、根拠を示せないうえに、聞いた経営者には値段の話にしか聞こえない。<br><br>そして<strong>断る条件を先に言える人だけが、勧めたときに信じてもらえる</strong>（コスト先→限界先→撤退先→魅力後）。","src":"制作者（株式会社LSFP）の考え方","st":"lsfp"},{"t":"sjt","dom":"税社保","scene":"これから出産予定の従業員","ask":"（従業員）来年、子どもが生まれます。選択制DCを始めた方がいいですか？","opts":[{"x":"税と社会保険が軽くなるので、始めた方がいいですよ","r":"ng"},{"x":"育児休業給付が減る可能性があります。出産の予定を踏まえて決めましょう","r":"ok"},{"x":"育休中は掛金が止まるので問題ありません","r":"wrong"}],"ex":"育児休業給付は休業開始時賃金日額がもと。これから出産する方に選択制DCを勧めるのは、最も避けたい場面のひとつ。<br><br>育児休業給付は<strong>休業開始時賃金日額</strong>がもと。<strong>これから出産する人に選択制DCを勧めるのは、最も避けたい場面のひとつ</strong>。<br><br>参考：給付率は180日目まで67%、181日目以降50%。出生後休業支援給付（13%・28日上限）と合わせて80%になる場合がある。","src":"雇用保険法61条の7第6項・61条の10【一次】","st":"law"},{"t":"ox","dom":"給付","line":"傷病手当金は標準報酬月額をもとに計算され、休んだ4日目から、通算1年6か月まで支給される。","ans":"○","ex":"支給開始日の属する月以前の<strong>直近12か月の標準報酬月額の平均÷30×2/3</strong>。待期3日で4日目から。通算1年6か月（2022年1月から通算化）。<br><br><strong>12か月の平均</strong>なので、選択制DCを始めた直後は影響が小さく、1年経つとフルに効く。「最初は変わらなかったのに」と後で言われる余地がある。","src":"健康保険法99条【一次】","st":"law"},{"t":"sjt","dom":"給付","scene":"従業員からの質問","ask":"（従業員）厚生年金が減るのは分かりました。遺族年金は関係ないですよね？","opts":[{"x":"遺族年金は別なので影響ありません","r":"ng"},{"x":"遺族厚生年金も減ります。定額の遺族基礎年金は変わりません","r":"ok"},{"x":"遺族基礎年金も遺族厚生年金も減ります","r":"wrong"}],"ex":"遺族厚生年金＝報酬比例部分の4分の3。標準報酬が下がれば減る。障害厚生年金も同じ構造。<br><br>遺族厚生年金＝報酬比例部分の<strong>4分の3</strong>。障害厚生年金も同じ構造。<strong>定額の遺族基礎年金は影響なし</strong>。<br><br>⚠️ 受給権者が<strong>老齢厚生年金の受給権を持つ配偶者</strong>の場合は別計算（「4分の3」と「4分の3×2/3＋自分の老齢厚生年金×1/2」の多い方）。一律4分の3で説明すると実額が合わない。","src":"厚生年金保険法60条1項1号・2号【一次】","st":"law"},{"t":"ox","dom":"給付","line":"2028年4月からの改正で、遺族厚生年金は全員が5年で打ち切りになる。","ans":"×","ex":"<strong>「全員が5年で打ち切り」は誤り</strong>。<br><br>令和7年法律第74号（2025年6月20日公布・<strong>施行2028年4月</strong>）で男女差が解消され、<strong>60歳未満で死別した場合が原則5年の有期給付</strong>になる。ただし——<br>・<strong>60歳以上で死別した方は無期給付のまま</strong><br>・<strong>こどもを養育している間</strong>は現行どおり<br>・<strong>すでに受給している方</strong>は変わらない<br>・<strong>2028年度に40歳以上になる女性</strong>は変わらない<br><br>5年経過後も所得に応じて逓減する構造で、障害年金の受給権者や低所得なら継続する。","src":"令和7年法律第74号／厚生労働省「年金制度改正の全体像」【一次】","st":"law"},{"t":"sjt","dom":"ガバ","scene":"経営者からの質問","ask":"（経営者）そんなにいい制度なら、なんでメインバンクは何も言ってこないの？","opts":[{"x":"銀行は自社の商品しか売らないからです","r":"ng"},{"x":"儲からないからです。銀行の商売の形に乗らない制度なんです","r":"ok"},{"x":"銀行の担当者がこの制度を知らないからです","r":"wrong"}],"ex":"iDeCo+は従業員個人のiDeCoへの上乗せで、金融機関が会社と契約するわけではない。手続きの窓口も国民年金基金連合会。<br><br><strong>構造の説明として言うのが正解</strong>。悪口として言うと、経営者は「この人は他社の悪口を言う人だ」と受け取る。<br><br>1・3は他社の内情を決めつけている。2は<strong>制度の建て付けから説明している</strong>ので、誰も貶めずに答えになっている。","src":"制作者（株式会社LSFP）の考え方","st":"lsfp"},{"t":"sjt","dom":"ガバ","scene":"経営者からの質問","ask":"（経営者）その資格、本当に持ってるかどうか、こっちは確かめようがないよね？","opts":[{"x":"全部、公開されています。その場で調べていただいて構いません","r":"ok"},{"x":"そう言われましても、こればかりは信用していただくしかありません","r":"timid"},{"x":"そう疑われるなら、他をあたっていただいて構いません","r":"wrong"}],"ex":"<strong>この質問に即答できるかどうかで信用が決まる</strong>。金融商品仲介業者の登録は金融庁のサイト、CFPは日本FP協会のサイトで確認できる。所属する金融商品取引業者は名刺・書面への記載義務がある。<br><br>「調べてください」と自分から言える人はほとんどいない。<strong>言えること自体が差別化になる</strong>。<br><br>2は<strong>他社批判ではなく、判断の物差しを渡す形</strong>。同じ物差しが自分にも当たるのでフェアに聞こえる。","src":"制作者（株式会社LSFP）の考え方","st":"lsfp"},{"t":"sjt","dom":"出口","scene":"従業員からの質問","ask":"（従業員）途中で必要になったら、引き出せますか？","opts":[{"x":"引き出せません。原則60歳までです","r":"ok"},{"x":"引き出しの条件は確認が必要です。調べてご連絡します","r":"timid"},{"x":"まとまったご事情があれば、途中でも引き出せます","r":"ng"}],"ex":"<strong>最初に、はっきり言う</strong>。後回しにすると「聞いてない」になり、会社への不満に化けて、紹介したアドバイザーに跳ね返る。<br><br>説明会では最初の方に置くべき項目。","src":"確定拠出年金法33条（法73条により個人型へ準用）／60歳前は障害給付金37条・死亡一時金40条・脱退一時金 附則3条1項に限られる【一次】","st":"law"},{"t":"sjt","dom":"運用","scene":"従業員からの質問","ask":"（従業員）30年やったら、いくらになりますか？","opts":[{"x":"過去の実績なら年5%は堅いので、30年で約2,500万円になります","r":"ng"},{"x":"お約束はできません。3%・5%・0%の3通りで見てみましょう","r":"ok"},{"x":"過去の実績から見て、5%は堅い数字です","r":"wrong"}],"ex":"「数字を出すな」ではない。前提（利回り・期間・手数料）を明示し、下振れを含む複数のケースで示す。その数字の根拠を言えることが条件。<br><br><strong>断定的判断の提供</strong>にあたる。<br><br>「数字を出すな」ではない。<strong>前提を明示し、下振れを含む複数のケースで示す</strong>のが正解。<strong>その数字の根拠を言えることが条件</strong>で、幅で出せば何でもよいわけではない。<br><br>3も誤り。元本確保型でも<strong>手数料で目減りする可能性</strong>がある。","src":"金融商品取引法38条2号（断定的判断の提供の禁止／仲介業者には66条の14第1号ロで適用）／金融サービス提供法5条・6条【一次】","st":"law"},{"t":"sjt","dom":"比較","scene":"25歳の従業員から","ask":"（従業員）iDeCoって早く始めた方が得ですよね？枠いっぱいやった方がいいですか？","opts":[{"x":"若いほど複利が効くので、枠いっぱいやった方がいいです","r":"ng"},{"x":"まずNISAをどう使うかから考えることが多いです","r":"ok"},{"x":"若いうちは何もしなくていいです","r":"wrong"}],"ex":"iDeCoは60歳まで出せないので、後半でキャッチアップする形が合う場合がある。<br><br><strong>「若いから枠いっぱいiDeCo」は多くの場合うまくいかない</strong>。若い人は課税所得が低く所得控除が効きにくいうえ、住宅・教育で資金が要る時期に60歳まで出せない金を積み上げることになる。<br><br>⚠️ ただし<strong>課税所得が高く、当面の資金需要がない方は別</strong>。一律に否定するのも誤り。","src":"制作者（株式会社LSFP）の考え方","st":"lsfp"},{"t":"sjt","dom":"比較","scene":"25歳の従業員から（続き）","ask":"（従業員）じゃあ、会社が出してくれる分だけもらうことはできますか？","opts":[{"x":"会社の分だけ受け取れます","r":"ng"},{"x":"ご自身も最低額を出していただくと、会社の分が乗ります","r":"ok"},{"x":"会社の分だけ受け取ることはできません。制度に参加しないという選択になります","r":"wrong"}],"ex":"iDeCo+は本人のiDeCoへの上乗せ。この上乗せは自分のお金ではないので、受け取らない理由は基本的にない。<br><br><strong>「会社の分だけもらう」はできない</strong>。iDeCo+は本人のiDeCoへの上乗せなので、<strong>本人がiDeCoに加入し、自分でも拠出している</strong>ことが前提。<br><br>1は事実として正しいが、<strong>そこで終わると機会を潰す</strong>。2は前提を伝えたうえで、受け取らない損を示している。","src":"確定拠出年金法68条の2第1項（加入者が掛金を拠出する場合に上乗せできる）【一次】","st":"law"},{"t":"sjt","dom":"掛金","scene":"経営者の配偶者（専業主婦）から","ask":"（配偶者）iDeCoの上限が6.2万円に上がるんですよね？私も増やせますか？","opts":[{"x":"6.2万円まで増やせます","r":"ng"},{"x":"第3号被保険者の方は23,000円のまま据え置きです","r":"ok"},{"x":"はい、全員6.2万円になります","r":"wrong"}],"ex":"6.2万円に上がるのは企業年金のない会社員など。<br><br>★<strong>「iDeCoは6.2万円に上がる」と一括りに言うと嘘になる相手が2種類いる</strong>。<br><br>①<strong>企業年金がある人</strong>（枠から事業主掛金等が控除される）<br>②<strong>第3号被保険者</strong>（23,000円で据え置き・引き上げなし）<br><br>3も誤り。第3号被保険者もiDeCoには加入できる。","src":"確定拠出年金法施行令36条（2026年12月1日施行版）第6号【一次】","st":"law"},{"t":"sjt","dom":"出口","scene":"50代の従業員から","ask":"（従業員）一時金と年金、どっちがいいですか？","opts":[{"x":"一時金の方が税金は安く済みますので、迷わず一時金をおすすめします","r":"ng"},{"x":"退職金の額と勤続年数で答えが逆転します。確認させてください","r":"ok"},{"x":"年金の方が長くもらえるので、そちらが有利です","r":"wrong"}],"ex":"一時金は退職所得、年金は雑所得で公的年金と合算。決め手は①退職金の額 ②勤続年数 ③DCの資産額 ④他の所得。併用もできる。<br><br>3も誤り。<strong>併用できる</strong>（一部を一時金、残りを年金）。<br><br>決め手は4つ＝<strong>①会社の退職金の額 ②勤続年数（退職所得控除を使い切るか）③DCの資産額 ④公的年金と他の所得</strong>。<br><br>さらに<strong>年金で受け取ると、国民健康保険料・介護保険料・後期高齢者医療の算定にも入る</strong>。税だけ見て決めると手取りが減ることがある。","src":"所得税法30条（退職所得）・35条3項（公的年金等）／年金受取は国保・介護・後期高齢者医療の算定に影響【一次】","st":"law"},{"t":"ox","dom":"出口","line":"DCの一時金を先に受け取り、その5年後に会社の退職金を受け取れば、退職所得控除は満額使える。","ans":"×","ex":"<strong>2026年1月1日以後に受け取るDC一時金からは、重複排除の期間が「前年以前9年内」に延びた</strong>（それ以前は前年以前4年内）。5年空けても足りない。<br><br>⚠️ 条文はさらに細かく、9年ルールが働く場面でも<strong>令和8年1月1日前に受け取った退職手当等は「前年以前4年内」のまま</strong>。<br><br><strong>「いつ・どの順番で受け取るか」で税額が変わる。ここが専門性の出るところ。</strong>","src":"所得税法施行令70条1項2号【一次】","st":"law"},{"t":"ox","dom":"出口","line":"退職所得控除は縮小されることが決まっており、勤続20年超の年70万円は40万円になる。","ans":"×","ex":"<strong>決まっていない</strong>。令和8年度税制改正の大綱にも与党税制改正大綱にも記載がなく、現行は40万／70万のまま。<br><br>正しい答え方＝「<strong>議論はされてきましたが、令和8年度改正でも見送られました</strong>」。<br><br>⚠️ 上の9年ルールを「退職所得控除の見直し」と呼ぶ解説が多く、混同されやすい。","src":"所得税法30条3項（2026年8月12日施行版）／令和8年度税制改正の大綱【一次】","st":"law"},{"t":"sjt","dom":"出口","scene":"従業員からの質問","ask":"（従業員）もし私が死んだら、掛金はどうなりますか？","opts":[{"x":"ご家族に死亡一時金として支払われます。500万円まで非課税です","r":"ng"},{"x":"ご遺族に支払われます。ただし非課税枠は受取人によって変わります","r":"ok"},{"x":"相続財産として通常どおり相続されます","r":"wrong"}],"ex":"500万円×法定相続人の非課税枠が使えるのは、受け取る方が相続人である場合に限られる。受取人の指定で扱いが変わる。<br><br>★<strong>実務価値が最も高い論点</strong>。<br><br>・確定拠出年金法の「遺族」には<strong>内縁の配偶者も入る</strong>（届出がなくても事実婚なら可）<br>・しかし相続税法の非課税枠は<strong>「相続人」限定</strong>。国税庁は「相続人以外の人が取得した退職手当金等には、非課税の適用はありません」と明記<br>・<strong>＝2つの範囲がズレている</strong><br><br>3も誤り。<strong>確定拠出年金法に「時効」の条文は存在しない</strong>。5年で「遺族なし」とみなされ<strong>相続財産に切り替わる</strong>（受給権者の切替）。「時効2年」は国民年金法の死亡一時金の話。","src":"確定拠出年金法40条・41条・73条／相続税法12条1項7号／国税庁 No.4117【一次】","st":"law"},{"t":"sjt","dom":"教育","scene":"経営者からの質問","ask":"（経営者）投資教育って、法律でやらないといけないの？","opts":[{"x":"投資教育は法律上の義務があります","r":"ng"},{"x":"iDeCo+に投資教育の義務はありません。企業型DCにはあります","r":"ok"},{"x":"義務はないので、何もしなくて構いません","r":"wrong"}],"ex":"ただし事業主には、加入者への協力と法令遵守の指導に努める義務がある（確定拠出年金法78条）。<br><br>★<strong>3制度で扱いが違う典型</strong>。<br><br>・<strong>企業型DC＝努力義務</strong>（確定拠出年金法22条）<br>・<strong>iDeCo系</strong>＝22条の主体が「連合会」に読み替えられる（73条）ので<strong>iDeCo+の事業主には及ばない</strong><br>・<strong>罰則もない</strong>（罰則条項118〜124条に22条・68条の2・73条・78条は一切引用されていない）<br><br>⚠️ ただし1も言い過ぎ。<strong>法78条</strong>に「必要な協力をするとともに、法令及び規約が遵守されるよう指導等に努めなければならない」という<strong>努力義務がある</strong>。","src":"確定拠出年金法22条・68条の2・73条・78条・118〜124条【一次】","st":"law"},{"t":"sjt","dom":"運用","scene":"従業員からの質問","ask":"（従業員）何を選べばいいか分かりません。おすすめを教えてください。","opts":[{"x":"全世界株式のインデックスファンドがいいですよ。私も持っています","r":"ng"},{"x":"特定の商品はお勧めできません。考え方はご説明します","r":"ok"},{"x":"元本確保型にしておけば、まず安心です","r":"wrong"}],"ex":"置いておくだけでも毎月手数料がかかることと、分散の考え方は伝える。選ぶのは本人。<br><br>1も誤り。元本確保型は<strong>手数料で目減りする可能性がある</strong>のに「安心」と言い切っている。<br><br>3は不親切なだけでなく、<strong>放置されると会社が出した掛金が実質減る</strong>。<br><br><strong>「勧めない」と「何も言わない」は別。判断材料は渡す。</strong>","src":"確定拠出年金法100条6号／厚労省年金局長通知（平13.8.21 年発第213号）第9(4)③「推奨」「助言」の定義【一次】","st":"law"},{"t":"sjt","dom":"運用","scene":"経営者からの質問","ask":"（経営者）社員それぞれ、使っている金融機関がバラバラなんだけど、揃えないとダメ？","opts":[{"x":"揃える必要はありません","r":"ok"},{"x":"金融機関の扱いは確認してからご回答します","r":"timid"},{"x":"会社で1社に統一してください。その方が管理が楽です","r":"ng"}],"ex":"iDeCo+は<strong>従業員個人のiDeCo口座への上乗せ</strong>なので、会社が運営管理機関を選ぶ必要も統一する必要もない。会社は<strong>合算して1本で納める</strong>だけ。<br><br><strong>企業型DCとの大きな違い</strong>。「金融機関を選ぶのが大変そう」と身構えている経営者には、ここで一気に軽くなる。","src":"確定拠出年金法65条（運営管理機関を指定するのは加入者本人）・55条2項3号・60条1項【一次】","st":"law"},{"t":"sjt","dom":"掛金","scene":"経営者からの質問","ask":"（経営者）長くいる社員には多く出したい。勤続年数で分けられる？","opts":[{"x":"できます。勤続年数で分けられます","r":"ng"},{"x":"制度上はできます。ただ引受先によって違うので確認させてください","r":"ok"},{"x":"勤続年数での区分は、法律で禁止されています","r":"wrong"}],"ex":"勤続期間による区分は認められている3類型のひとつ。ただし勤続年数別・役職別は継続管理が複雑になるため受け付けない引受先もある。<br><br>★<strong>「制度上できること」と「引受先が受けること」は別</strong>。<br><br>1と3は<strong>制度の説明として誤り</strong>（勤続期間による区分は認められている3類型のひとつ）。顧問社労士がいる会社で「法律で禁止」と言うと、その場で訂正されて信用を失う。<br><br><strong>勤続年数別・役職別は継続管理が複雑になるため受け付けない引受先もある。</strong>","src":"制度上の可否＝確定拠出年金法68条の2／受付範囲は引受先ごとに異なる","st":"other"},{"t":"sjt","dom":"掛金","scene":"経営者からの質問","ask":"（経営者）役員には多めに、社員には一律で出したい。これはできる？","opts":[{"x":"できます。役員と一般従業員で分けられます","r":"ok"},{"x":"区分ができるかは確認が必要なので、持ち帰ります","r":"timid"},{"x":"役員だけに出すこともできますよ","r":"ng"}],"ex":"<strong>役員と一般従業員で分けることは制度上可能</strong>。ここは言い切ってよい。<br><br>ただし2点添える。<strong>区分を設ける場合は規程の提出が必要</strong>。そして<strong>引受先が受け付けるかは別途確認</strong>。<br><br>⚠️ <strong>「役員だけを対象にする（従業員には出さない）」は別の話</strong>。合理的な区分として認められるかは地方厚生（支）局への事前相談案件で、<strong>その場で言い切ってはいけない</strong>。「役員に多め」と「役員だけ」は境界がひとつ違うだけで答えが変わる。","src":"制度上の可否＝確定拠出年金法68条の2／受付範囲は引受先ごとに異なる","st":"other"},{"t":"sjt","dom":"教育","scene":"経営者に頼まれて","ask":"（経営者）区分を設けたいから、就業規則の書き方を教えてよ","opts":[{"x":"（就業規則の条文案を作って渡した）","r":"ng"},{"x":"論点は整理します。条文の作成は顧問社労士さんへおつなぎします","r":"ok"},{"x":"条文案は作れないので、区分の話はやめましょう","r":"wrong"}],"ex":"制度の誤りではなく<strong>他の資格者の業務範囲</strong>の問題。<br><br>1のように<strong>話ごと引っ込めるのも間違い</strong>。論点整理まではやってよい。<br><br>⚠️ 社労士法の業務独占は「報酬を得て、業として」行う場合に及ぶもので、<strong>論点整理と条文作成の線引きには実務上の幅がある</strong>。個別の判断は社労士・弁護士への確認が要る。","src":"社会保険労務士法2条1項1号・2号／27条（社労士でない者は「報酬を得て、業として」これらを行えない）。2条1項3号の相談・指導は制限対象外（昭43.12.9 庁保発第23号）【一次】","st":"law"},{"t":"ox","dom":"ガバ","line":"過半数代表者は、経営者が信頼できる社員を指名して選任してよい。","ans":"×","ex":"要件は3つ。<strong>①管理監督的地位にない ②投票・挙手など民主的な方法で選ばれた ③使用者の意向で選ばれていない</strong>。<br><br><strong>経営者が「じゃあ君ね」と決めるのはダメ</strong>。形式の問題ではなく、後で「会社が勝手に決めた」と言われると<strong>労使合意そのものが崩れる</strong>。朝礼で挙手を取るだけでもいいので、選んだ記録を残す。","src":"確定拠出年金法施行規則56条の3が同規則2条1項を準用（①労基法41条2号の管理監督者でない ②選出であることを明らかにした投票・挙手等で、事業主の意向に基づかない）【一次】","st":"law"},{"t":"ox","dom":"可否","line":"iDeCo+を始めるには、企業型DCと同じように年金規約を作成し、地方厚生（支）局の承認を受ける必要がある。","ans":"×","ex":"<strong>届出だけ</strong>。規約作成も承認も不要。これが「導入が格段に軽い」と言われる理由で、<strong>iDeCo+には契約する相手がいない</strong>（国民年金基金連合会へ書類を出す）。<br><br>⚠️ ただし<strong>資格区分を設ける場合は地方厚生（支）局への事前相談</strong>が要るケースがある。「何も要りません」と言い切らないこと。","src":"確定拠出年金法68条の2第6項・同施行規則56条の6（国基連への届出のみ）／企業型DCは法3条1項で厚生労働大臣の承認【一次】","st":"law"},{"t":"ox","dom":"掛金","line":"業績が悪化した場合、事業主掛金は翌月から自由に減額・停止できる。","ans":"×","ex":"<strong>変更は年1回まで</strong>（12月から翌年11月までの間に1回）。「業績次第で調整できます」と経営者に約束すると守れない。<br><br><strong>掛金は実質的に下げにくい固定費</strong>なので、最初から無理のない額で設計する。<br><br>なお<strong>マッチング拠出の変更も政令で年1回</strong>。規約次第なのは企業型DCの事業主掛金の方。","src":"確定拠出年金法施行令29条4号ハ・6条4号ハ・10条の2【一次】","st":"law"},{"t":"ox","dom":"掛金","line":"マッチング拠出には、法律で定められた最低掛金額（月5,000円）がある。","ans":"×","ex":"<strong>マッチング拠出に法定の最低額はない</strong>。法・施行令・施行規則のいずれにも定めがなく、額は企業型年金規約で決まる。<strong>iDeCo+の5,000円下限をマッチングに当てるのは誤り</strong>。<br><br>⚠️ また「本人掛金 ≦ 事業主掛金」の制限は<strong>2026年4月1日に撤廃済み</strong>。古い解説を引かないこと。","src":"確定拠出年金法19条4項／法4条1項3号の2の版比較【一次】","st":"law"},{"t":"ox","dom":"出口","line":"懲戒解雇した社員について、会社は拠出済みの掛金の返還を求めることができる。","ans":"×","ex":"拠出済みの掛金は<strong>本人の資産（個人別管理資産）</strong>。退職金規程で「懲戒解雇なら不支給」とできるのとは、まったく違う。<br><br><strong>これは経営者に先に言うこと</strong>。後から知ると「そんなの聞いてない」になる。<br><br>しかも<strong>勤続年数別の区分を受け付けない引受先も多い</strong>ので、「入ってすぐ辞める人には出さない」設計で回避することもできない場合がある。","src":"事業主への返還は確定拠出年金法84条（企業型・勤続3年未満・規約の定め）のみで、法73条はこれを個人型に準用していない＝根拠規定の不存在【一次】","st":"law"},{"t":"sjt","dom":"出口","scene":"従業員からの質問","ask":"（従業員）転職したら、会社が出してくれた分はどうなりますか？","opts":[{"x":"そのままご本人の資産です。持ち運べます","r":"ok"},{"x":"退職後の扱いは確認してご連絡します","r":"timid"},{"x":"会社が出した分は、退職時に返していただきます","r":"ng"}],"ex":"退職後は本人のiDeCoとして継続し、事業主掛金だけが止まる。転職先がiDeCo+をやっていれば、そこの上乗せに切り替わる。<br><br><strong>持ち運べるのがDCの最大の特徴</strong>。退職金制度と根本的に違う。転職が当たり前の世代にはここが刺さる。","src":"確定拠出年金法2条12項（個人別管理資産）・80〜83条（移換）／法62条4項の資格喪失事由に退職は含まれない【一次】","st":"law"},{"t":"sjt","dom":"教育","scene":"50代の従業員が多い会社の説明会","ask":null,"opts":[{"x":"受け取り方ですが、一時金の方が有利なので、皆さん一時金を選んでください。","r":"ng"},{"x":"答えが人によって逆転します。個別にお受けします","r":"ok"},{"x":"年金の方が有利です","r":"wrong"}],"ex":"退職金の額と勤続年数で逆転する。この場では判断材料まで。<br><br>★<strong>出口の話を集合研修でやってはいけない</strong>。<br><br>3も誤り。<strong>受け取る順番とタイミングは事前に設計が要る</strong>（9年ルール）。<br><br><strong>基礎は集合、出口は個別。分けるのは年齢ではなく「集合で言えるか、言えないか」。</strong>","src":"制作者（株式会社LSFP）の考え方","st":"lsfp"},{"t":"sjt","dom":"出口","scene":"25歳の従業員から","ask":"（従業員）ねんきん定期便を見たけど、これしかもらえないんですか？年金なんてあてになりませんね","opts":[{"x":"公的年金だけでは足りないので自分で備えましょう","r":"ng"},{"x":"それは、これまで払った分だけの金額です","r":"ok"},{"x":"公的年金は将来もらえなくなる可能性があります","r":"wrong"}],"ex":"50歳未満の定期便は将来の見込額ではない。若い方が年金に絶望する原因の多くがこの読み違い。<br><br>★<strong>50歳未満の定期便は「これまでの加入実績に応じた額」</strong>。将来の見込額ではない。<br><br>25歳が見れば当然小さい額が載っており、それを見て「やっぱりもらえない」と誤解する。<strong>この読み方を教えるだけで態度が変わる</strong>。<br><br>（50歳以上は60歳まで同条件で加入した仮定の見込額。ただし<strong>60歳以上65歳未満は実績ベースに戻る</strong>）","src":"日本年金機構「ねんきん定期便の見方ガイド（令和8年度送付分）」【一次】","st":"law"},{"t":"sjt","dom":"掛金","scene":"経営者からの質問","ask":"（経営者）業績次第で掛金を増やしたり減らしたりできる？","opts":[{"x":"掛金の変更は年1回までです","r":"ok"},{"x":"変更の回数は制度によるので、確認してご連絡します","r":"timid"},{"x":"業績に応じて毎月調整できます","r":"ng"}],"ex":"毎年12月から翌年11月までの間に1回と政令で決まっている。<br><br>ここは言い切ってよい。<strong>政令で年1回</strong>と決まっている。「業績次第で調整できます」と約束すると守れない。<br><br>だからこそ<strong>最初は無理のない額から</strong>。月1,000円でも制度は成立する。<br><br>なお<strong>マッチング拠出の変更も政令で年1回</strong>。規約次第なのは企業型DCの事業主掛金の方。","src":"確定拠出年金法施行令29条4号ハ・6条4号ハ・10条の2【一次】","st":"law"},{"t":"sjt","dom":"税社保","scene":"経営者からの質問","ask":"（経営者）会社が出した掛金は経費になる？","opts":[{"x":"全額が損金になります","r":"ok"},{"x":"税務の話は税理士さんにご確認ください","r":"timid"},{"x":"経費になるので、実質タダで福利厚生ができます","r":"ng"}],"ex":"法人なら損金、個人事業主なら必要経費。ここは言い切ってよい。<br><br>⚠️ ただし<strong>「経費になるからお得」は別の話</strong>。<strong>給与も経費</strong>なので、法人税の面では差がつかない。差がつくのは<strong>会社の社会保険料負担</strong>と<strong>従業員側の税・社保</strong>の2つだけ。","src":"法人税法施行令135条4号（法人は損金算入）／所得税法施行令64条2項（個人事業主は必要経費）【一次】","st":"law"},{"t":"sjt","dom":"教育","scene":"経営者からの質問","ask":"（経営者）どのくらいで始められる？","opts":[{"x":"3〜4か月はみてください","r":"ok"},{"x":"期間はケースによるので、確認してからご回答します","r":"timid"},{"x":"書類さえ出せば、来月からでも始められます","r":"ng"}],"ex":"一番時間がかかるのは書類ではなく、従業員のiDeCo加入手続き（口座開設・審査に1〜2か月）。<br><br>ここは言い切ってよい。届出は<strong>拠出開始月の前月20日必着</strong>だが、<strong>律速は従業員のiDeCo加入</strong>（口座開設・審査に1〜2か月）。<br><br>全員が未加入の会社なら3か月以上みる。経営者に「来月から」と言われたときに、ここで正直に言えるかどうか。","src":"確定拠出年金法68条の2第6項・同施行規則56条の6（届出）／厚労省・国基連「iDeCo＋導入ガイド」p.5【一次】","st":"law"},{"t":"ox","dom":"税社保","st":"law","line":"選択制DCで給与を減額し、その減額分を掛金とすると、社会保険料は必ず下がる。","ans":"○","ex":"<strong>雇用保険料が下がるから。</strong><br><br>雇用保険料は<strong>賃金総額に料率を乗じて</strong>計算する（労働保険徴収法11条1項・2項）。標準報酬月額のような等級制ではないので、<strong>賃金が減れば比例して必ず下がる</strong>。<br><br>一方、健康保険料・厚生年金保険料は<strong>標準報酬月額（等級制）</strong>。等級をまたがなければ1円も変わらない。<br><br>つまり<strong>「下がるのは雇用保険料だけ」という場合がある</strong>。しかも料率が小さいので金額は小さい。社内の試算では、月給30万円・掛金1万円で<strong>年600円ほど</strong>。<br><br>⚠️ 雇用保険の被保険者でない方（週20時間未満など）は、そもそも雇用保険料がないので下がらない。<br><br>⚠️ <strong>言い方に注意</strong>。「給与から掛金を出す」ではない。拠出するのは<strong>事業主</strong>（確定拠出年金法19条1項）で、従業員が出すのではない。厚労省も「<strong>事業主掛金について事業主が拠出せず、給与から控除する等により加入者に負担させることは認められない</strong>」と明記している（確定拠出年金Q&A No.70）。正しくは「<strong>給与や賞与を減額して、その減額分をもって掛金とする</strong>」。自ら拠出するのは<strong>マッチング拠出</strong>のほう（同法19条3項）。","src":"労働保険の保険料の徴収等に関する法律11条1項・2項（賃金総額）／健康保険法3条5項・厚生年金保険法3条1項3号【一次】"},{"t":"ox","dom":"税社保","st":"law","line":"選択制DCで給与を減額して掛金としても、標準報酬月額の等級が変わらなければ、負担する保険料は1円も変わらない。","ans":"×","ex":"<strong>雇用保険料は下がる。</strong><br><br>等級が変わらなければ<strong>健康保険料・厚生年金保険料は変わらない</strong>。ここは正しい。ただし<strong>雇用保険料は賃金総額がもと</strong>なので、等級とは関係なく下がる。<br><br>「社会保険料」と一括りにすると外す。<strong>何の保険料の話かを分けて答えられるか</strong>が問われる。<br><br>★<strong>そして、ここが選択制DCで一番大事な非対称</strong>。<br>保険料はほとんど変わらないのに、<strong>育児休業給付・失業給付は賃金日額がもと</strong>なので減る。<strong>等級をまたがなかった人は、保険料が1円も安くならないのに、育休給付だけ減る</strong>ということが起こり得る。<br><br>社内の試算では、月給30万円・掛金1万円で<strong>雇用保険料の軽減 年600円 に対し、育児休業給付の減少 年72,247円。約120倍</strong>。","src":"労働保険徴収法11条（賃金総額）／健康保険法41条・厚生年金保険法21条（標準報酬月額）／厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70【一次】※試算は社内資料"},{"t":"ox","dom":"識別","st":"law","line":"選択制DCは、従業員が自分の給与から掛金を出す仕組みである。","ans":"×","ex":"<strong>拠出するのは事業主。</strong>確定拠出年金法19条1項「<strong>事業主は…掛金を拠出する</strong>」。選択制DCは、給与を減額したうえで、その分を<strong>事業主が</strong>掛金として拠出する形。<br><br>厚労省も明記している。「<strong>事業主掛金について事業主が拠出せず、給与から控除する等により加入者に負担させることは認められない</strong>」（確定拠出年金Q&A No.70）。<br><br><strong>自ら拠出するのはマッチング拠出のほう</strong>（同法19条3項「企業型年金加入者は…自ら掛金を拠出することができる」）。<br><br>★この2つを取り違えると、社長への説明が根本から狂う。「従業員が給与から出す」と言うと、認められていない形を提案していることになる。","src":"確定拠出年金法19条1項・3項／厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「選択制DCは、給与から控除して掛金にする仕組みです」— この説明でよい。","ans":"×","ex":"★<strong>1語しか違わないが、可否が逆になる。</strong><br><br>✅ 給与を<strong>減額</strong>し、その減額分を事業主が<strong>拠出</strong>する → <strong>可</strong>（給与規程の問題）<br>❌ 給与から<strong>控除</strong>して加入者に負担させる → <strong>不可</strong><br><br>厚労省Q&A No.70「<strong>事業主掛金について事業主が拠出せず、給与から控除する等により加入者に負担させることは認められない</strong>」。<br><br>⚠️ ただし<strong>マッチング拠出とiDeCoの本人掛金は、給与から控除してよい</strong>（法21条の3第1項・71条1項）。<strong>掛金の種類で「給与控除OK／NG」が分かれる</strong>のが、この誤りの発生源。","src":"厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70／確定拠出年金法19条1項【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"iDeCo+では、従業員が「iDeCo+に加入」して、iDeCo+の口座で運用する。","ans":"×","ex":"一文に<strong>3つの誤り</strong>がある。<br><br>① 従業員が加入するのは<strong>iDeCo</strong>（法62条1項）。iDeCo+では<strong>「拠出対象者」になる</strong>（法68条の2第2項）<br>② <strong>iDeCo+固有の口座はない</strong>。資産は本人のiDeCoの<strong>個人別管理資産</strong>に合算される（法2条12項・69条）<br>③ 本人がiDeCoに加入し掛金を出していなければ、事業主掛金だけを出すことはできない<br><br>国基連の手引き「iDeCoの加入者にならなければ、<strong>拠出対象者になれません</strong>」。","src":"確定拠出年金法62条1項・68条の2第2項・2条12項・69条／国基連「中小事業主掛金納付制度の手引き」【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"iDeCo+を始めるには、労使協定を結び、規約を作って申請する。","ans":"×","ex":"<strong>3語すべて誤り。</strong>企業型DCの手続きと混線している。<br><br>❌ 労使協定 → ✅ <strong>同意</strong>（法68条の2第1項「…過半数を代表する者の<strong>同意を得て</strong>」）。労基法36条の労使協定とは別物<br>❌ 規約を作る → ✅ <strong>事業主が作る規約はない</strong>。個人型年金規約を作るのは<strong>連合会</strong>（法55条1項）<br>❌ 申請・承認 → ✅ <strong>届出</strong>（法68条の2第6項「連合会に<strong>届け出なければならない</strong>」）<br><br>⚠️ これを間違えると、<strong>iDeCo+の導入負担を実際より重く説明してしまう</strong>。企業型DCは「同意→規約作成→厚生労働大臣の承認」だが、iDeCo+はそれが一切ない。","src":"確定拠出年金法68条の2第1項・6項／55条1項／3条1項（企業型の承認）／施行規則56条の6【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「選択制DCなら手取りが増えます」— この説明でよい。","ans":"×","ex":"<strong>事実と逆。</strong>給与を減額して掛金に回すので、<strong>その月に手元に入る現金は減る</strong>。<br><br>「増える」と言えるのは、<strong>同じ額を給与で受け取ってから自分で積み立てる場合と比べたとき</strong>だけ。比較の土台を隠して「手取りが増える」と言うのは、<strong>誤解を生じさせる表示</strong>に近づく。<br><br>厚労省Q&A No.70 も、保険料が軽くなる可能性<strong>だけでなく</strong>、給付が減る可能性まで説明する必要があるとして、<strong>メリットだけの説明を明示的に禁じている</strong>。","src":"厚労省「確定拠出年金Q&A（令和8年4月1日施行）」No.70／金融商品取引業等に関する内閣府令117条1項2号【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「元本確保型を選べば元本保証です」— この説明でよい。","ans":"×","ex":"<strong>「元本保証」という語は制度上存在しない。</strong>法令上は<strong>「元本確保型の運用の方法」</strong>。<br><br>元本を下回り得る経路が4つある。<br>① <strong>中途解約時の解約控除</strong>（満期前のスイッチ）<br>② <strong>口座管理手数料</strong>が資産から引かれる（低金利だと利息を上回る）<br>③ <strong>発行体の破綻</strong>（預金は預金保険、保険は生命保険契約者保護機構で保護の枠組みが違う）<br>④ インフレによる実質的な目減り<br><br>⚠️ 確定拠出年金法100条4号は、重要事項について<strong>不実のことを告げる行為</strong>を禁じている。","src":"確定拠出年金法23条1項・2項・100条4号／厚労省Q&A No.130-1〜130-3【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「iDeCoはいつでもやめられます」— この説明でよい。","ans":"×","ex":"<strong>「やめる」を1語で括ってはいけない。</strong><br><br>✅ <strong>掛金の拠出をやめる</strong>（運用指図者になる）→ <strong>できる</strong><br>❌ <strong>積み立てた資産を引き出す</strong> → <strong>原則60歳まで不可</strong><br><br>脱退一時金は、①60歳未満 ②企業型年金加入者でない ③国民年金保険料の免除等を受けている ④通算拠出期間5年以下<strong>または</strong>資産25万円以下 ⑤資格喪失から<strong>2年以内</strong> 等を<strong>すべて満たす場合の例外</strong>。<br><br>⚠️ 拠出を止めても<strong>口座管理手数料はかかり続ける</strong>。しかも止めていた期間は<strong>退職所得控除の勤続年数に入らない</strong>（受給開始年齢の判定には入る）。ここが逆になるので間違えやすい。","src":"確定拠出年金法附則2条の2・3条／国民年金基金連合会「個人型年金規約」132条1項／所得税法施行令69条1項1号ロ【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「iDeCoは受け取るときも非課税です」— この説明でよい。","ans":"×","ex":"<strong>受け取るときは課税される。</strong>一時金なら<strong>退職所得</strong>、年金なら<strong>雑所得（公的年金等）</strong>。<br><br>控除の枠内で結果的に税額ゼロになることはあるが、それは「非課税」ではなく<strong>「課税されたうえで控除により税額が生じない」</strong>。<br><br>⚠️ そもそもiDeCo+の事業主掛金も「非課税」ではない。所得税法施行令64条1項5号は<strong>「給与所得に係る収入金額に含まれない」</strong>と書いている。<strong>非課税所得（所得税法9条）とは別</strong>で、iDeCoは列挙されていない。<br><br>正しくは<strong>「課税の繰延べ」</strong>。","src":"所得税法施行令72条3項7号（退職手当等とみなす一時金）・64条1項5号／所得税法9条・75条【一次】"},{"t":"ox","dom":"言葉","st":"law","line":"「60歳から受け取れます」— 誰にでもこう言ってよい。","ans":"×","ex":"<strong>通算加入者等期間が10年以上ある場合だけ</strong>。10年に満たないと受給できる年齢が繰り下がる。<br><br>60〜61歳＝10年／61〜62歳＝8年／62〜63歳＝6年／63〜64歳＝4年／64〜65歳＝2年／65歳〜＝1月（法33条1項）<br><br>⚠️ <strong>50歳を過ぎて加入した方は、60歳では受け取れない可能性がある。</strong>通算加入者等期間は<strong>60歳に達した日の前日が属する月以前</strong>の期間に限られる（法33条2項）ので、60歳以降に積んでも増えない。","src":"確定拠出年金法33条1項・2項【一次】"}];
const N_SJT=8, N_OX=4;
// 誤答した設問を、日を空けて優先的に出し直す（Leitner）。
// 間違えたものは次のセッションで即戻す（Anki と同じ）。以後 3→7→14→30日と伸ばす
// （Cepeda 2008「最適間隔＝保持期間の10〜20%」に寄せた）。
const STEP=[0,3,7,14,30], KEY='idecoplus_genba_v2';
const qid=q=>(q.ask||q.line||'')+'#'+(q.opts?q.opts.map(o=>o.x).sort().join('|').slice(0,60):'');
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function save(m){ try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){} }
const today=()=>Math.floor(Date.now()/86400000);
function grade(q,ok){
  const m=load(), id=qid(q), r=m[id]||{box:0};
  r.box = ok ? Math.min(r.box+1, STEP.length-1) : 0;
  r.due = today() + STEP[r.box];
  r.miss = (r.miss||0) + (ok?0:1);
  m[id]=r; save(m);
}
function priority(q){                       // 小さいほど先に出す
  const r=load()[qid(q)];
  if(!r) return 1;                          // 未出題
  if(r.due<=today()) return 0 - (r.miss||0);// 期限到来。間違えた回数が多いほど先
  return 2;                                 // まだ寝かせる
}
let Q=[], i=0, log=[], screen='home', RETRY=0;
const $=id=>document.getElementById(id);
function sh(a){for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];}return a;}

function build(){
  const byPri=a=>sh(a).sort((x,y)=>priority(x)-priority(y));
  const sjt=byPri(BANK.filter(q=>q.t==='sjt'));
  const hasTimid=sjt.filter(q=>q.opts.some(o=>o.r==='timid'));
  const rest=sjt.filter(q=>!q.opts.some(o=>o.r==='timid'));
  const pickS=hasTimid.slice(0,3).concat(rest.slice(0,N_SJT-3));
  // 「言葉の正確さ」は柱のひとつなので、毎回必ず1問入れる
  const kotoba=byPri(BANK.filter(q=>q.dom==='言葉')).slice(0,1);
  const pickO=kotoba.concat(byPri(BANK.filter(q=>q.t==='ox'&&q.dom!=='言葉')).slice(0,N_OX-1));
  RETRY = pickS.concat(pickO).filter(q=>{const r=load()[qid(q)]; return r&&r.miss>0;}).length;
  let pool=sh(pickS.concat(pickO)), out=[];
  while(pool.length){ let k=pool.findIndex(q=>!out.length||q.dom!==out[out.length-1].dom); if(k<0)k=0; out.push(pool.splice(k,1)[0]); }
  for(let p=0;p<3;p++){ let fixed=true;
    for(let k=1;k<out.length;k++){ if(out[k].dom!==out[k-1].dom) continue;
      let j=out.findIndex((q,x)=>x>k+1&&q.dom!==out[k-1].dom&&(x+1>=out.length||out[x+1].dom!==out[k].dom)&&out[x-1].dom!==out[k].dom);
      if(j<0) j=out.findIndex((q,x)=>x!==k&&q.dom!==out[k-1].dom);
      if(j>-1){ const t=out[k]; out[k]=out[j]; out[j]=t; fixed=false; } }
    if(fixed) break; }
  Q=out.map(q=>Object.assign({},q,{opts:q.opts?sh(q.opts.slice()):null}));
}

function render(){ if(screen==='home')return home(); if(screen==='result')return result(); question(); }

function home(){
  build(); $('prog').textContent=''; const n=$('next'); n.textContent='はじめる'; n.disabled=false;
  n.onclick=()=>{screen='quiz';i=0;log=[];render()};
  $('app').innerHTML=`<div class="card"><p class="lead">金融アドバイザー向け</p>
   <h2>経営者に、そう聞かれたら。<br>あなたなら、どう答えますか。</h2>
   <p>商談で実際に飛んでくる場面を <strong>${Q.length}問</strong>。<strong>7〜10分</strong>です。</p>
   <ul>
     <li>点数も、合否も出しません。</li>
     <li>返すのは「<strong>あなたが選んだ言い方</strong>」と「<strong>こう言えます</strong>」の対だけです。</li>
     <li>すべて<strong>2026年12月1日施行の改正後</strong>のルールです。</li>
   </ul>
   <div class="hint" style="background:var(--ok-bg);color:var(--ok)"><b>ここは、間違えるための場所です。</b>商談で間違えないために。点数はつけません。記録は端末の中だけです。</div>
   ${RETRY?'<div class="hint">前回まちがえた '+RETRY+'問 が、今回もう一度出ます。</div>':''}
   <div class="hint">迷ったら「確認してご回答します」を選べば安全です。ただし<strong>調べれば分かることまで持ち帰る</strong>と、経営者からは「分かっていない人」に見えます。そこも見ています。</div>
  </div>
  <div class="card"><p class="note">記録は端末の中だけです。どこにも送信しません。認定でも資格でもありません。</p></div>`;
}

function question(){
  const q=Q[i]; $('prog').textContent=(i+1)+' / '+Q.length;
  let h='<div class="card">';
  if(q.t==='ox'){ h+='<p class="scene"><span class="tag">○×</span></p><div class="said">'+q.line+'</div><p class="ask">正しいですか。</p>'; }
  else { if(q.scene) h+='<p class="scene">'+q.scene+'</p>';
         if(q.ask) h+='<div class="said">'+q.ask+'</div>';
         h+='<p class="ask">あなたなら、どう'+(q.ask?'答え':'説明し')+'ますか。</p>'; }
  h+='<div id="s1"></div><div id="fb"></div></div>';
  $('app').innerHTML=h;
  const s1=$('s1');
  const list = q.t==='ox' ? [{x:'正しい',r:q.ans==='○'?'ok':'ng2'},{x:'誤り',r:q.ans==='×'?'ok':'ng2'}]
                          : q.opts;
  list.forEach((o,k)=>{ const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="n">'+(k+1)+'</span><span>'+o.x+'</span>';
    b.onclick=()=>choose(k,list); s1.appendChild(b); });
  const n=$('next'); n.disabled=true; n.textContent=(i===Q.length-1)?'結果を見る':'次へ';
  n.onclick=()=>{ i++; if(i>=Q.length) screen='result'; render(); window.scrollTo({top:0}); };
}

function choose(k,list){
  const q=Q[i], o=list[k];
  const cls = o.r==='ok' ? 'pick-ok' : (o.r==='timid' ? 'pick-warn' : 'pick-ng');
  document.querySelectorAll('#s1 .opt').forEach((b,j)=>{ b.disabled=true;
    if(j===k) b.classList.add(cls); else if(list[j].r==='ok') b.classList.add('show'); });
  const ok=list.find(x=>x.r==='ok');
  let v='', vc='';
  if(o.r==='ok'){ v='そのとおりです。'; vc='v-ok'; }
  else if(o.r==='timid'){ v='ここは、言い切って大丈夫です。'; vc='v-warn'; }
  else if(o.r==='ng'){ v='この一言は、顧客の前では言えません。'; vc='v-ng'; }
  else { v='ここは違います。'; vc='v-ng'; }
  let h='<div class="verdict '+vc+'">'+v+'</div>';
  if(o.r!=='ok' && q.t==='sjt'){
    h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+o.x+'</div>'
      +'<div class="b"><b>こう言えます</b>'+ok.x+'</div></div>';
  }
  h+='<div class="explain">'+q.ex+'<div class="src '+(q.st==='lsfp'?'lsfp':'law')+'">'
    +(q.st==='lsfp'?'これは制度の決まりではなく、<b>制作者（株式会社LSFP）の考え方</b>です':'根拠：'+q.src)+'</div></div>';
  $('fb').innerHTML=h;
  grade(q, o.r==='ok');
  log.push({dom:q.dom, t:q.t, r:o.r, mine:o.x, ok:ok?ok.x:'', line:q.ask||q.line});
  $('next').disabled=false;
  $('fb').scrollIntoView({behavior:'smooth',block:'start'});
}

function result(){
  $('prog').textContent='';
  const ng=log.filter(l=>l.r==='ng'), timid=log.filter(l=>l.r==='timid');
  const oxNg=log.filter(l=>l.t==='ox'&&l.r!=='ok'), wrong=log.filter(l=>l.r==='wrong');
  const fix=ng.concat(wrong);
  let h='<div class="card">';
  h+= fix.length===0 && timid.length===0
    ? '<h2>今回の'+Q.length+'場面では、直すところはありませんでした。</h2>'
    : '<h2>直せる言い回しが、'+(fix.length+timid.length)+'か所 見つかりました。</h2>';
  h+='</div>';
  fix.forEach(m=>{ h+='<div class="card"><div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
    +'</div><div class="b"><b>こう言えます</b>'+m.ok+'</div></div></div>'; });
  if(timid.length){ h+='<div class="card"><h2 style="font-size:18px">ここは、言い切って大丈夫でした</h2>';
    timid.forEach(m=>{ h+='<div class="swap"><div class="a"><b>あなたが選んだ言い方</b>'+m.mine
      +'</div><div class="b"><b>言い切ってよい</b>'+m.ok+'</div></div>'; });
    h+='<div class="warnbox">調べれば分かることまで持ち帰ると、経営者からは「分かっていない人」に見えます。<b>危ない一言を避けることと、言い切るべきことを言い切ることは、別の力です。</b></div></div>'; }
  if(oxNg.length){ h+='<div class="card"><h2 style="font-size:18px">まちがえた事実確認</h2><ul>';
    oxNg.forEach(m=>{ h+='<li>'+m.line+'</li>'; }); h+='</ul></div>'; }
  const says=log.filter(l=>l.t!=='ox'&&l.ok);
  if(says.length){
    h+='<div class="card"><h2 style="font-size:18px">今日の、正しい言い方</h2>'
      +'<p class="note" style="margin-top:-6px">最後にこれだけ読んで終わってください。</p><ul>';
    says.forEach(m=>{ h+='<li>'+m.ok+'</li>'; });
    h+='</ul></div>';
  }
  h+='<div class="card"><p class="note">これは免許でも認定でもありません。制度は変わります。<br>'
   +'掛金の上限額など、改正後の規約がまだ公表されていない論点は出題していません。<br>'
   +'個別の判断は、社労士・税理士・国民年金基金連合会へご確認ください。</p></div>';
  $('app').innerHTML=h;
  const n=$('next'); n.textContent='別の'+Q.length+'問をやる'; n.disabled=false;
  n.onclick=()=>{screen='home';render();window.scrollTo({top:0})};
  window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
